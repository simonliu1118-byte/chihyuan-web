name: WO-0.18.0 Visual Acceptance

on:
  pull_request:
    paths:
      - "src/**"
      - "shared/**"
      - "scripts/visual/**"
      - ".github/workflows/wo-0180-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Capture real React visual fixtures
        run: node scripts/visual/wo0180-capture.mjs
      - name: Upload desktop and phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wo0180-desktop-mobile-visual-qa
          path: artifacts/wo-0180-screenshots
          if-no-files-found: warn
