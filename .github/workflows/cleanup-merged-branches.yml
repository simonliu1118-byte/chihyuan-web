name: Cleanup Merged Branches

# Same approach as CYapps (user 2026-11-03): GitHub deletes a merged PR's head branch, and a manual run
# deletes the branches listed in .github/branch-cleanup.txt. main and any branch with an open PR are kept.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cyweb-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup-merged-head:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_BRANCH" --silent || echo "Already absent: $HEAD_BRANCH"

  cleanup-listed-branches:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the listed branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -f .github/branch-cleanup.txt ] || { echo "No branch list"; exit 0; }
          open_heads="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].head.ref')"
          deleted=0; kept=0; absent=0
          while IFS= read -r branch || [ -n "$branch" ]; do
            branch="${branch%$'\r'}"
            [ -z "$branch" ] && continue
            if [ "$branch" = "main" ] || grep -qxF "$branch" <<<"$open_heads"; then
              echo "Kept: $branch"; kept=$((kept+1)); continue
            fi
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" --silent 2>/dev/null; then
              deleted=$((deleted+1))
            else
              echo "Already absent or not deletable: $branch"; absent=$((absent+1))
            fi
          done < .github/branch-cleanup.txt
          echo "Deleted $deleted, kept $kept, absent $absent"
