name: CY Web Deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker/**"
      - "migrations/**"
      - "scripts/render-deploy-config.mjs"
      - "scripts/resolve-production-identity.mjs"
      - "scripts/audit-account-portal.mjs"
      - "scripts/audit-account-portal.test.mjs"
      - "scripts/render-backup-secrets.mjs"
      - "scripts/audit-backup-configuration.mjs"
      - "scripts/backup-configuration.test.mjs"
      - "scripts/validate-deploy-config.mjs"
      - "scripts/verify-deployed-health.mjs"
      - "scripts/verify-deployment-source.mjs"
      - "scripts/deployment-source.test.mjs"
      - "scripts/verify-secure-entry.mjs"
      - "scripts/secure-entry.test.mjs"
      - "scripts/secure-deployment.test.mjs"
      - "scripts/verify-program-catalog-schedule.mjs"
      - "scripts/program-schedule-deployment.test.mjs"
      - "scripts/test-deployed-health.mjs"
      - "wrangler.deploy.template.jsonc"
      - "vite.config.ts"
      - "package.json"
      - "CYID_CONSUMER_VERSION"
      - "scripts/validate-cyid-consumer-version.sh"
      - "scripts/validate-cyid-consumer-sync.sh"
      - "scripts/sync-cyid-consumer-contract.sh"
      - "docs/contracts/cyid/**"
      - ".github/workflows/development-deploy.yml"
      - ".github/workflows/backup-configuration-audit.yml"
  push:
    branches:
      - deploy/cyweb-development
      - audit/cyweb-identity
  workflow_dispatch:
    inputs:
      operation:
        description: Existing development deploy or read-only account portal audit
        type: choice
        options: [deploy-development, audit-identity, audit-backup]
        default: deploy-development

permissions:
  contents: read

jobs:
  validate-deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cyweb-validate-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify CYID consumer contract support window
        run: bash scripts/validate-cyid-consumer-sync.sh

      - name: Validate deployment template contract
        run: |
          node scripts/validate-deploy-config.mjs
          node --test scripts/test-deployed-health.mjs scripts/program-schedule-deployment.test.mjs scripts/deployment-source.test.mjs

      - name: Test HTTPS entry and deployed transport checks
        run: node --test scripts/secure-entry.test.mjs scripts/secure-deployment.test.mjs

      - name: Test read-only backup configuration audit
        run: node --test scripts/backup-providers.test.mjs scripts/backup-configuration.test.mjs

      - name: Checkout canonical CYID production guard
        uses: actions/checkout@v4
        with:
          repository: simonliu1118-byte/CYapps
          ref: main
          path: .tmp/canonical-cyapps
          persist-credentials: false

      - name: Test read-only account portal audit
        run: node --test scripts/audit-account-portal.test.mjs

      - name: Render CI-only deployment config
        env:
          CF_SOURCE_COMMIT: ${{ github.sha }}
          CF_WORKER_NAME: cyweb-ci
          CF_PUBLIC_HOSTNAME: admin.chihyuancm.com
          CF_D1_DATABASE_NAME: cyweb-ci-db
          CF_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          CF_IDENTITY_SERVICE: cycloud-identity-ci-placeholder
          CF_IDENTITY_APPLICATION_ID: CYWEB
          CF_IDENTITY_WORKSPACE_ID: ws_11111111-1111-4111-8111-111111111111
        run: node scripts/render-deploy-config.mjs --output wrangler.ci.generated.jsonc

      - name: Validate migrations with rendered config
        run: npx wrangler d1 migrations apply DB --local --persist-to /tmp/cyweb-deploy-ci-d1 --config wrangler.ci.generated.jsonc

      - name: Build with rendered Cloudflare config
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: ${{ github.workspace }}/wrangler.ci.generated.jsonc
        run: npx vite build

      - name: Validate deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_CONFIG="$(find dist -type f -name wrangler.json | head -n 1)"
          test -n "$OUTPUT_CONFIG"
          echo "Vite output config: $OUTPUT_CONFIG"
          npx wrangler deploy --dry-run --config "$OUTPUT_CONFIG"

      - name: Remove generated deployment config
        if: always()
        run: rm -f wrangler.ci.generated.jsonc

  deploy-development:
    if: (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-development' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/deploy/cyweb-development')
    needs: validate-deployment-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    concurrency:
      group: cyweb-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_SOURCE_COMMIT: ${{ github.sha }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_PUBLIC_HOSTNAME: admin.chihyuancm.com
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_IDENTITY_SERVICE: ${{ vars.CF_IDENTITY_SERVICE }}
      CYID_LOOKUP_SERVICE: ${{ vars.CF_IDENTITY_SERVICE }}
      CF_IDENTITY_APPLICATION_ID: ${{ vars.CF_IDENTITY_APPLICATION_ID }}
      CF_IDENTITY_WORKSPACE_ID: ${{ vars.CF_IDENTITY_WORKSPACE_ID }}
      CF_BACKUP_ENABLED: ${{ vars.CF_BACKUP_ENABLED }}
      CF_BACKUP_SCHEDULE_ENABLED: ${{ vars.CF_BACKUP_SCHEDULE_ENABLED }}
      CF_BACKUP_R2_BUCKET: ${{ vars.CF_BACKUP_R2_BUCKET }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify CYID consumer contract support window
        run: bash scripts/validate-cyid-consumer-sync.sh

      - name: Verify development deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
            CF_WORKER_NAME CF_PUBLIC_HOSTNAME CF_D1_DATABASE_NAME CF_D1_DATABASE_ID \
            CF_IDENTITY_SERVICE CF_IDENTITY_APPLICATION_ID CF_IDENTITY_WORKSPACE_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required development deployment input: $name" >&2
              exit 1
            fi
          done

      - name: Checkout canonical production Identity resolver
        uses: actions/checkout@v4
        with:
          repository: simonliu1118-byte/CYapps
          ref: main
          path: .tmp/canonical-cyapps
          persist-credentials: false

      - name: Resolve canonical production Identity without changing business D1
        run: node scripts/resolve-production-identity.mjs

      - name: Render existing Worker deployment config
        run: node scripts/render-deploy-config.mjs --output wrangler.development.generated.jsonc

      - name: Validate and prepare protected backup credential
        env:
          GCS_SERVICE_ACCOUNT_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON }}
        run: node scripts/render-backup-secrets.mjs --output "$RUNNER_TEMP/cyweb-backup-secrets.json"

      - name: Verify current reviewed main before remote changes
        run: node scripts/verify-deployment-source.mjs

      - name: Apply development D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.development.generated.jsonc

      - name: Build development Worker and assets
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: ${{ github.workspace }}/wrangler.development.generated.jsonc
        run: npx vite build

      - name: Deploy development Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_CONFIG="$(find dist -type f -name wrangler.json | head -n 1)"
          test -n "$OUTPUT_CONFIG"
          BACKUP_ARGS=()
          if [ "$CF_BACKUP_ENABLED" = "true" ]; then
            BACKUP_ARGS=(--secrets-file "$RUNNER_TEMP/cyweb-backup-secrets.json")
          fi
          DEPLOY_OUTPUT="$(npx wrangler deploy --config "$OUTPUT_CONFIG" "${BACKUP_ARGS[@]}")"
          printf '%s\n' "$DEPLOY_OUTPUT"
          WORKER_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -n 1)"
          if [ -z "$WORKER_URL" ]; then
            echo "Unable to resolve deployed Worker URL from Wrangler output." >&2
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Verify daily program catalog schedule
        run: node scripts/verify-program-catalog-schedule.mjs

      - name: Verify deployed source consumer declaration and D1 health
        shell: bash
        env:
          CYWEB_WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: node scripts/verify-deployed-health.mjs

      - name: Verify HTTPS entry and static asset transport
        env:
          CYWEB_WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: node scripts/verify-secure-entry.mjs

      - name: Accept canonical Custom Domain
        shell: bash
        run: |
          set -euo pipefail
          TARGET="https://${CF_PUBLIC_HOSTNAME}"
          INVALID_SESSION="cyid_$(openssl rand -hex 32)"
          HEADERS_FILE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$HEADERS_FILE" "$BODY_FILE"' EXIT

          for attempt in $(seq 1 24); do
            : > "$HEADERS_FILE"
            : > "$BODY_FILE"
            STATUS="$(curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "$BODY_FILE" \
              --dump-header "$HEADERS_FILE" \
              --write-out '%{http_code}' \
              --cookie "cyweb_identity_session=$INVALID_SESSION" \
              "$TARGET/api/auth/me" || true)"

            if [ "$STATUS" = "401" ] \
              && grep -Eqi '^set-cookie:[[:space:]]*cyweb_identity_session=.*Max-Age=0' "$HEADERS_FILE"; then
              node --input-type=module - "$BODY_FILE" <<'NODE'
          import fs from 'node:fs';

          const bodyPath = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(bodyPath, 'utf8'));
          if (payload?.error?.code !== 'AUTH_INVALID') {
            console.error('Expected error.code AUTH_INVALID.', payload);
            process.exit(1);
          }
          NODE
              echo "CY Web canonical Custom Domain acceptance passed."
              exit 0
            fi

            echo "Canonical hostname not ready yet (attempt ${attempt}/24, status ${STATUS:-curl-error})."
            sleep 10
          done

          echo "Canonical Custom Domain did not become ready within the acceptance window." >&2
          cat "$HEADERS_FILE" >&2 || true
          cat "$BODY_FILE" >&2 || true
          exit 1

      - name: Accept invalid provider session through workers.dev fallback
        shell: bash
        env:
          CYWEB_WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          INVALID_SESSION="cyid_$(openssl rand -hex 32)"
          HEADERS_FILE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$HEADERS_FILE" "$BODY_FILE"' EXIT

          STATUS="$(curl \
            --silent \
            --show-error \
            --output "$BODY_FILE" \
            --dump-header "$HEADERS_FILE" \
            --write-out '%{http_code}' \
            --cookie "cyweb_identity_session=$INVALID_SESSION" \
            "$CYWEB_WORKER_URL/api/auth/me")"

          if [ "$STATUS" != "401" ]; then
            echo "Expected HTTP 401 for invalid provider session, received $STATUS." >&2
            cat "$BODY_FILE" >&2
            exit 1
          fi

          node --input-type=module - "$BODY_FILE" <<'NODE'
          import fs from 'node:fs';

          const bodyPath = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(bodyPath, 'utf8'));
          if (payload?.error?.code !== 'AUTH_INVALID') {
            console.error('Expected error.code AUTH_INVALID.', payload);
            process.exit(1);
          }
          NODE

          if ! grep -Eqi '^set-cookie:[[:space:]]*cyweb_identity_session=.*Max-Age=0' "$HEADERS_FILE"; then
            echo "Expected CY Web to clear cyweb_identity_session after provider rejection." >&2
            cat "$HEADERS_FILE" >&2
            exit 1
          fi

          echo "CY Web workers.dev fallback acceptance passed."

      - name: Require canonical production portal authority after deployment
        run: node scripts/audit-account-portal.mjs --require-production

      - name: Remove generated deployment config
        if: always()
        run: rm -f wrangler.development.generated.jsonc "$RUNNER_TEMP/cyweb-backup-secrets.json"

  audit-identity:
    if: (github.event_name == 'workflow_dispatch' && inputs.operation == 'audit-identity' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/audit/cyweb-identity')
    needs: validate-deployment-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cyweb-identity-audit-${{ github.ref }}
      cancel-in-progress: true
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_IDENTITY_SERVICE: ${{ vars.CF_IDENTITY_SERVICE }}
      CYID_LOOKUP_SERVICE: ${{ vars.CF_IDENTITY_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Checkout canonical CYID production guard
        uses: actions/checkout@v4
        with:
          repository: simonliu1118-byte/CYapps
          ref: main
          path: .tmp/canonical-cyapps
          persist-credentials: false
      - name: Read-only account portal and production authority audit
        run: node scripts/audit-account-portal.mjs

  backup-audit-inputs:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'audit-backup'
    runs-on: ubuntu-latest
    environment: development
    outputs:
      gcs-bucket: ${{ vars.GCS_BUCKET }}
      r2-bucket: ${{ vars.CF_BACKUP_R2_BUCKET }}
      backup-enabled: ${{ vars.CF_BACKUP_ENABLED }}
      schedule-enabled: ${{ vars.CF_BACKUP_SCHEDULE_ENABLED }}
    steps:
      - run: echo "Protected configuration context resolved without logging values."

  audit-backup:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'audit-backup'
    needs: [validate-deployment-contract, backup-audit-inputs]
    uses: ./.github/workflows/backup-configuration-audit.yml
    secrets:
      GCS_BUCKET: ${{ needs.backup-audit-inputs.outputs.gcs-bucket }}
      CF_BACKUP_R2_BUCKET: ${{ needs.backup-audit-inputs.outputs.r2-bucket }}
    with:
      backup-enabled: ${{ needs.backup-audit-inputs.outputs.backup-enabled }}
      schedule-enabled: ${{ needs.backup-audit-inputs.outputs.schedule-enabled }}
