name: CY Web Development Deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker/**"
      - "migrations/**"
      - "scripts/render-deploy-config.mjs"
      - "scripts/validate-deploy-config.mjs"
      - "wrangler.deploy.template.jsonc"
      - "vite.config.ts"
      - "package.json"
      - ".github/workflows/development-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyweb-development-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate deployment template contract
        run: node scripts/validate-deploy-config.mjs

      - name: Render CI-only deployment config
        env:
          CF_WORKER_NAME: cyweb-ci
          CF_D1_DATABASE_NAME: cyweb-ci-db
          CF_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          CF_IDENTITY_SERVICE: cycloud-identity-ci-placeholder
          CF_IDENTITY_APPLICATION_ID: CYWEB
          CF_IDENTITY_WORKSPACE_ID: ws_11111111-1111-4111-8111-111111111111
        run: node scripts/render-deploy-config.mjs --output wrangler.ci.generated.jsonc

      - name: Validate migrations with rendered config
        run: npx wrangler d1 migrations apply DB --local --persist-to /tmp/cyweb-deploy-ci-d1 --config wrangler.ci.generated.jsonc

      - name: Build with rendered Cloudflare config
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: ${{ github.workspace }}/wrangler.ci.generated.jsonc
        run: npx vite build

      - name: Validate deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_CONFIG="$(find dist -type f -name wrangler.json | head -n 1)"
          test -n "$OUTPUT_CONFIG"
          echo "Vite output config: $OUTPUT_CONFIG"
          npx wrangler deploy --dry-run --config "$OUTPUT_CONFIG"

      - name: Remove generated deployment config
        if: always()
        run: rm -f wrangler.ci.generated.jsonc

  deploy-development:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-deployment-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_IDENTITY_SERVICE: ${{ vars.CF_IDENTITY_SERVICE }}
      CF_IDENTITY_APPLICATION_ID: ${{ vars.CF_IDENTITY_APPLICATION_ID }}
      CF_IDENTITY_WORKSPACE_ID: ${{ vars.CF_IDENTITY_WORKSPACE_ID }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify development deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
            CF_WORKER_NAME CF_D1_DATABASE_NAME CF_D1_DATABASE_ID \
            CF_IDENTITY_SERVICE CF_IDENTITY_APPLICATION_ID CF_IDENTITY_WORKSPACE_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required development deployment input: $name" >&2
              exit 1
            fi
          done

      - name: Render development deployment config
        run: node scripts/render-deploy-config.mjs --output wrangler.development.generated.jsonc

      - name: Apply development D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.development.generated.jsonc

      - name: Build development Worker and assets
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: ${{ github.workspace }}/wrangler.development.generated.jsonc
        run: npx vite build

      - name: Deploy development Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_CONFIG="$(find dist -type f -name wrangler.json | head -n 1)"
          test -n "$OUTPUT_CONFIG"
          DEPLOY_OUTPUT="$(npx wrangler deploy --config "$OUTPUT_CONFIG")"
          printf '%s\n' "$DEPLOY_OUTPUT"
          WORKER_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -n 1)"
          if [ -z "$WORKER_URL" ]; then
            echo "Unable to resolve deployed Worker URL from Wrangler output." >&2
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Accept invalid provider session through CY Web
        shell: bash
        env:
          CYWEB_WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          HEADERS_FILE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$HEADERS_FILE" "$BODY_FILE"' EXIT

          STATUS="$(curl \
            --silent \
            --show-error \
            --output "$BODY_FILE" \
            --dump-header "$HEADERS_FILE" \
            --write-out '%{http_code}' \
            --cookie 'cyweb_identity_session=cyweb-development-invalid-session-acceptance' \
            "$CYWEB_WORKER_URL/api/auth/me")"

          if [ "$STATUS" != "401" ]; then
            echo "Expected HTTP 401 for invalid provider session, received $STATUS." >&2
            cat "$BODY_FILE" >&2
            exit 1
          fi

          node --input-type=module - "$BODY_FILE" <<'NODE'
          import fs from 'node:fs';

          const bodyPath = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(bodyPath, 'utf8'));
          if (payload?.error?.code !== 'AUTH_INVALID') {
            console.error('Expected error.code AUTH_INVALID.', payload);
            process.exit(1);
          }
          NODE

          if ! grep -Eqi '^set-cookie:[[:space:]]*cyweb_identity_session=.*Max-Age=0' "$HEADERS_FILE"; then
            echo "Expected CY Web to clear cyweb_identity_session after provider rejection." >&2
            cat "$HEADERS_FILE" >&2
            exit 1
          fi

          echo "CY Web invalid provider-session acceptance passed."

      - name: Remove generated deployment config
        if: always()
        run: rm -f wrangler.development.generated.jsonc
