name: Runtime Check

on:
  pull_request:
    paths:
      - "src/**"
      - "shared/**"
      - "worker/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "vite.config.ts"
      - "wrangler*.jsonc"
      - "tsconfig*.json"
      - ".github/workflows/runtime-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Core contracts
        run: |
          python scripts/validate_schema.py
          python scripts/validate_erp_item_query.py
          node --test scripts/erp-query-history.test.mjs
          node --test scripts/erp-name-search.test.mjs
          node --test scripts/erp-sales-links.test.mjs
          python scripts/validate_foundation.py
          python scripts/validate_identity_foundation.py
          python scripts/validate_module_access.py
          python scripts/validate_business_http_api.py
          python scripts/validate_audit_foundation.py
      - name: Customer service contract
        run: |
          python scripts/validate_customer_service_foundation.py
          python scripts/validate_customer_persistence_related.py
      - name: Customer related mutation contract
        run: python scripts/validate_customer_related_mutations.py
      - name: Customer runtime transport contract
        run: python scripts/validate_customer_runtime_transport.py
      - name: Item contract
        run: python scripts/validate_item_foundation.py
      - name: Defect contract
        run: python scripts/validate_defect_foundation.py
      - name: Sales Work Order contract
        run: python scripts/validate_sales_work_order_foundation.py
      - name: Contractor Outsourcing contract
        run: python scripts/validate_contractor_outsourcing_foundation.py
      - name: WorkLog contract
        run: python scripts/validate_work_log_foundation.py
      - name: WorkLog runtime transport
        run: python scripts/validate_worklog_runtime_transport.py
      - name: Settings Admin contract
        run: python scripts/validate_settings_admin_foundation.py
      - name: Operational runtime contract
        run: python scripts/validate_operational_runtime.py

  browser-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Capture browser TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.json --pretty false > browser-tsc.log 2>&1
          echo $? > browser-tsc.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: browser-tsc-diagnostics
          path: |
            browser-tsc.log
            browser-tsc.exit
      - name: Enforce browser TypeScript
        run: test "$(cat browser-tsc.exit)" = "0"

  worker-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Capture Worker TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.worker.json --pretty false > worker-tsc.log 2>&1
          echo $? > worker-tsc.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: worker-tsc-diagnostics
          path: |
            worker-tsc.log
            worker-tsc.exit
      - name: Enforce Worker TypeScript
        run: test "$(cat worker-tsc.exit)" = "0"
      - name: Identity adapter regression tests
        run: node --test scripts/first-login-boundary.test.mjs scripts/identity-adapter.test.mjs scripts/authority-refresh.test.mjs scripts/feedback-messages.test.mjs scripts/backup-providers.test.mjs scripts/backup-ui.test.mjs scripts/backup-rehearsal-http.test.mjs scripts/backup-schedule.test.mjs scripts/guarded-navigation.test.mjs scripts/program-entry-links.test.mjs scripts/program-catalog-refresh.test.mjs scripts/program-catalog-schedule.test.mjs scripts/erp-history-api.test.mjs scripts/erp-business-query.test.mjs scripts/module-requirements.test.mjs scripts/ordering.test.mjs scripts/ordering-route.test.mjs scripts/form-keyboard.test.mjs

      - name: CYInvoice recovery authority and current UI
        run: |
          node scripts/validate-cyinvoice-recovery.mjs
          node --test scripts/cyinvoice-recovery-ui.test.mjs

      - name: HTTPS entry and deployed transport regressions
        run: node --test scripts/secure-entry.test.mjs scripts/secure-deployment.test.mjs scripts/backup-provider-worker.test.mjs

  # WO-0.9.52 feature-only component visual acceptance. No Cloudflare
  # Vite plugin, no production requests, only deterministic synthetic fixtures.
  stocktake-visual:
    if: github.event_name == 'pull_request' && github.head_ref == 'cyweb/store-stocktake'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Install browser test-only tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Seven real React stocktake screenshots, 1440 and 390
        shell: bash
        run: |
          set -e
          npx vite --config vite.stocktake-visual.config.ts --host 127.0.0.1 --port 4173 > /tmp/stocktake-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/scripts/stocktake-visual/index.html > /dev/null; then break; fi
            sleep 1
          done
          node scripts/stocktake-visual/capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocktake-1440-390-visual-acceptance
          path: artifacts/stocktake-visual/*.png
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Local D1 runtime acceptance
        run: |
          python scripts/test_d1_runner.py
          npm run validate:d1:local
      # Full acceptance requested by WO-0.9.52. All synthetic fixture tests,
      # no production resources, credentials or live ERP connections.
      - name: Full Node test suite
        run: node --test scripts/*.test.mjs
      - name: Vite build
        run: npx vite build
