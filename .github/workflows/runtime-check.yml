name: Runtime Check

on:
  pull_request:
    paths:
      - "src/**"
      - "shared/**"
      - "worker/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/runtime-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Core contracts
        run: |
          python scripts/validate_schema.py
          python scripts/validate_foundation.py
          python scripts/validate_identity_foundation.py
          python scripts/validate_audit_foundation.py
      - name: Business service contracts
        run: |
          python scripts/validate_customer_service_foundation.py
          python scripts/validate_customer_related_mutations.py
          python scripts/validate_item_foundation.py
          python scripts/validate_defect_foundation.py
          python scripts/validate_sales_work_order_foundation.py
          python scripts/validate_contractor_outsourcing_foundation.py
          python scripts/validate_work_log_foundation.py
          python scripts/validate_settings_admin_foundation.py
      - name: Operational runtime contract
        run: python scripts/validate_operational_local_runtime.py

  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
