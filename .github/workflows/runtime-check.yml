name: Runtime Check

on:
  pull_request:
    paths:
      - "src/**"
      - "shared/**"
      - "worker/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/runtime-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Source validators
        run: npm run validate:source
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
