name: WO-0.23.0 Visual Acceptance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'scripts/visual/wo0230*'
      - 'scripts/visual/vite.config.ts'
      - '.github/workflows/wo-0230-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wo-0230-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify actual React screens at 1440 and 390
        run: node scripts/visual/wo0230-capture.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wo0230-desktop-mobile
          path: artifacts/wo-0230
          if-no-files-found: warn
