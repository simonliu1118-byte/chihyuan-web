name: Operational Live

on:
  push:
    branches:
      - cyweb/operational-local-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyweb-operational-live
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build operational runtime
        run: npm run build:operational

      - name: Publish static runtime branch
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -a dist-operational/. "$publish_dir/"
          printf '%s\n' "${GITHUB_SHA}" > "$publish_dir/SOURCE_COMMIT"
          touch "$publish_dir/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan operational-live
          git rm -rf .
          cp -a "$publish_dir/." .
          git add -A
          git commit -m "deploy: operational runtime ${GITHUB_SHA}"
          git push --force origin HEAD:operational-live
