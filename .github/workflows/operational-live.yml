name: Operational Package

on:
  push:
    branches:
      - cyweb/operational-local-runtime
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyweb-operational-package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build operational runtime
        run: npm run build:operational

      - name: Stamp source commit
        run: |
          printf '%s\n' "${GITHUB_SHA}" > dist-operational/SOURCE_COMMIT
          touch dist-operational/.nojekyll

      - name: Upload operational runtime
        uses: actions/upload-artifact@v4
        with:
          name: operational-runtime
          path: dist-operational/
          if-no-files-found: error
          retention-days: 30
