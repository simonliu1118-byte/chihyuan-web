name: Operational Live

on:
  push:
    branches:
      - cyweb/operational-local-runtime
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cyweb-operational-live
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build operational runtime
        run: npm run build:operational

      - name: Stamp source commit
        run: |
          printf '%s\n' "${GITHUB_SHA}" > dist-operational/SOURCE_COMMIT
          touch dist-operational/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-operational/

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
