<script>
(function(){
 const root=document.getElementById('cy-business-colors');
 const palettes=[{id:'indigo-light',name:'霧白靛藍淺色版',scheme:'light'},{id:'indigo-dark',name:'石墨靛藍深色版',scheme:'dark'}];
 const business=[['users','客戶'],['package','商品'],['clipboard-check','瑕疵'],['receipt-text','銷售工單'],['truck','委外'],['notebook-pen','工作日誌'],['search','ERP 查詢']];
 const management=[['shield-check','帳號與權限'],['settings-2','設定'],['history','稽核紀錄'],['database-backup','備份管理']];
 const nav=rows=>rows.map(([icon,label])=>'<div class="cy-nav-entry '+(label==='ERP 查詢'?'current':'')+'"><i data-lucide="'+icon+'" aria-hidden="true"></i><span>'+label+'</span></div>').join('');
 palettes.forEach(p=>{
  const mount=root.querySelector('#cy-color-'+p.id);
  mount.innerHTML=`<div class="cy-product" data-palette="indigo" style="color-scheme:${p.scheme}" aria-label="${p.name}介面">
   <aside class="cy-side"><div class="cy-brand"><span class="cy-monogram">CY</span><div>志遠企業<small>企業管理系統</small></div></div><div><nav class="cy-nav" aria-label="業務模組">${nav(business)}</nav><div class="cy-management"><div class="cy-side-sep"></div><nav class="cy-nav" aria-label="管理功能">${nav(management)}</nav><div class="cy-tools-label">工具</div><div class="cy-nav-entry"><i data-lucide="app-window" aria-hidden="true"></i>CY 程式</div></div></div><div class="cy-side-bottom">志遠企業管理系統</div></aside>
   <div class="cy-work"><header class="cy-header"><div class="cy-heading"><span class="cy-icon-button cy-mobile-menu" aria-hidden="true"><i data-lucide="menu"></i></span><h1>ERP 品號查詢</h1><button type="button" class="cy-icon-button cursor-interaction" aria-label="說明" aria-expanded="false"><i data-lucide="circle-help" aria-hidden="true"></i></button></div><div class="cy-account"><span class="cy-account-name">示範管理員</span><span class="cy-role">超級管理員</span></div></header>
    <main class="cy-main"><div class="cy-overline"><span>商品資料查詢</span><span class="cy-online"><span class="cy-dot"></span>ERP 已連線</span></div>
    <div class="cy-help-text" hidden>僅供查閱 ERP 現有商品，不會新增或修改資料。</div>
    <section class="cy-panel"><form class="cy-form" novalidate><div class="cy-form-top"><select class="cy-category" aria-label="搜尋類別"><option>商品</option></select><div class="cy-modes" aria-label="查詢方式"><button type="button" class="cursor-interaction" aria-pressed="true" data-mode="品號">品號</button><button type="button" class="cursor-interaction" aria-pressed="false" data-mode="品名">品名</button></div></div><div class="cy-search"><div class="cy-search-field"><i data-lucide="search" aria-hidden="true"></i><input type="text" aria-label="品號" placeholder="請輸入品號" value="T0001"></div><button type="submit" class="cy-primary cursor-interaction">查詢</button></div><label class="cy-check"><input type="checkbox">查歷史異動</label><div class="cy-dates" hidden><label>起日<input type="date"></label><label>迄日<input type="date"></label></div><div class="cy-form-hint" hidden>起訖都未填：最近一年；範圍最多三年。</div><div class="cy-alert" role="alert" hidden>請輸入查詢內容。</div></form></section>
    <section class="cy-panel"><div class="cy-result-head"><h2>商品資料</h2><span class="cy-status" role="status">查詢完成</span></div><dl class="cy-fields"><div><dt>品號</dt><dd class="cy-result-code">T0001</dd></div><div><dt>庫存數量</dt><dd>128 件</dd></div><div class="cy-wide"><dt>品名</dt><dd>範例商品</dd></div><div><dt>商品分類</dt><dd>一般商品</dd></div><div><dt>標準售價</dt><dd>NT$ 1,200</dd></div></dl><div class="cy-result-footer"><span>示意資料</span><button type="button" class="cy-link cursor-interaction">查看庫別資料</button></div><dl class="cy-fields cy-stock" hidden><div><dt>庫別</dt><dd>示範倉庫</dd></div><div><dt>可用數量</dt><dd>128 件</dd></div></dl></section>
    <footer class="cy-palette-footer"><span class="cy-chip"><span class="cy-swatch"></span>主色</span><span class="cy-chip"><span class="cy-swatch bg"></span>背景</span><span class="cy-chip"><span class="cy-swatch text"></span>文字</span><span class="cy-chip"><span class="cy-swatch copper"></span>一般管理員銅色</span></footer></main></div></div>`;
  const app=mount.querySelector('.cy-product'),form=app.querySelector('form'),field=app.querySelector('input[type=text]'),help=app.querySelector('.cy-help-text'),helpButton=app.querySelector('button[aria-label="說明"]'),history=app.querySelector('input[type=checkbox]'),state={mobile:false};
  helpButton.addEventListener('click',()=>{help.hidden=!help.hidden;helpButton.setAttribute('aria-expanded',String(!help.hidden));});
  app.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{app.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));field.placeholder='請輸入'+button.dataset.mode;field.setAttribute('aria-label',button.dataset.mode);field.value='';const nameMode=button.dataset.mode==='品名';app.querySelector('.cy-check').hidden=nameMode;app.querySelector('.cy-dates').hidden=nameMode||!history.checked;app.querySelector('.cy-form-hint').hidden=nameMode||!history.checked;}));
  history.addEventListener('change',()=>{app.querySelector('.cy-dates').hidden=!history.checked;app.querySelector('.cy-form-hint').hidden=!history.checked;});
  form.addEventListener('submit',event=>{event.preventDefault();const blank=!field.value.trim();app.querySelector('.cy-alert').hidden=!blank;if(!blank){app.querySelector('.cy-result-code').textContent=field.getAttribute('aria-label')==='品號'?field.value:'T0001';app.querySelector('[role=status]').textContent='示意查詢完成';}});
  app.querySelector('.cy-link').addEventListener('click',event=>{const stock=app.querySelector('.cy-stock');stock.hidden=!stock.hidden;event.currentTarget.textContent=stock.hidden?'查看庫別資料':'收合庫別資料';});
  const render=()=>{app.dataset.mobile=String(state.mobile);};
  if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:render});tweak.addToggle(state,'mobile',{label:'預覽手機排版'});}
 });
 if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
})();
</script>
