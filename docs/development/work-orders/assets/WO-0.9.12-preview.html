<div class="shell"><aside class="side">

<script>
const params = new URLSearchParams(location.search),screen=params.get("screen")||"desktop-light";
if(screen==="desktop-dark") document.body.classList.add("dark");
if(screen==="mobile") document.body.classList.add("mobile");
const visits=[
["2026/10/17","王先生","進行年度採購需求討論"],
["2026/10/12","李小姐","確認新產品規格與交期"],
["2026/10/05","王先生","追蹤報價進度"],
["2026/09/27","陳先生","確認樣品測試結果"],
["2026/09/20","王先生","初次拜訪"]], quotes=[

["2026/09/23","P-1400","固定座"]], frequent=[

document.getElementById("cards").innerHTML=card("拜訪紀錄",visits,r=>'<div class="row">'+r.join(' · ')+'</div>')+card("報價紀錄",quotes,r=>'<div class="row">'+r.join(' · ')+'</div>')+card("常用商品",frequent,r=>'<div class="row">'+r.join(' · ')+'</div>');

let content="";
if(screen==="visits-all")content=visits.map(r=>'<div class="line"><div>'+r.join(' · ')+'</div><span class="small">修改　刪除</span></div>').join('');
if(screen==="visits-new")content='<div class="form"><label>日期<span class="input">2026-10-18</span></label><label>聯絡人<span class="input">王先生 ▾</span></label><label style="grid-column:1/-1">內容<span class="input" style="height:100px">本次拜訪內容...</span></label></div><div style="text-align:right;margin-top:18px"><button class="btn">取消</button>　<button class="btn primary">儲存</button></div>';

}
if(screen==="account-menu")document.getElementById("layer").innerHTML='<div class="menu"><div class="line">我的帳號（密碼、Email）</div><div class="line">登出</div></div>';

}
</script></html>
