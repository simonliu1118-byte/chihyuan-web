<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CY Web - 設定管理完整功能預覽</title>
<style>
:root{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#17232d;background:#f3f6f8;font-size:15px;--red:#8d2132;--line:#d8e0e6;--muted:#667987;--card:#fff;--green:#e7f5ec;--blue:#eaf3fb;--amber:#fff3d4;--gray:#edf1f3}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:9px;align-items:center;margin-bottom:25px}.logo{width:35px;height:42px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.5}.nav h4{font-size:12px;color:#748391;margin:18px 8px 7px}.nav div{padding:10px;border-radius:9px;color:#53626f}.nav .active{background:#f5e8eb;color:var(--red);font-weight:800}.main{min-width:0}.top{height:50px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.badge{background:#e9f2f8;color:#36617a;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.content{padding:18px 24px 40px;max-width:1600px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.pagehead h1{font-size:27px;margin:0 0 4px}.pagehead p{margin:0;color:var(--muted);font-size:14px}.notice{margin:14px 0;background:#eaf3fb;border:1px solid #cadfeb;border-radius:10px;padding:10px 13px;color:#36596f}.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font:inherit;font-weight:750;cursor:pointer}.tab.active{background:var(--red);color:#fff;border-color:var(--red)}.btn{border:1px solid #cbd5dd;background:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-weight:750;cursor:pointer}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.success{background:#e7f5ec;border-color:#bcdcc8;color:#1f6439}.btn.warn{background:#fff4db;border-color:#e5c76e}.btn.danger{color:#a11f32;border-color:#e2b5bd}.btn:disabled{opacity:.4;cursor:not-allowed}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 15px rgba(25,38,48,.045);overflow:hidden}.body{padding:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.section h3{font-size:16px;margin:0 0 12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #e4e9ed;padding:9px 8px}.table th{font-size:13px;color:#687986;background:#fafbfc}.table td{font-size:14px}.status{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;white-space:nowrap}.ok{background:#e7f5ec;color:#22663b}.off{background:#f3e7e9;color:#842638}.info{background:#eaf3fb;color:#245d7b}.rolebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rolebar select,.field input,.field select{border:1px solid #cbd5dd;border-radius:7px;padding:9px 10px;font:inherit;font-size:15px;background:#fff}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.toolbar h2{margin:0;font-size:18px}.sub{font-size:13px;color:#6b7d89}.tagmods{display:flex;gap:5px;flex-wrap:wrap}.chip{padding:3px 7px;background:#f0f3f5;border-radius:999px;font-size:12px}.audit{display:grid;gap:8px}.event{border-left:3px solid #cbd7df;padding:6px 10px}.event b{font-size:14px}.event small{display:block;color:#71808d;margin-top:3px}.metricgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{border:1px solid var(--line);border-radius:12px;padding:14px}.metric strong{display:block;font-size:21px}.metric span{font-size:13px;color:var(--muted)}.modalback{position:fixed;inset:0;background:rgba(20,31,39,.36);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal{background:#fff;border-radius:14px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal h3{font-size:20px;margin:0 0 8px}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:750;color:#526472;margin-bottom:5px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:22px;bottom:22px;background:#21323e;color:#fff;border-radius:9px;padding:11px 14px;opacity:0;transform:translateY(8px);transition:.2s;z-index:200}.toast.show{opacity:1;transform:none}.warnbox{background:#fff4db;border:1px solid #e5c76e;border-radius:10px;padding:11px 13px;margin:10px 0}.dangerbox{background:#fbecee;border:1px solid #e4b9c0;border-radius:10px;padding:11px 13px;margin:10px 0;color:#7e2634}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{display:none}.grid2,.metricgrid{grid-template-columns:1fr}}
@media(max-width:640px){.content{padding:12px}.top{padding:0 12px}.pagehead h1{font-size:23px}.toolbar{align-items:flex-start;flex-direction:column}.table{min-width:700px}.section{overflow:auto}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">CY</div><div><b>CY Web</b><small>Chihyuan Enterprise<br>Management System</small></div></div><div class="nav"><h4>業務</h4><div>客戶</div><div>商品</div><div>銷售工單</div><div>委外</div><div>工作日誌</div><h4>管理</h4><div class="active">設定</div><div>稽核紀錄</div></div></aside><main class="main"><div class="top"><b>設定／管理</b><span class="badge">Full Preview 0.1.36</span></div><div class="content"><div class="pagehead"><div><h1>設定／管理</h1><p>功能整合預覽：權限分層、結構設定、App Tag、WorkLog 設定、Audit 與備份／還原操作。</p></div><div class="rolebar"><label>示範身分</label><select id="role" onchange="roleChanged()"><option>EMPLOYEE</option><option>ADMIN</option><option selected>SUPER_ADMIN</option></select></div></div><div class="notice"><b>預覽環境：</b>所有資料都是瀏覽器假資料。角色切換只為測試顯示／操作權限；正式版仍由 Shared Identity 與伺服器權限判斷。不連 D1/R2/GCS。</div><div class="tabs"><button class="tab active" data-tab="struct" onclick="switchTab('struct')">結構設定</button><button class="tab" data-tab="tags" onclick="switchTab('tags')">App Tag／模組</button><button class="tab" data-tab="worklog" onclick="switchTab('worklog')">WorkLog 設定</button><button class="tab" data-tab="audit" onclick="switchTab('audit')">Audit Log</button><button class="tab" data-tab="backup" onclick="switchTab('backup')">備份／還原</button></div><div id="view"></div></div></main></div>
<div class="modalback" id="modal"><div class="modal" id="modalBody"></div></div><div class="toast" id="toast"></div>
<script>
let currentTab='struct';let departments=[{id:1,code:'south',name:'南區業務',active:true,sort:0},{id:2,code:'office',name:'內勤',active:true,sort:1}],customerCategories=[{id:1,code:'clinic',name:'中醫診所',active:true,sort:0},{id:2,code:'prospect',name:'潛在客戶',active:true,sort:1}],tags=[{id:1,code:'sales',name:'業務',active:true,mods:['customer','sales_order']},{id:2,code:'warehouse',name:'倉庫',active:true,mods:['sales_order','outsourcing']}],members=[{id:1,name:'示範員工 A',tags:[1]},{id:2,name:'示範員工 B',tags:[2]}],workCats=[{id:1,code:'demo_bool',name:'示範勾選項目',mode:'boolean',unit:null,active:true},{id:2,code:'demo_qty',name:'示範數量項目',mode:'quantity',unit:'件',active:true}],platforms=[{id:1,code:'demo_a',name:'示範平台 A',active:true}],scores=[{id:1,category:1,name:null,score:2,active:true},{id:2,category:2,name:null,score:1.5,active:true}],scoreCfg={target:10,min:5,revision:1},audit=[],backups=[{id:'BKP-20260927-0330',created:'2026-09-27 03:30',schema:'v2',integrity:'verified',providers:['R2','GCS']},{id:'BKP-20260926-0330',created:'2026-09-26 03:30',schema:'v2',integrity:'verified',providers:['R2']}];
function role(){return document.getElementById('role').value}function canSA(){return role()==='SUPER_ADMIN'}function canAdmin(){return role()==='ADMIN'||canSA()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function now(){return new Date().toLocaleString('zh-TW',{hour12:false}).replaceAll('/','-')}function addAudit(action,detail){audit.unshift({at:now(),role:role(),action,detail})}function roleChanged(){render()}function switchTab(t){currentTab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}
function render(){if(currentTab==='struct')renderStruct();else if(currentTab==='tags')renderTags();else if(currentTab==='worklog')renderWorklog();else if(currentTab==='audit')renderAudit();else renderBackup()}
function table(title,rows,kind){return`<div class="section"><div class="toolbar"><div><h2>${title}</h2><div class="sub">${canSA()?'SUPER_ADMIN 可修改':'目前身分唯讀'}</div></div><button class="btn primary" ${canSA()?'':'disabled'} onclick="addLookup('${kind}')">新增</button></div><table class="table"><thead><tr><th>代碼</th><th>名稱</th><th>狀態</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${r.active?'<span class="status ok">啟用</span>':'<span class="status off">停用</span>'}</td><td><button class="btn" ${canSA()?'':'disabled'} onclick="editLookup('${kind}',${r.id})">修改</button></td></tr>`).join('')}</tbody></table></div>`}
function renderStruct(){document.getElementById('view').innerHTML=`<div class="notice"><b>權限規則：</b>部門、客戶分類／狀態、商品分類等結構性設定，只允許 SUPER_ADMIN 修改；ADMIN 與 EMPLOYEE 為唯讀。</div>${table('部門',departments,'dept')}${table('客戶分類',customerCategories,'custcat')}`}
function listFor(k){return k==='dept'?departments:customerCategories}function addLookup(k){if(!canSA())return toast('需要 SUPER_ADMIN');const code=prompt('穩定代碼');const name=prompt('顯示名稱');if(!code||!name)return;const rows=listFor(k);rows.push({id:Math.max(0,...rows.map(x=>x.id))+1,code,name,active:true,sort:rows.length});addAudit('setting.created',`${k}:${code}`);renderStruct()}function editLookup(k,id){if(!canSA())return;const row=listFor(k).find(x=>x.id===id);const name=prompt('顯示名稱',row.name);if(!name)return;const active=confirm('按「確定」保持啟用；按「取消」改為停用');addAudit('setting.changed',`${row.code}: ${row.name}/${row.active} -> ${name}/${active}`);row.name=name;row.active=active;renderStruct()}
function renderTags(){document.getElementById('view').innerHTML=`<div class="notice"><b>App Tag 不是角色：</b>Shared Identity 的 EMPLOYEE / ADMIN / SUPER_ADMIN 不在這裡重建。App Tag 只控制 CY Web 模組進入。</div><div class="grid2"><div class="section"><div class="toolbar"><h2>App Tag</h2><button class="btn primary" ${canSA()?'':'disabled'} onclick="addTag()">新增 Tag</button></div><table class="table"><thead><tr><th>Tag</th><th>模組</th><th></th></tr></thead><tbody>${tags.map(t=>`<tr><td><b>${esc(t.name)}</b><div class="sub">${esc(t.code)}</div></td><td><div class="tagmods">${t.mods.map(m=>`<span class="chip">${m}</span>`).join('')}</div></td><td><button class="btn" ${canSA()?'':'disabled'} onclick="editTag(${t.id})">修改</button></td></tr>`).join('')}</tbody></table></div><div class="section"><h2 style="font-size:18px">成員 Tag 指派</h2><div class="sub" style="margin-bottom:10px">只有 SUPER_ADMIN 可修改</div><table class="table"><thead><tr><th>成員</th><th>目前 Tag</th><th></th></tr></thead><tbody>${members.map(m=>`<tr><td>${m.name}</td><td>${m.tags.map(id=>tags.find(t=>t.id===id)?.name).join('、')||'—'}</td><td><button class="btn" ${canSA()?'':'disabled'} onclick="assignTags(${m.id})">設定</button></td></tr>`).join('')}</tbody></table></div></div>`}
function addTag(){if(!canSA())return;const code=prompt('Tag code');const name=prompt('Tag 名稱');if(!code||!name)return;tags.push({id:Math.max(0,...tags.map(x=>x.id))+1,code,name,active:true,mods:[]});addAudit('app_tag.created',code);renderTags()}function editTag(id){const t=tags.find(x=>x.id===id),mods=prompt('模組代碼，以逗號分隔',t.mods.join(','));if(mods==null)return;const before=t.mods.join(',');t.mods=mods.split(',').map(x=>x.trim()).filter(Boolean);addAudit('app_tag.changed',`${t.code}: ${before} -> ${t.mods.join(',')}`);renderTags()}function assignTags(id){const m=members.find(x=>x.id===id),raw=prompt(`可用 Tag：${tags.map(t=>`${t.id}=${t.name}`).join('、')}，輸入 ID 逗號分隔`,m.tags.join(','));if(raw==null)return;const next=[...new Set(raw.split(',').map(Number).filter(x=>tags.some(t=>t.id===x)))];addAudit('app_member_tags.changed',`${m.name}: ${m.tags.join(',')} -> ${next.join(',')}`);m.tags=next;renderTags()}
function renderWorklog(){document.getElementById('view').innerHTML=`<div class="notice"><b>權限規則：</b>WorkLog 操作型設定允許 ADMIN 與 SUPER_ADMIN 修改；EMPLOYEE 唯讀。示範值不是志遠正式設定。</div><div class="grid2"><div class="section"><div class="toolbar"><h2>分類</h2><button class="btn primary" ${canAdmin()?'':'disabled'} onclick="addWorkCat()">新增</button></div><table class="table"><thead><tr><th>名稱</th><th>模式</th><th>單位</th><th></th></tr></thead><tbody>${workCats.map(c=>`<tr><td>${c.name}<div class="sub">${c.code}</div></td><td>${c.mode}</td><td>${c.unit||'—'}</td><td><button class="btn" ${canAdmin()?'':'disabled'} onclick="toggleWorkCat(${c.id})">${c.active?'停用':'啟用'}</button></td></tr>`).join('')}</tbody></table></div><div class="section"><div class="toolbar"><h2>平台</h2><button class="btn primary" ${canAdmin()?'':'disabled'} onclick="addPlatform()">新增</button></div><table class="table"><tbody>${platforms.map(p=>`<tr><td>${p.name}<div class="sub">${p.code}</div></td><td>${p.active?'<span class="status ok">啟用</span>':'<span class="status off">停用</span>'}</td></tr>`).join('')}</tbody></table></div></div><div class="section"><div class="toolbar"><h2>計分參考</h2><button class="btn" ${canAdmin()?'':'disabled'} onclick="editScoreCfg()">調整目標／最低</button></div><div class="metricgrid"><div class="metric"><strong>${scoreCfg.target}</strong><span>示範目標平均日分</span></div><div class="metric"><strong>${scoreCfg.min}</strong><span>示範最低平均日分</span></div><div class="metric"><strong>rev.${scoreCfg.revision}</strong><span>設定版本</span></div></div><table class="table" style="margin-top:12px"><thead><tr><th>分類</th><th>參考分</th><th>狀態</th><th></th></tr></thead><tbody>${scores.map(s=>`<tr><td>${workCats.find(c=>c.id===s.category)?.name||s.name}</td><td>${s.score}</td><td>${s.active?'啟用':'停用'}</td><td><button class="btn" ${canAdmin()?'':'disabled'} onclick="editScore(${s.id})">修改</button></td></tr>`).join('')}</tbody></table></div>`}
function addWorkCat(){const name=prompt('分類名稱');if(!name)return;const code='demo_'+Date.now().toString().slice(-4);workCats.push({id:Math.max(0,...workCats.map(x=>x.id))+1,code,name,mode:'boolean',unit:null,active:true});addAudit('work_log_category.created',code);renderWorklog()}function toggleWorkCat(id){const c=workCats.find(x=>x.id===id);c.active=!c.active;addAudit('work_log_category.changed',`${c.code} active=${c.active}`);renderWorklog()}function addPlatform(){const name=prompt('平台名稱');if(!name)return;platforms.push({id:Math.max(0,...platforms.map(x=>x.id))+1,code:'demo_'+Date.now().toString().slice(-4),name,active:true});addAudit('work_log_platform.created',name);renderWorklog()}function editScore(id){const s=scores.find(x=>x.id===id),v=Number(prompt('參考分數',s.score));if(!Number.isFinite(v))return;s.score=v;addAudit('work_log_scoring.changed',`#${id} -> ${v}`);renderWorklog()}function editScoreCfg(){const t=Number(prompt('目標平均日分',scoreCfg.target)),m=Number(prompt('最低平均日分',scoreCfg.min));if(!Number.isFinite(t)||!Number.isFinite(m))return;scoreCfg={target:t,min:m,revision:scoreCfg.revision+1};addAudit('work_log_scoring_config.changed',`target=${t}, min=${m}`);renderWorklog()}
function renderAudit(){document.getElementById('view').innerHTML=`<div class="section"><div class="toolbar"><div><h2>預覽 Audit Log</h2><div class="sub">正式版由 Shared Audit Core + Admin/SA 詳細檢視權限提供。</div></div></div><div class="audit">${audit.length?audit.map(a=>`<div class="event"><b>${esc(a.action)}</b><div>${esc(a.detail)}</div><small>${esc(a.at)} · ${a.role}</small></div>`).join(''):'<div class="sub">目前尚無預覽操作紀錄。先到其他分頁修改設定即可看到。</div>'}</div></div>`}
function renderBackup(){document.getElementById('view').innerHTML=`<div class="notice"><b>SUPER_ADMIN 專屬：</b>這裡只模擬產品流程，不會真的建立或還原 D1/R2/GCS。正式還原還必須驗證 manifest、schema compatibility 與完整性。</div><div class="grid2"><div class="section"><div class="toolbar"><h2>備份</h2><button class="btn primary" ${canSA()?'':'disabled'} onclick="createBackup()">建立備份（模擬）</button></div><table class="table"><thead><tr><th>Backup ID</th><th>建立時間</th><th>完整性</th><th>副本</th><th></th></tr></thead><tbody>${backups.map(b=>`<tr><td>${b.id}</td><td>${b.created}</td><td><span class="status ok">${b.integrity}</span></td><td>${b.providers.join(' + ')}</td><td><button class="btn danger" ${canSA()?'':'disabled'} onclick="startRestore('${b.id}')">還原</button></td></tr>`).join('')}</tbody></table></div><div class="section"><h2 style="font-size:18px">還原安全規則</h2><div class="warnbox">第一步：確認要還原的唯一備份。</div><div class="dangerbox">第二步：顯示破壞性警告，必須輸入指定文字後才能繼續。</div><div class="sub">正式版為 all-or-nothing 邏輯還原；失敗時資料庫維持原狀，不自動猜測或回滾到其他備份。</div></div></div>`}
function createBackup(){if(!canSA())return toast('需要 SUPER_ADMIN');const id='BKP-PREVIEW-'+Date.now();backups.unshift({id,created:now(),schema:'v2',integrity:'verified',providers:['R2']});addAudit('backup.created',id);toast('已建立模擬備份');renderBackup()}
function startRestore(id){if(!canSA())return;const b=backups.find(x=>x.id===id);document.getElementById('modalBody').innerHTML=`<h3>第一步：確認還原備份</h3><p>你選擇的是 <b>${esc(b.id)}</b><br>${esc(b.created)} · ${b.providers.join(' + ')}</p><div class="warnbox">正式版會先驗證 manifest、schema compatibility 與 hash/integrity。</div><div class="modalactions"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="restoreStep2('${b.id}')">我確認選擇此備份</button></div>`;openModal()}
function restoreStep2(id){document.getElementById('modalBody').innerHTML=`<h3>第二步：破壞性確認</h3><div class="dangerbox"><b>警告：</b>還原會以所選邏輯備份取代目前資料。此預覽不會真的寫入資料庫。</div><div class="field"><label>請輸入 RESTORE</label><input id="restoreToken" autocomplete="off"></div><div class="modalactions"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="finishRestore('${id}')">執行模擬還原</button></div>`}
function finishRestore(id){if(document.getElementById('restoreToken').value!=='RESTORE')return toast('確認文字不正確');addAudit('backup.restore.preview',id);closeModal();toast('模擬還原完成；未觸碰任何真實資料')}
function openModal(){document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}render();
</script></body></html>
