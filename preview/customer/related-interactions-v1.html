<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>CY Web Customer Related Interaction Preview</title>
<style>
:root{--bg:#f5f7f8;--surface:#fff;--muted:#66727d;--text:#202a33;--border:#dde3e7;--border2:#cbd3d9;--accent:#9e2830;--accentSoft:#f8edef;--ok:#28734a;--warn:#a06b13;--danger:#a83131;--shadow:0 8px 28px rgba(29,40,51,.08);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-size:14px}.app{min-height:100vh;display:grid;grid-template-columns:210px 1fr}.side{padding:22px 14px;background:#202a33;color:#fff}.brand{font-weight:800;font-size:20px}.sub{margin-top:4px;color:#aeb8c0;font-size:11px}.nav{margin-top:28px;display:grid;gap:6px}.nav b{padding:9px 10px;border-radius:8px;background:rgba(255,255,255,.1)}.nav span{padding:8px 10px;color:#abb5bd}.main{padding:24px;min-width:0}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:11px;color:var(--muted);font-weight:700}.top h1{margin:3px 0 5px;font-size:27px}.desc{max-width:760px;color:var(--muted);line-height:1.55}.chip{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;background:#eef1f3;color:#52606b}.chip.ok{background:#e9f5ed;color:var(--ok)}.chip.warn{background:#fff5df;color:var(--warn)}.chip.info{background:#edf3fa;color:#39658a}.notice,.customer,.panel{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}.notice{padding:13px 15px;background:#fbfdff}.notice b{display:block;font-size:12px}.notice span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.customer{padding:13px 15px;display:flex;justify-content:space-between;align-items:center}.customer small{display:block;color:var(--muted);margin-bottom:3px}.customer strong{font-size:16px}.customer select{min-width:210px;padding:9px 10px;border:1px solid var(--border2);border-radius:9px;background:#fff}.tabs{display:flex;gap:3px;padding:10px 12px 0;border-bottom:1px solid var(--border);overflow:auto}.tab{border:0;background:transparent;padding:10px 11px 11px;color:var(--muted);font-weight:700;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.content{padding:17px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}.heading div{display:grid;gap:4px}.heading strong{font-size:14px}.heading span,.foot{color:var(--muted);font-size:11px;line-height:1.5}.btn{border:1px solid var(--border2);border-radius:8px;padding:7px 10px;background:#fff;color:var(--text);font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.quiet{border-color:transparent;background:transparent;color:#5c6872}.btn.danger{color:var(--danger)}.visit{display:grid;grid-template-columns:86px 14px 1fr;gap:9px}.visit time{font-size:11px;color:var(--muted);padding-top:2px}.dot{position:relative}.dot:before{content:"";position:absolute;top:6px;left:4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}.dot:after{content:"";position:absolute;top:17px;left:7px;bottom:-1px;width:1px;background:var(--border)}.visit:last-child .dot:after{display:none}.visitBody{padding-bottom:15px}.visitMeta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.visitMeta b{color:var(--text)}.visit p{margin:5px 0;font-size:12px;line-height:1.6}.actions{text-align:right}.quote{border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:10px}.quoteHead{padding:11px 13px;background:#f7f9fa;display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--border)}.quoteHead small{display:block;color:var(--muted);margin-top:3px}.breakHead,.breakRow{display:grid;grid-template-columns:1fr .7fr 1fr;gap:10px;padding:7px 13px;font-size:11px}.breakHead{color:var(--muted);font-weight:700}.breakRow{border-top:1px solid var(--border)}.breakHead span:last-child,.breakRow span:last-child{text-align:right;font-weight:700}.quoteAction{padding:5px 10px 9px;text-align:right}.frequent{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.freq{border:1px solid var(--border);border-radius:11px;padding:12px;display:grid;gap:5px}.freq small{color:var(--muted)}.empty{padding:28px;border:1px dashed var(--border2);border-radius:11px;text-align:center;color:var(--muted)}.foot{margin-top:12px}.backdrop{position:fixed;inset:0;background:rgba(20,28,36,.42);display:none;z-index:50}.backdrop.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(560px,92vw);background:#fff;display:flex;flex-direction:column;box-shadow:-18px 0 50px rgba(20,28,36,.16)}.drawer.large{width:min(760px,96vw)}.drawerHead,.drawerFoot{padding:17px 19px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px}.drawerFoot{border-top:1px solid var(--border);border-bottom:0;justify-content:flex-end}.drawerHead h2{margin:0;font-size:18px}.drawerHead p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.45}.drawerBody{padding:18px;overflow:auto;flex:1}.form{display:grid;gap:14px}.grid2,.grid3{display:grid;gap:10px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}label{display:grid;gap:5px;font-size:11px;font-weight:700;color:#4f5b65}input,textarea,select{width:100%;border:1px solid var(--border2);border-radius:8px;padding:9px 10px;font:inherit;color:var(--text);background:#fff}textarea{resize:vertical}.hint{font-size:11px;color:var(--muted);font-weight:400}.rowCard{padding:12px;border:1px solid var(--border);border-radius:10px;background:#f9fafb;display:grid;gap:9px}.rowHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-end}.lookup{position:relative}.lookupResults{display:none;position:absolute;left:0;right:0;top:100%;z-index:3;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:8px;overflow:hidden}.lookupResults.open{display:block}.lookupResults button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:9px;cursor:pointer}.lookupResults button:hover{background:#f5f7f8}.warnbox{padding:11px;border:1px solid #ead4a7;background:#fffaf0;border-radius:9px;color:#6e5527;font-size:12px;line-height:1.5}.modalBackdrop{position:fixed;inset:0;background:rgba(20,28,36,.48);display:none;place-items:center;z-index:90}.modalBackdrop.open{display:grid}.modal{width:min(430px,calc(100vw - 30px));background:#fff;border-radius:13px;padding:18px;box-shadow:0 22px 60px rgba(0,0,0,.22)}.modal h3{margin:0 0 6px}.modal p{color:var(--muted);line-height:1.5}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{position:fixed;right:18px;bottom:18px;z-index:120;background:#202a33;color:#fff;border-radius:10px;padding:11px 14px;box-shadow:var(--shadow);display:none}.toast.show{display:block}.toast b{display:block}.toast span{font-size:11px;color:#d4dbe0}@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.frequent{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.top,.customer,.heading,.quoteHead{flex-direction:column}.customer select,.heading .btn{width:100%}.frequent,.grid2,.grid3{grid-template-columns:1fr}.drawer,.drawer.large{width:100vw}.drawerFoot{flex-direction:column-reverse}.drawerFoot .btn{width:100%}.visit{grid-template-columns:72px 12px 1fr}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand">CY Web</div><div class="sub">Chihyuan Enterprise Management System</div><div class="nav"><b>客戶</b><span>商品</span><span>銷售工單</span><span>委外</span><span>工作日誌</span></div></aside><main class="main"><header class="top"><div><div class="eyebrow">Customer · Related Records Interaction Review</div><h1>客戶相關資料區</h1><div class="desc">實際測試拜訪、報價與常用商品的操作方式。全部為瀏覽器內示範資料，不連 D1。</div></div><span class="chip info">0.1.23 Preview</span></header><div class="notice"><b>這一版先驗證操作感覺</b><span>主檔仍採已確認的左 Search Pane／右 Detail Pane；這裡只把相關資料區獨立放大。</span></div><section class="customer"><div><small>目前示範客戶</small><strong id="customerName">示範中醫診所</strong><small id="customerNo">C-00128</small></div><select id="customerSelect"><option value="1">示範中醫診所</option><option value="2">測試養生館</option><option value="3">範例診所</option></select></section><section class="panel"><div class="tabs"><button class="tab active" data-tab="visits">拜訪紀錄</button><button class="tab" data-tab="quotes">報價紀錄</button><button class="tab" data-tab="frequent">常用商品</button><button class="tab" data-tab="history">動態 / 歷史</button></div><div class="content" id="content"></div></section></main></div>
<div class="backdrop" id="drawerBackdrop"><div class="drawer" id="drawer"><div class="drawerHead"><div><h2 id="drawerTitle"></h2><p id="drawerDesc"></p></div><button class="btn quiet" id="drawerX">×</button></div><div class="drawerBody" id="drawerBody"></div><div class="drawerFoot"><button class="btn" id="drawerCancel">取消</button><button class="btn primary" id="drawerSave">儲存</button></div></div></div>
<div class="modalBackdrop" id="modalBackdrop"><div class="modal"><h3 id="modalTitle"></h3><p id="modalText"></p><div class="modalActions"><button class="btn" id="modalCancel">取消</button><button class="btn primary" id="modalConfirm">確認</button></div></div></div>
<div class="toast" id="toast"><b id="toastTitle"></b><span id="toastText"></span></div>
<script>
const customers={1:{name:'示範中醫診所',no:'C-00128',contacts:['林小姐','陳先生']},2:{name:'測試養生館',no:'尚無 ERP 編號',contacts:['黃小姐']},3:{name:'範例診所',no:'C-00041',contacts:[]}};
const items=[['A-01021','示範針灸針','0.25 × 25 mm'],['A-00405','示範棉球','中包裝'],['A-00818','示範彈性繃帶','7.5 cm'],['A-01103','示範網套','中型']];
let visits={1:[{id:1,date:'2026-09-24',person:'林小姐',emp:'王○○',content:'確認下月耗材需求，針灸針與棉球用量預計增加。',rev:1},{id:2,date:'2026-08-28',person:'陳先生',emp:'王○○',content:'例行拜訪；提醒月底前會先寄對帳資料。',rev:1}],2:[{id:4,date:'2026-09-18',person:'黃小姐',emp:'李○○',content:'初次接觸，先記錄常用品項。',rev:1}],3:[]};
let quotes={1:[{id:101,date:'2026-09-20',item:items[0],emp:'王○○',rev:1,breaks:[['10','盒','95'],['50','盒','90'],['100','盒','86']]},{id:102,date:'2026-06-11',item:items[0],emp:'李○○',rev:1,breaks:[['10','盒','98'],['50','盒','92']]}],2:[],3:[]};
let frequent={1:[{id:201,type:'formal',item:items[0]},{id:202,type:'formal',item:items[1]},{id:203,type:'free',name:'院內自用特殊網套',cat:'未建檔／客戶情報'}],2:[{id:204,type:'free',name:'特殊尺寸洞巾',cat:'未建檔／需求追蹤'}],3:[]};
let customerId=1,tab='visits',editor=null,dirty=false,modalAction=null;
const $=id=>document.getElementById(id), content=$('content');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(title,text){$('toastTitle').textContent=title;$('toastText').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3000)}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='visits')renderVisits();if(tab==='quotes')renderQuotes();if(tab==='frequent')renderFrequent();if(tab==='history')content.innerHTML='<div class="heading"><div><strong>動態 / 歷史</strong><span>一般主檔修改只保留最後更新資訊；重要動作才進 Audit。</span></div><span class="chip">等待受保護 Audit API</span></div>'}
function renderVisits(){const arr=visits[customerId]||[];content.innerHTML=`<div class="heading"><div><strong>最近拜訪</strong><span>人物名稱保留拜訪當時快照。</span></div><button class="btn" onclick="openVisit()">新增拜訪</button></div>${arr.length?arr.map(v=>`<article class="visit"><time>${v.date}</time><div class="dot"></div><div class="visitBody"><div class="visitMeta"><b>${esc(v.person)}</b><span>記錄：${esc(v.emp)}</span><span>rev. ${v.rev}</span></div><p>${esc(v.content)}</p><div class="actions"><button class="btn quiet" onclick="openVisit(${v.id})">修改</button><button class="btn quiet danger" onclick="askDeleteVisit(${v.id})">刪除</button></div></div></article>`).join(''):'<div class="empty">尚無拜訪紀錄</div>'}<div class="foot">正式版刪除會與 Audit 在同一個 D1 交易完成。</div>`}
function renderQuotes(){const arr=quotes[customerId]||[];content.innerHTML=`<div class="heading"><div><strong>報價歷史</strong><span>新的價格新增歷史；輸入錯誤才使用「修正紀錄」。</span></div><button class="btn" onclick="openQuote()">新增報價紀錄</button></div>${arr.length?arr.map((q,i)=>`<article class="quote"><div class="quoteHead"><div><b>${esc(q.item[1])}</b> ${i===0?'<span class="chip ok">較新</span>':''} ${q.corrected?'<span class="chip warn">曾修正</span>':''}<small>${q.item[0]} · ${q.item[2]}</small></div><div><b>${q.date}</b><small>${q.emp} · rev. ${q.rev}</small></div></div><div class="breakHead"><span>數量</span><span>單位</span><span>單價</span></div>${q.breaks.map(r=>`<div class="breakRow"><span>${esc(r[0])}</span><span>${esc(r[1])}</span><span>${esc(r[2])}</span></div>`).join('')}<div class="quoteAction"><button class="btn quiet" onclick="openQuote(${q.id})">修正紀錄</button></div></article>`).join(''):'<div class="empty">尚無報價紀錄</div>'}<div class="foot">這裡故意沒有「刪除報價」；先以保留歷史＋受稽核修正為準。</div>`}
function renderFrequent(){const arr=frequent[customerId]||[];content.innerHTML=`<div class="heading"><div><strong>常用商品</strong><span>正式商品與未建檔需求保留不同身份。</span></div><button class="btn" onclick="openFrequent()">編輯常用商品</button></div>${arr.length?`<div class="frequent">${arr.map(r=>r.type==='formal'?`<article class="freq"><span class="chip ok">正式商品</span><b>${esc(r.item[1])}</b><small>${r.item[0]}</small><small>${r.item[2]}</small></article>`:`<article class="freq"><span class="chip warn">未建檔</span><b>${esc(r.name)}</b><small>${esc(r.cat||'')}</small></article>`).join('')}</div>`:'<div class="empty">尚無常用商品</div>'}<div class="foot">未建檔項目要變成正式商品，必須明確搜尋並選到正式 Item。</div>`}
function openDrawer(title,desc,html,saveLabel='儲存',large=false){$('drawerTitle').textContent=title;$('drawerDesc').textContent=desc;$('drawerBody').innerHTML=html;$('drawerSave').textContent=saveLabel;$('drawer').classList.toggle('large',large);$('drawerBackdrop').classList.add('open');dirty=false;document.querySelectorAll('#drawerBody input,#drawerBody textarea,#drawerBody select').forEach(el=>el.addEventListener('input',()=>dirty=true))}
function closeDrawer(force=false){if(dirty&&!force){ask('捨棄未儲存變更？','目前編輯器有尚未儲存的內容。',()=>closeDrawer(true));return}$('drawerBackdrop').classList.remove('open');editor=null;dirty=false}
function openVisit(id){const v=id?(visits[customerId]||[]).find(x=>x.id===id):null;editor={type:'visit',id:id||null};const contacts=customers[customerId].contacts;openDrawer(id?'修改拜訪紀錄':'新增拜訪紀錄','聯絡人可以選，也可以保留自由文字的拜訪對象。',`<div class="form"><label>拜訪日期<input id="vDate" type="date" value="${v?.date||'2026-09-27'}"></label><label>聯絡人（可選）<select id="vContact"><option value="">不連結聯絡人</option>${contacts.map(n=>`<option ${v?.person===n?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label>當時拜訪對象<input id="vPerson" value="${esc(v?.person||'')}"><span class="hint">這是歷史快照，之後聯絡人改名也不回頭改寫。</span></label><label>記錄／負責人<select id="vEmp"><option ${v?.emp==='王○○'?'selected':''}>王○○</option><option ${v?.emp==='李○○'?'selected':''}>李○○</option></select></label><label>拜訪內容<textarea id="vContent" rows="7">${esc(v?.content||'')}</textarea></label></div>`);$('vContact').addEventListener('change',e=>{dirty=true;if(e.target.value&&!$('vPerson').value)$('vPerson').value=e.target.value})}
function saveVisit(){const date=$('vDate').value,person=$('vPerson').value.trim()||$('vContact').value,emp=$('vEmp').value,text=$('vContent').value.trim();if(!date||!person||!text){alert('請填寫拜訪日期、拜訪對象與內容');return}const arr=[...(visits[customerId]||[])];if(editor.id){const i=arr.findIndex(v=>v.id===editor.id);arr[i]={...arr[i],date,person,emp,content:text,rev:arr[i].rev+1};showToast('已更新拜訪（預覽）','正式版會用 revision 防止覆蓋新修改。')}else{arr.unshift({id:Date.now(),date,person,emp,content:text,rev:1});showToast('已新增拜訪（預覽）','只更新目前瀏覽器的示範資料。')}visits[customerId]=arr;closeDrawer(true);render()}
function askDeleteVisit(id){ask('刪除這筆拜訪紀錄？','正式版會保留刪除 Audit；這個預覽只移除示範資料。',()=>{visits[customerId]=(visits[customerId]||[]).filter(v=>v.id!==id);showToast('已刪除拜訪（預覽）','正式版會在同一交易寫入 Audit。');render()})}
function itemLookupHtml(selected){return `<label>正式商品<div class="lookup"><input id="qItem" autocomplete="off" placeholder="輸入品號或商品名稱…" value="${selected?esc(selected[0]+' · '+selected[1]):''}"><div class="lookupResults" id="lookupResults"></div></div><span class="hint">必須明確點選搜尋結果，不能只輸入相似名稱。</span></label>`}
function bindLookup(current){let selected=current||null;const input=$('qItem'),box=$('lookupResults');input._getSelected=()=>selected;function draw(){const q=input.value.toLowerCase().trim();if(!q||selected&&input.value===selected[0]+' · '+selected[1]){box.classList.remove('open');return}const found=items.filter(i=>(i[0]+' '+i[1]+' '+i[2]).toLowerCase().includes(q));box.innerHTML=found.map((i,n)=>`<button type="button" data-i="${n}"><b>${i[0]} · ${i[1]}</b><br><small>${i[2]}</small></button>`).join('')||'<button type="button" disabled>找不到資料</button>';box.classList.add('open');box.querySelectorAll('[data-i]').forEach((b,n)=>b.onclick=()=>{selected=found[n];input.value=selected[0]+' · '+selected[1];box.classList.remove('open');dirty=true})}input.oninput=()=>{selected=null;dirty=true;draw()};input.onfocus=draw}
function breakRowsHtml(rows){return rows.map((r,i)=>`<div class="rowCard quoteBreak"><div class="grid3"><label>數量 ${i+1}<input class="bQty" value="${esc(r[0])}"></label><label>單位<input class="bUnit" value="${esc(r[1])}"></label><label>單價<input class="bPrice" value="${esc(r[2])}"></label></div><div class="rowHead"><label style="flex:1">備註<input class="bNote" maxlength="120"></label><button class="btn quiet removeBreak" type="button">移除</button></div></div>`).join('')}
function openQuote(id){const q=id?(quotes[customerId]||[]).find(x=>x.id===id):null;editor={type:'quote',id:id||null};openDrawer(q?'修正既有報價紀錄':'新增報價紀錄',q?'只用於修正原始輸入錯誤；新的價格請另外新增一筆歷史。':'每次新的商業報價建立新的 Customer＋Item 價格歷史。',`<div class="form">${q?'<div class="warnbox"><b>這不是建立新價格</b><br>正式版會保留修正前／後 Audit；如果今天是真的報新價格，請取消後改用「新增報價紀錄」。</div>':''}<div class="grid2"><label>報價日期<input id="qDate" type="date" value="${q?.date||'2026-09-27'}"></label><label>報價人員<select id="qEmp"><option ${q?.emp==='王○○'?'selected':''}>王○○</option><option ${q?.emp==='李○○'?'selected':''}>李○○</option></select></label></div>${itemLookupHtml(q?.item)}<div class="rowHead"><div><b>數量／單價級距</b><div class="hint">最多 10 個級距</div></div><button class="btn quiet" id="addBreak" type="button">＋ 級距</button></div><div id="breaks">${breakRowsHtml(q?.breaks||[['','盒','']])}</div>${q?'<label>修正原因（選填）<textarea id="qReason" rows="3" maxlength="240"></textarea></label>':''}</div>`,q?'確認修正':'新增報價',true);bindLookup(q?.item||null);bindBreaks();$('addBreak').onclick=()=>{if(document.querySelectorAll('.quoteBreak').length>=10)return;$('breaks').insertAdjacentHTML('beforeend',breakRowsHtml([['','盒','']]));dirty=true;bindBreaks()}}
function bindBreaks(){document.querySelectorAll('.removeBreak').forEach(b=>b.onclick=()=>{b.closest('.quoteBreak').remove();dirty=true});document.querySelectorAll('.quoteBreak input').forEach(i=>i.oninput=()=>dirty=true)}
function saveQuote(){const selected=$('qItem')._getSelected();if(!selected){alert('請明確選擇正式商品');return}const rows=[...document.querySelectorAll('.quoteBreak')].map(card=>[card.querySelector('.bQty').value.trim(),card.querySelector('.bUnit').value.trim(),card.querySelector('.bPrice').value.trim()]);if(!rows.length||rows.some(r=>!r[0]||!r[1]||r[2]==='')){alert('請完整填寫數量、單位、單價');return}const arr=[...(quotes[customerId]||[])],date=$('qDate').value,emp=$('qEmp').value;if(editor.id){const i=arr.findIndex(q=>q.id===editor.id);arr[i]={...arr[i],date,item:selected,emp,breaks:rows,rev:arr[i].rev+1,corrected:true};showToast('已修正既有報價（預覽）','正式版會在同一交易保留修正前後 Audit。')}else{arr.unshift({id:Date.now(),date,item:selected,emp,breaks:rows,rev:1});showToast('已新增報價紀錄（預覽）','新的商業價格建立新歷史，不覆蓋舊報價。')}quotes[customerId]=arr;closeDrawer(true);render()}
function openFrequent(){editor={type:'frequent'};openDrawer('編輯常用商品','正式商品必須明確選取；未建檔需求保留自由文字。',`<div class="form"><div class="rowHead"><div><b>常用商品清單</b><div class="hint">每列只能是正式商品或未建檔其中一種。</div></div><button class="btn quiet" id="addFreq" type="button">＋ 新增</button></div><div id="freqRows">${(frequent[customerId]||[]).map(freqEditHtml).join('')}</div></div>`, '儲存',true);$('addFreq').onclick=()=>{$('freqRows').insertAdjacentHTML('beforeend',freqEditHtml({id:Date.now(),type:'free',name:'',cat:''}));dirty=true;bindFreq()};bindFreq()}
function freqEditHtml(r){return `<div class="rowCard freqEdit"><div class="rowHead"><label style="flex:1">類型<select class="fType"><option value="formal" ${r.type==='formal'?'selected':''}>正式商品</option><option value="free" ${r.type==='free'?'selected':''}>未建檔／自由文字</option></select></label><button class="btn quiet fRemove" type="button">移除</button></div><div class="formalFields" style="display:${r.type==='formal'?'block':'none'}"><label>正式商品<select class="fItem"><option value="">請明確選擇</option>${items.map((i,n)=>`<option value="${n}" ${r.item===i?'selected':''}>${i[0]} · ${i[1]} · ${i[2]}</option>`).join('')}</select></label></div><div class="freeFields grid2" style="display:${r.type==='free'?'grid':'none'}"><label>未建檔商品名稱<input class="fName" value="${esc(r.name||'')}"></label><label>分類／備註<input class="fCat" value="${esc(r.cat||'')}"></label></div></div>`}
function bindFreq(){document.querySelectorAll('.freqEdit').forEach(card=>{const type=card.querySelector('.fType');type.onchange=()=>{dirty=true;card.querySelector('.formalFields').style.display=type.value==='formal'?'block':'none';card.querySelector('.freeFields').style.display=type.value==='free'?'grid':'none'};card.querySelector('.fRemove').onclick=()=>{card.remove();dirty=true};card.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>dirty=true))})}
function saveFrequent(){const rows=[...document.querySelectorAll('.freqEdit')].map((card,i)=>{const type=card.querySelector('.fType').value;if(type==='formal'){const n=card.querySelector('.fItem').value;if(n==='')throw new Error(`第 ${i+1} 列請選正式商品`);return{id:Date.now()+i,type:'formal',item:items[Number(n)]}}const name=card.querySelector('.fName').value.trim();if(!name)throw new Error(`第 ${i+1} 列請輸入未建檔商品名稱`);return{id:Date.now()+i,type:'free',name,cat:card.querySelector('.fCat').value.trim()}});frequent[customerId]=rows;showToast('已更新常用商品（預覽）','自由文字不會自動變成正式 Item。');closeDrawer(true);render()}
function ask(title,text,action){modalAction=action;$('modalTitle').textContent=title;$('modalText').textContent=text;$('modalBackdrop').classList.add('open')}
$('modalCancel').onclick=()=>{$('modalBackdrop').classList.remove('open');modalAction=null};$('modalConfirm').onclick=()=>{const a=modalAction;$('modalBackdrop').classList.remove('open');modalAction=null;a&&a()};$('drawerX').onclick=()=>closeDrawer();$('drawerCancel').onclick=()=>closeDrawer();$('drawerSave').onclick=()=>{try{if(editor?.type==='visit')saveVisit();if(editor?.type==='quote')saveQuote();if(editor?.type==='frequent')saveFrequent()}catch(e){alert(e.message)}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('customerSelect').onchange=e=>{customerId=Number(e.target.value);$('customerName').textContent=customers[customerId].name;$('customerNo').textContent=customers[customerId].no;tab='visits';render()};render();
</script>
</body></html>
