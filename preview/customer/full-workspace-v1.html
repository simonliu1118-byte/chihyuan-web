      <div class="panel listpanel">

          <div class="resultmeta"><span id="summary">示範結果 3 筆</span><button class="clear" id="clearBtn" type="button">清除條件</button></div>

function renderRows(){const list=filtered();$('count').textContent=list.length;$('summary').textContent=`示範結果 ${list.length} 筆`;$('rows').innerHTML=list.map(c=>`<div class="row ${c.id===selectedId?'active':''}" onclick="selectCustomer(${c.id})"><div><strong>${esc(c.short)}</strong><small>${esc(c.no||'尚無 ERP 編號')}</small></div><span class="region">${esc(c.region)}</span><span class="status">${chip(c.status)}</span></div>`).join('')||'<div class="empty">沒有符合的客戶</div>'}
function renderDetail(){const c=customers.find(x=>x.id===selectedId);if(customerEdit){renderCustomerForm(c);return}if(!c){$('detail').innerHTML='<div class="empty">尚未選擇客戶</div>';return}$('detail').innerHTML=`<div class="detailhead"><div><div class="titleline"><h2>${esc(c.short)}</h2>${chip(c.status)}</div><div class="subtitle">${esc(c.full)}</div><div class="meta"><span>${esc(c.no||'尚未建立 ERP 客戶編號')}</span><span>${esc(c.cat)}</span><span>${esc(c.region)}</span><span>${esc(c.dept)} / ${esc(c.owner)}</span></div></div><div class="actions"><button class="btn secondary" onclick="startCustomerEdit()">修改</button></div></div>
<div class="grid"><div class="card"><div class="cardtitle">基本資料</div><div class="vals"><div class="val"><span>客戶編號</span><b>${esc(c.no||'尚未建立')}</b></div><div class="val"><span>統一編號</span><b>${esc(c.tax||'未填寫')}</b></div><div class="val"><span>客戶分類</span><b>${esc(c.cat)}</b></div><div class="val"><span>客戶狀態</span><b>${esc(c.status)}</b></div></div></div><div class="card"><div class="cardtitle">負責資訊</div><div class="vals"><div class="val"><span>地區</span><b>${esc(c.region)}</b></div><div class="val"><span>負責部門</span><b>${esc(c.dept)}</b></div><div class="val"><span>業務人員</span><b>${esc(c.owner)}</b></div><div class="val"><span>最後更新</span><b>${esc(c.updated)}</b></div></div></div>
<div class="card wide"><div class="cardtitle">聯絡方式</div><div class="contactgrid"><div><div class="subhead">電話 / 傳真</div>${c.phones.map(p=>`<div class="line">${esc(p)}</div>`).join('')||'<div class="muted">尚無電話</div>'}<div class="line muted">傳真：${esc(c.fax||'—')}</div></div><div><div class="subhead">聯絡人</div>${c.contacts.map(x=>`<div class="contactrow"><b>${esc(x.name)}</b><span>${esc(x.detail)}</span><span class="muted">${esc(x.mobile||'—')}</span></div>`).join('')||'<div class="muted">尚無聯絡人</div>'}</div></div></div>
<div class="card wide"><div class="cardtitle">地址</div>${c.addresses.map(a=>`<div class="addrrow"><span class="muted">${esc(a.postal)}</span><b>${esc(a.address)}</b><span class="muted">${esc(a.note||'')}</span></div>`).join('')||'<div class="muted">尚無地址</div>'}</div><div class="card wide warn"><div class="cardtitle">重要備註</div><div class="notes">${c.notes.map(n=>`<div>• ${esc(n)}</div>`).join('')||'<div class="muted">尚無重要備註</div>'}</div></div></div>${renderRelated(c)}`}
function renderRelated(c){const tabs=[['visits','拜訪紀錄'],['quotes','報價紀錄'],['frequent','常用商品'],['history','動態 / 歷史']];let body='';if(activeTab==='visits')body=renderVisits(c);else if(activeTab==='quotes')body=renderQuotes(c);else if(activeTab==='frequent')body=renderFrequent(c);else body='<div class="empty">正式版這裡只顯示真正的 Audit Timeline；一般主檔修改仍以最後更新資訊為主。</div>';return `<div class="related"><div class="tabs">${tabs.map(([k,l])=>`<button class="${activeTab===k?'active':''}" onclick="activeTab='${k}';renderDetail()">${l}</button>`).join('')}</div><div class="tabbody">${body}</div></div>`}
function renderVisits(c){const arr=visits[c.id]||[];return `<div class="relhead"><div><strong>最近拜訪</strong><span>人物名稱保留拜訪當時快照。</span></div><button class="btn secondary sm" onclick="openVisit(null)">新增拜訪</button></div>${arr.length?arr.map(v=>`<div class="visit"><time>${esc(v.date)}</time><div class="dot"></div><div class="visitbody"><div class="visitmeta"><b>${esc(v.person)}</b><span>記錄：${esc(emp(v.employeeId))}</span><span>rev. ${v.revision}</span></div><p>${esc(v.content)}</p><div class="rowactions"><button class="btn quiet sm" onclick="openVisit(${v.id})">修改</button><button class="btn quiet sm" onclick="deleteVisit(${v.id})">刪除</button></div></div></div>`).join(''):'<div class="empty">尚無拜訪紀錄</div>'}`}
function renderQuotes(c){const arr=quotes[c.id]||[];return `<div class="relhead"><div><strong>報價歷史</strong><span>新的商業價格建立新歷史；原輸入錯誤才用「修正紀錄」。</span></div><button class="btn secondary sm" onclick="openQuote(null)">新增報價紀錄</button></div>${arr.length?arr.map(q=>{const it=item(q.itemId);return `<div class="quote"><header><div><b>${esc(it.name)}</b><br><span>${esc(it.no)} · ${esc(it.spec)}</span></div><div style="text-align:right"><b>${esc(q.date)}</b><br><span>${esc(emp(q.employeeId))} · rev. ${q.revision}</span></div></header><div class="breaks"><div class="breakrow head"><span>數量</span><span>單位</span><span>單價</span></div>${q.breaks.map(b=>`<div class="breakrow"><span>${esc(b.q)}</span><span>${esc(b.u)}</span><span>${esc(b.p)}</span></div>`).join('')}</div><div class="rowactions" style="padding:7px 9px"><button class="btn quiet sm" onclick="openQuote(${q.id})">修正紀錄</button></div></div>`}).join(''):'<div class="empty">尚無報價紀錄</div>'}<div class="muted" style="font-size:10px;margin-top:7px">目前沒有「刪除報價」操作；保留歷史＋受稽核修正。</div>`}
function renderFrequent(c){const arr=frequent[c.id]||[];return `<div class="relhead"><div><strong>常用商品</strong><span>正式商品與未建檔需求維持不同身份。</span></div><button class="btn secondary sm" onclick="openFrequent()">編輯常用商品</button></div>${arr.length?`<div class="frequentgrid">${arr.map(x=>x.kind==='formal'?`<div class="frequent">${chip('正式商品')}<b>${esc(item(x.itemId).name)}</b><span>${esc(item(x.itemId).no)}</span><small>${esc(item(x.itemId).spec)}</small></div>`:`<div class="frequent"><span class="chip warn">未建檔</span><b>${esc(x.name)}</b><small>${esc(x.category)}</small></div>`).join('')}</div>`:'<div class="empty">尚無常用商品</div>'}`}
function startCustomerEdit(){const c=customers.find(x=>x.id===selectedId);customerEdit=JSON.parse(JSON.stringify(c));dirty=false;renderDetail()}function startCustomerCreate(){if(customerEdit&&dirty&&!confirm('目前有未儲存變更，確定捨棄？'))return;customerEdit={id:null,no:'',short:'',full:'',tax:'',cat:'中醫診所',region:'高雄市',owner:'王○○',dept:'南區業務',status:'潛在客戶',phones:[],fax:'',contacts:[],addresses:[],notes:[],updated:''};dirty=false;renderDetail()}
function field(name,label,value,type='text',extra=''){return `<div class="field"><label>${label}</label><input data-core="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function select(name,label,value,opts){return `<div class="field"><label>${label}</label><select data-core="${name}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function renderCustomerForm(original){const c=customerEdit;$('detail').innerHTML=`<div class="detailhead"><div><div class="titleline"><h2>${c.id?'修改客戶':'新增客戶'}</h2><span class="chip warn">未儲存</span></div><div class="subtitle">功能預覽；既有客戶編號不在一般修改中直接更動。</div></div></div><div class="form"><div class="formsection"><h3>基本資料</h3><div class="formgrid">${field('no','客戶編號',c.no||'','text',c.id?'readonly':'')}${field('short','客戶簡稱',c.short)}${field('full','客戶全名',c.full)}${field('tax','統一編號',c.tax||'')}${select('cat','客戶分類',c.cat,['中醫診所','潛在客戶','其他'])}${select('status','客戶狀態',c.status,['往來中','潛在客戶','已歇業'])}${select('region','地區',c.region,['高雄市','台南市','屏東縣'])}${select('dept','負責部門',c.dept,['南區業務','門市','其他'])}${select('owner','業務人員',c.owner,['王○○','李○○','未指定'])}${field('fax','傳真',c.fax||'')}</div></div>
<div class="formsection"><h3>電話</h3><div id="phoneList" class="repeat"></div><button class="btn quiet sm" type="button" onclick="addPhone()">＋ 電話</button></div><div class="formsection"><h3>聯絡人</h3><div id="contactList" class="repeat"></div><button class="btn quiet sm" type="button" onclick="addContact()">＋ 聯絡人</button></div><div class="formsection"><h3>地址</h3><div id="addressList" class="repeat"></div><button class="btn quiet sm" type="button" onclick="addAddress()">＋ 地址</button></div><div class="formsection"><h3>重要備註</h3><div id="noteList" class="repeat"></div><button class="btn quiet sm" type="button" onclick="addNote()">＋ 備註</button></div></div><div class="formactions"><button class="btn secondary" onclick="cancelCustomerEdit()">取消</button><button class="btn primary" onclick="saveCustomer()">儲存</button></div>`;bindCore();renderRepeats()}
function bindCore(){document.querySelectorAll('[data-core]').forEach(el=>el.addEventListener('input',()=>{customerEdit[el.dataset.core]=el.value;dirty=true}))}
function renderRepeats(){if(!customerEdit)return;$('phoneList').innerHTML=customerEdit.phones.map((p,i)=>`<div class="repeatrow"><div class="field"><label>聯絡電話 ${i+1}</label><input value="${esc(p)}" oninput="customerEdit.phones[${i}]=this.value;dirty=true"></div><button class="btn quiet sm" onclick="customerEdit.phones.splice(${i},1);dirty=true;renderRepeats()">移除</button></div>`).join('');$('contactList').innerHTML=customerEdit.contacts.map((x,i)=>`<div class="repeatrow"><div class="repeatgrid"><div class="field"><label>姓名</label><input value="${esc(x.name)}" oninput="customerEdit.contacts[${i}].name=this.value;dirty=true"></div><div class="field"><label>部門 / 職務</label><input value="${esc(x.detail)}" oninput="customerEdit.contacts[${i}].detail=this.value;dirty=true"></div><div class="field"><label>行動電話</label><input value="${esc(x.mobile||'')}" oninput="customerEdit.contacts[${i}].mobile=this.value;dirty=true"></div></div><button class="btn quiet sm" onclick="customerEdit.contacts.splice(${i},1);dirty=true;renderRepeats()">移除</button></div>`).join('');$('addressList').innerHTML=customerEdit.addresses.map((a,i)=>`<div class="repeatrow"><div class="repeatgrid"><div class="field"><label>郵遞區號</label><input value="${esc(a.postal)}" oninput="customerEdit.addresses[${i}].postal=this.value;dirty=true"></div><div class="field"><label>地址</label><input value="${esc(a.address)}" oninput="customerEdit.addresses[${i}].address=this.value;dirty=true"></div><div class="field"><label>備註</label><input value="${esc(a.note||'')}" oninput="customerEdit.addresses[${i}].note=this.value;dirty=true"></div></div><button class="btn quiet sm" onclick="customerEdit.addresses.splice(${i},1);dirty=true;renderRepeats()">移除</button></div>`).join('');$('noteList').innerHTML=customerEdit.notes.map((n,i)=>`<div class="repeatrow"><div class="field"><label>重要備註 ${i+1}</label><input value="${esc(n)}" oninput="customerEdit.notes[${i}]=this.value;dirty=true"></div><button class="btn quiet sm" onclick="customerEdit.notes.splice(${i},1);dirty=true;renderRepeats()">移除</button></div>`).join('')}
function addPhone(){customerEdit.phones.push('');dirty=true;renderRepeats()}function addContact(){customerEdit.contacts.push({name:'',detail:'',mobile:''});dirty=true;renderRepeats()}function addAddress(){customerEdit.addresses.push({postal:'',address:'',note:''});dirty=true;renderRepeats()}function addNote(){customerEdit.notes.push('');dirty=true;renderRepeats()}function cancelCustomerEdit(){if(dirty&&!confirm('捨棄未儲存變更？'))return;customerEdit=null;dirty=false;renderDetail()}
function saveCustomer(){const c=customerEdit;if(!c.short.trim()){alert('客戶簡稱必填');return}if(c.tax&&customers.some(x=>x.id!==c.id&&x.tax===c.tax)&&!confirm('統一編號已有其他客戶。系統允許重複，確定仍要儲存？'))return;c.updated='2026-09-27 16:00';if(c.id){customers=customers.map(x=>x.id===c.id?JSON.parse(JSON.stringify(c)):x);selectedId=c.id}else{c.id=Math.max(...customers.map(x=>x.id))+1;customers.push(JSON.parse(JSON.stringify(c)));selectedId=c.id;visits[c.id]=[];quotes[c.id]=[];frequent[c.id]=[]}customerEdit=null;dirty=false;toast('客戶主檔已儲存到預覽記憶體');render()}
function openDrawer(title,desc,body,saveLabel,saveFn){drawerState={saveFn};$('drawerTitle').textContent=title;$('drawerDesc').textContent=desc;$('drawerBody').innerHTML=body;$('drawerFoot').innerHTML=`<button class="btn secondary" onclick="closeDrawer()">取消</button><button class="btn primary" id="drawerSave">${esc(saveLabel)}</button>`;$('drawerSave').onclick=saveFn;$('drawerBack').classList.add('open')}
function closeDrawer(){drawerState=null;$('drawerBack').classList.remove('open')}$('drawerClose').onclick=closeDrawer;$('drawerBack').addEventListener('click',e=>{if(e.target===$('drawerBack'))closeDrawer()});
function openVisit(id){const c=customers.find(x=>x.id===selectedId),existing=(visits[selectedId]||[]).find(v=>v.id===id),d=existing?{...existing}:{id:null,date:'2026-09-27',person:'',employeeId:1,content:''};const contacts=c.contacts.map(x=>x.name);openDrawer(existing?'修改拜訪紀錄':'新增拜訪紀錄','正式版會驗證 Customer、Contact、Employee 與 revision；人物名稱會保存拜訪當時快照。',`<div class="drawersection"><div class="drawergrid2"><div class="field"><label>拜訪日期</label><input id="vDate" type="date" value="${esc(d.date)}"></div><div class="field"><label>記錄／負責人</label><select id="vEmp">${employees.map(x=>`<option value="${x.id}" ${x.id===d.employeeId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div></div><div class="field"><label>聯絡人（可選）</label><select id="vContact"><option value="">不連結聯絡人</option>${contacts.map(n=>`<option ${n===d.person?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field"><label>當時拜訪對象</label><input id="vPerson" value="${esc(d.person)}"></div><div class="field"><label>拜訪內容</label><textarea id="vContent">${esc(d.content)}</textarea></div></div>`,'儲存',()=>{const date=$('vDate').value,person=$('vPerson').value.trim()||$('vContact').value,content=$('vContent').value.trim(),employeeId=Number($('vEmp').value);if(!date||!person||!content){alert('拜訪日期、拜訪對象與內容為必填');return}if(existing){Object.assign(existing,{date,person,content,employeeId,revision:existing.revision+1})}else{(visits[selectedId]??=[]).unshift({id:Date.now(),date,person,content,employeeId,revision:1})}closeDrawer();toast(existing?'已更新拜訪（預覽）':'已新增拜訪（預覽）');renderDetail()});setTimeout(()=>{$('vContact').onchange=()=>{if(!$('vPerson').value.trim())$('vPerson').value=$('vContact').value}},0)}
function deleteVisit(id){if(!confirm('確定刪除這筆拜訪？正式版刪除會同時寫入 Audit。'))return;visits[selectedId]=(visits[selectedId]||[]).filter(v=>v.id!==id);toast('已刪除拜訪（預覽）');renderDetail()}
function openQuote(id){const existing=(quotes[selectedId]||[]).find(q=>q.id===id),d=existing?JSON.parse(JSON.stringify(existing)):{id:null,date:'2026-09-27',itemId:items[0].id,employeeId:1,breaks:[{q:'',u:'盒',p:''}]};let correctionReason='';function body(){return `${existing?'<div class="warning"><b>這不是建立新價格。</b><br>只有原始資料輸入錯誤才修正既有紀錄；今天真正報了新價格時，請建立新報價紀錄。</div>':''}<div class="drawergrid2" style="margin-top:10px"><div class="field"><label>報價日期</label><input id="qDate" type="date" value="${esc(d.date)}"></div><div class="field"><label>報價人員</label><select id="qEmp">${employees.map(x=>`<option value="${x.id}" ${x.id===d.employeeId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div></div><div class="field" style="margin-top:9px"><label>正式商品</label><select id="qItem">${items.map(x=>`<option value="${x.id}" ${x.id===d.itemId?'selected':''}>${esc(x.no)} · ${esc(x.name)} · ${esc(x.spec)}</option>`).join('')}</select></div><div class="draweritemhead" style="margin-top:12px"><b>數量／單價級距</b><button class="btn quiet sm" id="addBreak">＋ 級距</button></div><div id="breakEditor"></div>${existing?'<div class="field" style="margin-top:10px"><label>修正原因（選填）</label><textarea id="qReason" rows="3"></textarea></div>':''}`}
openDrawer(existing?'修正既有報價紀錄':'新增報價紀錄',existing?'修正會保留同一筆歷史身分並寫 Audit。':'每次新的商業報價建立一筆新的 Customer＋Item 價格歷史。',body(),existing?'確認修正':'新增報價',()=>{d.date=$('qDate').value;d.employeeId=Number($('qEmp').value);d.itemId=Number($('qItem').value);correctionReason=existing?$('qReason').value.trim():'';const rows=[...document.querySelectorAll('[data-break]')].map(el=>({q:el.querySelector('.bq').value.trim(),u:el.querySelector('.bu').value.trim(),p:el.querySelector('.bp').value.trim()}));if(!d.date||rows.length===0||rows.some(r=>!r.q||Number(r.q)<=0||!r.u||r.p===''||Number(r.p)<0)){alert('請完整填寫日期與所有數量／單位／單價級距');return}d.breaks=rows;if(existing){Object.assign(existing,d,{revision:existing.revision+1,corrected:true,correctionReason})}else{d.id=Date.now();d.revision=1;(quotes[selectedId]??=[]).unshift(d)}closeDrawer();toast(existing?'已修正既有報價（預覽）':'已新增報價紀錄（預覽）');renderDetail()});function renderBreaks(){$('breakEditor').innerHTML=d.breaks.map((b,i)=>`<div class="draweritem" data-break><div class="drawergrid3"><div class="field"><label>數量 ${i+1}</label><input class="bq" value="${esc(b.q)}"></div><div class="field"><label>單位</label><input class="bu" value="${esc(b.u)}"></div><div class="field"><label>單價</label><input class="bp" value="${esc(b.p)}"></div></div><div style="text-align:right;margin-top:6px"><button class="btn quiet sm" onclick="window.removeBreak(${i})">移除</button></div></div>`).join('')}window.removeBreak=i=>{if(d.breaks.length<=1)return;d.breaks.splice(i,1);renderBreaks()};setTimeout(()=>{$('addBreak').onclick=()=>{if(d.breaks.length>=10)return;d.breaks.push({q:'',u:'盒',p:''});renderBreaks()};renderBreaks()},0)}
function openFrequent(){let d=JSON.parse(JSON.stringify(frequent[selectedId]||[]));function body(){return `<div class="draweritemhead"><b>常用商品清單</b><button class="btn quiet sm" id="addFreq">＋ 新增</button></div><div id="freqEditor"></div>`}openDrawer('編輯常用商品','每列只能是正式商品或未建檔自由文字其中一種；正式商品必須明確選取。',body(),'儲存',()=>{const rows=[...document.querySelectorAll('[data-freq]')].map((el,i)=>{const kind=el.querySelector('.fkind').value;return kind==='formal'?{id:d[i]?.id||Date.now()+i,kind:'formal',itemId:Number(el.querySelector('.fitem').value),name:'',category:''}:{id:d[i]?.id||Date.now()+i,kind:'free',itemId:null,name:el.querySelector('.fname').value.trim(),category:el.querySelector('.fcat').value.trim()}});if(rows.some(r=>r.kind==='free'&&!r.name)){alert('未建檔項目必須輸入名稱');return}frequent[selectedId]=rows;closeDrawer();toast('已更新常用商品（預覽）');renderDetail()});function renderFreq(){$('freqEditor').innerHTML=d.map((x,i)=>`<div class="draweritem" data-freq><div class="draweritemhead"><div class="field" style="min-width:170px"><label>類型 ${i+1}</label><select class="fkind" onchange="window.changeFreqKind(${i},this.value)"><option value="formal" ${x.kind==='formal'?'selected':''}>正式商品</option><option value="free" ${x.kind==='free'?'selected':''}>未建檔／自由文字</option></select></div><button class="btn quiet sm" onclick="window.removeFreq(${i})">移除</button></div>${x.kind==='formal'?`<div class="field" style="margin-top:8px"><label>正式商品</label><select class="fitem">${items.map(it=>`<option value="${it.id}" ${it.id===x.itemId?'selected':''}>${esc(it.no)} · ${esc(it.name)}</option>`).join('')}</select></div>`:`<div class="drawergrid2" style="margin-top:8px"><div class="field"><label>未建檔商品名稱</label><input class="fname" value="${esc(x.name)}"></div><div class="field"><label>分類／備註</label><input class="fcat" value="${esc(x.category)}"></div></div>`}</div>`).join('')||'<div class="empty">目前沒有項目</div>'}window.changeFreqKind=(i,k)=>{d[i].kind=k;if(k==='formal'){d[i].itemId=items[0].id;d[i].name='';d[i].category=''}else{d[i].itemId=null;d[i].name='';d[i].category=''}renderFreq()};window.removeFreq=i=>{d.splice(i,1);renderFreq()};setTimeout(()=>{$('addFreq').onclick=()=>{d.push({id:Date.now(),kind:'formal',itemId:items[0].id,name:'',category:''});renderFreq()};renderFreq()},0)}
function render(){renderRows();renderDetail()}['search','catFilter','statusFilter','regionFilter'].forEach(id=>$(id).addEventListener('input',renderRows));$('clearBtn').onclick=()=>{$('search').value='';$('catFilter').value='';$('statusFilter').value='';$('regionFilter').value='';renderRows()};$('newCustomerBtn').onclick=startCustomerCreate;window.addEventListener('beforeunload',e=>{if(customerEdit&&dirty){e.preventDefault();e.returnValue=''}});render();
</script>
