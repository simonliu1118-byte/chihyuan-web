<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CY Web｜客戶管理 UI 預覽</title>
<style>
:root{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;--bg:#f4f6f8;--surface:#fff;--muted:#f8fafb;--border:#dfe4e8;--border2:#cbd3da;--text:#18202a;--sub:#647180;--accent:#7a2433;--accentsoft:#f6ecef;--green:#2f6b45;--greensoft:#eaf5ee;--blue:#345f8a;--bluesoft:#eaf2f9;--warn:#8a5b12;--warnsoft:#fff5df;--danger:#9b3131;--radius:14px;--shadow:0 4px 16px rgba(25,35,45,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr)}aside{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:11px;align-items:center;padding:3px}.mark{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand small{color:var(--sub);font-size:11px}.navlabel{font-size:11px;color:var(--sub);font-weight:800;padding:0 9px;margin-bottom:6px}.nav{display:grid;gap:4px}.nav a{padding:10px 11px;border-radius:10px;text-decoration:none;color:#3d4853;font-size:14px;font-weight:700}.nav a.active{background:var(--accentsoft);color:var(--accent)}.nav a.disabled{opacity:.38;pointer-events:none}.aside-note{margin-top:auto;border-top:1px solid var(--border);padding:12px 6px 0;color:var(--sub);font-size:11px;line-height:1.5}.workspace{min-width:0}.topbar{height:62px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.chip{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;background:#edf0f2;color:#4c5965;font-size:12px;font-weight:800}.chip.green{background:var(--greensoft);color:var(--green)}.chip.blue{background:var(--bluesoft);color:var(--blue)}main{max-width:1480px;padding:26px 30px 42px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{font-size:12px;font-weight:900;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin:0 0 5px}.head h1{margin:0;font-size:34px}.desc{margin:8px 0 0;color:var(--sub);font-size:14px;line-height:1.6}.btn{min-height:38px;border:1px solid transparent;border-radius:9px;padding:8px 14px;font-weight:800;cursor:pointer}.btn.primary{background:var(--accent);color:white}.btn.secondary{background:white;border-color:var(--border2);color:var(--text)}.btn.quiet{background:transparent;color:var(--text)}.notice{margin-top:16px;border:1px solid #ccdde9;background:var(--bluesoft);border-radius:12px;padding:12px 14px;font-size:13px;color:#3d5265}.toolbar{margin-top:16px;background:white;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.toolbar .left{display:flex;gap:8px;align-items:center;flex:1;flex-wrap:wrap}.search{flex:1;min-width:250px}.search input,.filter{width:100%;min-height:38px;border:1px solid var(--border2);border-radius:9px;background:#fff;padding:8px 11px}.filter{width:auto;color:var(--sub)}.summary{color:var(--sub);font-size:12px;white-space:nowrap}.split{display:grid;grid-template-columns:minmax(315px,.78fr) minmax(0,1.72fr);gap:16px;margin-top:16px;align-items:start}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.listpanel{position:sticky;top:78px}.panelhead{height:62px;padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.panelhead small{display:block;color:var(--sub);font-size:11px}.count{width:28px;height:28px;border-radius:999px;background:var(--muted);display:grid;place-items:center;color:var(--sub);font-size:12px;font-weight:800}.rows{max-height:670px;overflow:auto}.row{display:grid;grid-template-columns:minmax(0,1fr) 76px auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}.row:hover{background:#fbfcfd}.row.active{background:var(--accentsoft);box-shadow:inset 3px 0 0 var(--accent)}.row strong{font-size:13px}.row small{display:block;color:var(--sub);font-size:11px;margin-top:2px}.row .region{font-size:12px;color:#4f5b66}.detailhead{padding:20px 21px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:16px;background:linear-gradient(#fff,#fbfcfd)}.titleline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.titleline h2{margin:0;font-size:24px}.subtitle{color:var(--sub);font-size:13px;margin-top:4px}.meta{display:flex;gap:7px 12px;flex-wrap:wrap;margin-top:11px;color:#4d5965;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:14px;background:#f7f9fa}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px;min-width:0}.card.wide{grid-column:1/-1}.card.warn{border-color:#ead8b2;background:#fffdf7}.cardtitle{font-weight:900;font-size:13px;margin-bottom:12px}.vals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}.val span{display:block;color:var(--sub);font-size:11px;font-weight:700;margin-bottom:3px}.val b{font-size:13px;overflow-wrap:anywhere}.contactgrid{display:grid;grid-template-columns:.75fr 1.25fr;gap:22px}.subhead{font-size:11px;color:var(--sub);font-weight:800;margin-bottom:6px}.line{font-size:13px;padding:3px 0}.contactrow,.addrrow{display:grid;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}.contactrow{grid-template-columns:90px 1fr 130px}.addrrow{grid-template-columns:46px 1fr 90px}.contactrow:last-child,.addrrow:last-child{border-bottom:0}.muted{color:var(--sub)}.notes{display:grid;gap:6px}.notes div{font-size:12px;color:#5f4a25}.related{border-top:1px solid var(--border)}.tabs{display:flex;gap:4px;padding:9px 11px 0;overflow:auto}.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:8px 10px;color:var(--sub);font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}.tabs button.active{border-bottom-color:var(--accent);color:var(--accent)}.tabbody{min-height:120px;padding:18px;display:flex;justify-content:space-between;gap:18px}.tabbody p{margin:5px 0;color:var(--sub);font-size:12px;line-height:1.6}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field.wide{grid-column:1/-1}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border2);border-radius:9px;padding:9px 10px;background:#fff}.field textarea{min-height:86px;resize:vertical}.editactions{display:flex;gap:8px}.editbanner{margin:14px 14px 0;padding:10px 12px;border-radius:10px;background:var(--warnsoft);color:#6e4e1c;font-size:12px}.toast{position:fixed;right:22px;bottom:22px;background:#fff;border:1px solid var(--border);box-shadow:0 12px 34px rgba(0,0,0,.16);border-radius:12px;padding:12px 14px;font-size:13px;display:none;z-index:20}.toast.show{display:block}.empty{padding:25px;color:var(--sub);text-align:center;font-size:13px}.mobilebar{display:none}.previewtag{font-size:11px;color:var(--sub)}
@media(max-width:1000px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:11px 14px}.brand small,.navlabel,.aside-note{display:none}.nav{display:flex;overflow:auto}.nav a{white-space:nowrap;border:1px solid var(--border);padding:7px 10px}.topbar{display:none}main{padding:18px 14px 30px}.split{grid-template-columns:1fr}.listpanel{position:static}.rows{max-height:none}.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.contactgrid{grid-template-columns:1fr}}
@media(max-width:620px){.head{flex-direction:column}.head .btn{width:100%}.toolbar{align-items:stretch;flex-direction:column}.toolbar .left{display:grid;grid-template-columns:1fr 1fr}.search{grid-column:1/-1;min-width:0}.row{grid-template-columns:1fr auto}.row .region{display:none}.detailhead{flex-direction:column}.editactions{width:100%}.editactions .btn{flex:1}.vals,.formgrid{grid-template-columns:1fr}.field.wide{grid-column:auto}.contactrow,.addrrow{grid-template-columns:1fr}.tabbody{flex-direction:column}.previewtag{display:none}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="mark">CY</div><div><b>CY Web</b><small>Chihyuan Enterprise Management System</small></div></div>
  <div><div class="navlabel">業務</div><nav class="nav"><a class="active" href="#">客戶</a><a class="disabled" href="#">商品</a><a class="disabled" href="#">銷售工單</a><a class="disabled" href="#">委外</a><a class="disabled" href="#">工作日誌</a></nav></div>
  <div><div class="navlabel">管理</div><nav class="nav"><a class="disabled" href="#">設定</a><a class="disabled" href="#">稽核紀錄</a></nav></div>
  <div class="aside-note">UI REVIEW PREVIEW<br>僅靜態示範資料，不連正式 D1。</div>
</aside>
<div class="workspace">
  <div class="topbar"><b>客戶管理</b><span class="chip blue">Preview</span></div>
  <main>
    <section class="head"><div><p class="eyebrow">Customer · UI Review</p><h1>客戶管理</h1><p class="desc">先看整體操作感覺。這是新 Web 架構預覽，不是 GAS 畫面復刻。</p></div><button class="btn primary" id="newBtn">新增客戶</button></section>
    <div class="notice"><b>預覽環境：</b>所有資料都只是示範，儲存只會改目前瀏覽器記憶體，重新整理即還原。</div>
    <section class="toolbar"><div class="left"><label class="search"><input id="search" type="search" placeholder="客戶編號、名稱、統編、地區…"></label><select class="filter" disabled><option>分類</option></select><select class="filter" disabled><option>狀態</option></select><select class="filter" disabled><option>地區</option></select></div><div class="summary" id="summary"></div></section>
    <section class="split">
      <div class="panel listpanel"><div class="panelhead"><div><small>搜尋結果</small><b>選擇客戶</b></div><span class="count" id="count">3</span></div><div class="rows" id="rows"></div></div>
      <div class="panel" id="detail"></div>
    </section>
  </main>
</div>
</div>
<div class="toast" id="toast">已儲存到預覽記憶體，未寫入 D1。</div>
<script>
const seed=[
{id:1,no:'C-00128',short:'示範中醫診所',full:'示範中醫診所有限公司',tax:'12345678',cat:'中醫診所',region:'高雄市',owner:'王○○',dept:'南區業務',status:'往來中',phones:['07-555-0188 #12','07-555-0199'],fax:'07-555-0100',contacts:[['林小姐','採購 / 管理','09xx-xxx-128'],['陳先生','院務','—']],addresses:[['807','高雄市三民區示範路 100 號','主要收貨'],['802','高雄市苓雅區範例街 20 號','帳單']],notes:['每月月底前寄送對帳單','收貨前請先電話聯絡'],updated:'2026-09-26 16:40'},
{id:2,no:null,short:'測試養生館',full:'測試養生館',tax:null,cat:'潛在客戶',region:'台南市',owner:'李○○',dept:'南區業務',status:'潛在客戶',phones:['06-222-0111'],fax:null,contacts:[['黃小姐','負責人','09xx-xxx-622']],addresses:[['700','台南市中西區測試路 8 號','']],notes:['尚未建立 SMART ERP 客戶編號'],updated:'2026-09-25 11:18'},
{id:3,no:'C-00041',short:'範例診所',full:'範例診所',tax:'87654321',cat:'中醫診所',region:'屏東縣',owner:'王○○',dept:'南區業務',status:'已歇業',phones:['08-777-0123'],fax:null,contacts:[],addresses:[['900','屏東縣屏東市範例路 3 號','']],notes:['保留歷史資料'],updated:'2026-08-11 09:05'}];
let customers=structuredClone(seed),selected=1,editing=false,creating=false,tab='拜訪紀錄';
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function tone(status){return status==='往來中'?'green':status==='潛在客戶'?'blue':''}
function filtered(){const q=$('#search').value.trim().toLowerCase();return customers.filter(c=>!q||[c.no,c.short,c.full,c.tax,c.region].filter(Boolean).join(' ').toLowerCase().includes(q))}
function renderRows(){const data=filtered();$('#count').textContent=data.length;$('#summary').textContent=`示範結果 ${data.length} 筆`;$('#rows').innerHTML=data.length?data.map(c=>`<div class="row ${c.id===selected&&!creating?'active':''}" data-id="${c.id}"><div><strong>${esc(c.short)}</strong><small>${esc(c.no||'尚無 ERP 編號')}</small></div><div class="region">${esc(c.region)}</div><span class="chip ${tone(c.status)}">${esc(c.status)}</span></div>`).join(''):'<div class="empty">沒有符合的客戶</div>';document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{if(editing&&!confirm('尚有未儲存變更，確定切換客戶？'))return;selected=Number(r.dataset.id);editing=false;creating=false;tab='拜訪紀錄';render()})}
function val(label,value){return `<div class="val"><span>${label}</span><b>${esc(value||'—')}</b></div>`}
function view(c){return `<div class="detailhead"><div><div class="titleline"><h2>${esc(c.short)}</h2><span class="chip ${tone(c.status)}">${esc(c.status)}</span></div><div class="subtitle">${esc(c.full)}</div><div class="meta"><span>${esc(c.no||'尚未建立 ERP 客戶編號')}</span><span>${esc(c.cat)}</span><span>${esc(c.region)}</span><span>${esc(c.dept)} / ${esc(c.owner)}</span></div></div><button class="btn secondary" id="editBtn">修改</button></div>
<div class="grid"><div class="card"><div class="cardtitle">基本資料</div><div class="vals">${val('客戶編號',c.no||'尚未建立')}${val('統一編號',c.tax||'未填寫')}${val('客戶分類',c.cat)}${val('客戶狀態',c.status)}</div></div><div class="card"><div class="cardtitle">負責資訊</div><div class="vals">${val('地區',c.region)}${val('負責部門',c.dept)}${val('業務人員',c.owner)}${val('最後更新',c.updated)}</div></div>
<div class="card wide"><div class="cardtitle">聯絡方式</div><div class="contactgrid"><div><div class="subhead">電話 / 傳真</div>${c.phones.map(p=>`<div class="line">${esc(p)}</div>`).join('')}<div class="line muted">傳真：${esc(c.fax||'—')}</div></div><div><div class="subhead">聯絡人</div>${c.contacts.length?c.contacts.map(x=>`<div class="contactrow"><b>${esc(x[0])}</b><span class="muted">${esc(x[1])}</span><span class="muted">${esc(x[2])}</span></div>`).join(''):'<div class="muted">尚無聯絡人</div>'}</div></div></div>
<div class="card wide"><div class="cardtitle">地址</div>${c.addresses.map(a=>`<div class="addrrow"><span class="muted">${esc(a[0])}</span><b>${esc(a[1])}</b><span class="muted">${esc(a[2])}</span></div>`).join('')}</div><div class="card wide warn"><div class="cardtitle">重要備註</div><div class="notes">${c.notes.map(n=>`<div>• ${esc(n)}</div>`).join('')}</div></div></div>${related()}`}
function related(){const tabs=['拜訪紀錄','報價紀錄','常用商品','動態 / 歷史'];return `<div class="related"><div class="tabs">${tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div><div class="tabbody"><div><b>${tab}</b><p>正式版會在切換時透過 Worker / D1 按需取得，不跟客戶主檔整包載入。</p></div><span class="chip blue">按需載入</span></div></div>`}
function form(c){const v=c||{no:'',short:'',full:'',tax:'',cat:'中醫診所',region:'高雄市',owner:'王○○',dept:'南區業務',status:'潛在客戶',fax:'',phones:[],notes:[]};return `<div class="detailhead"><div><div class="titleline"><h2>${creating?'新增客戶':'修改客戶'}</h2><span class="chip blue">編輯中</span></div><div class="subtitle">一般查看模式不會滿畫面 disabled input；只有編輯時才切換表單。</div></div><div class="editactions"><button class="btn secondary" id="cancelBtn">取消</button><button class="btn primary" id="saveBtn">儲存</button></div></div><div class="editbanner">預覽儲存只更新目前頁面的示範資料，不會寫入 D1。</div><div class="grid"><div class="card wide"><div class="cardtitle">基本資料</div><div class="formgrid"><div class="field"><label>客戶編號</label><input id="fNo" value="${esc(v.no||'')}" ${!creating?'readonly':''}></div><div class="field"><label>統一編號</label><input id="fTax" maxlength="8" value="${esc(v.tax||'')}"></div><div class="field"><label>客戶簡稱 *</label><input id="fShort" value="${esc(v.short||'')}"></div><div class="field"><label>客戶全名</label><input id="fFull" value="${esc(v.full||'')}"></div><div class="field"><label>分類</label><select id="fCat"><option>中醫診所</option><option>潛在客戶</option><option>其他</option></select></div><div class="field"><label>狀態</label><select id="fStatus"><option>往來中</option><option>潛在客戶</option><option>已歇業</option></select></div></div></div><div class="card"><div class="cardtitle">負責資訊</div><div class="formgrid"><div class="field"><label>地區</label><input id="fRegion" value="${esc(v.region||'')}"></div><div class="field"><label>負責部門</label><input id="fDept" value="${esc(v.dept||'')}"></div><div class="field"><label>業務人員</label><input id="fOwner" value="${esc(v.owner||'')}"></div></div></div><div class="card"><div class="cardtitle">聯絡資訊</div><div class="formgrid"><div class="field wide"><label>電話（多筆以逗號分隔，僅預覽）</label><input id="fPhones" value="${esc((v.phones||[]).join(', '))}"></div><div class="field"><label>傳真</label><input id="fFax" value="${esc(v.fax||'')}"></div></div></div><div class="card wide warn"><div class="cardtitle">重要備註</div><div class="field"><label>備註（每行一筆，僅預覽）</label><textarea id="fNotes">${esc((v.notes||[]).join('\n'))}</textarea></div></div></div>`}
function renderDetail(){const c=customers.find(x=>x.id===selected);$('#detail').innerHTML=editing?form(creating?null:c):view(c);if(editing){$('#fCat').value=(creating?'中醫診所':c.cat);$('#fStatus').value=(creating?'潛在客戶':c.status);$('#cancelBtn').onclick=()=>{if(confirm('取消目前未儲存的變更？')){editing=false;creating=false;render()}};$('#saveBtn').onclick=save}else{$('#editBtn').onclick=()=>{editing=true;creating=false;renderDetail()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderDetail()})}}
function save(){const short=$('#fShort').value.trim();if(!short){alert('客戶簡稱為必填');return}const tax=$('#fTax').value.trim();if(tax&&!/^\d{8}$/.test(tax)){alert('統一編號需為 8 碼數字');return}const no=$('#fNo').value.trim()||null;const dupNo=no&&customers.some(x=>x.id!==selected&&x.no===no);if(dupNo){alert('客戶編號不可重複');return}if(tax&&customers.some(x=>x.id!==selected&&x.tax===tax)&&!confirm('已有其他客戶使用相同統一編號。仍要繼續儲存嗎？'))return;const data={no,short,full:$('#fFull').value.trim()||short,tax:tax||null,cat:$('#fCat').value,region:$('#fRegion').value.trim(),owner:$('#fOwner').value.trim(),dept:$('#fDept').value.trim(),status:$('#fStatus').value,phones:$('#fPhones').value.split(',').map(x=>x.trim()).filter(Boolean),fax:$('#fFax').value.trim()||null,notes:$('#fNotes').value.split('\n').map(x=>x.trim()).filter(Boolean),updated:'剛剛（靜態預覽）'};if(creating){const id=Math.max(...customers.map(x=>x.id))+1;customers=[{id,contacts:[],addresses:[],...data},...customers];selected=id}else{customers=customers.map(x=>x.id===selected?{...x,...data}:x)}editing=false;creating=false;showToast();render()}
function showToast(){const t=$('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
function render(){renderRows();renderDetail()}
$('#search').addEventListener('input',renderRows);$('#newBtn').onclick=()=>{if(editing&&!confirm('尚有未儲存變更，確定新增其他客戶？'))return;editing=true;creating=true;renderDetail()};render();
</script>
</body>
</html>
