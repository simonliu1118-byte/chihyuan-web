<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CY Web - 代工完整功能預覽</title>
<style>
:root{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#17232d;background:#f3f6f8;font-size:15px;--red:#8d2132;--line:#d8e0e6;--muted:#667987;--card:#fff;--soft:#f8fafb;--green:#e7f5ec;--blue:#eaf3fb;--amber:#fff3d4;--gray:#edf1f3}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:9px;align-items:center;margin-bottom:25px}.logo{width:35px;height:42px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.5}.nav h4{font-size:12px;color:#748391;margin:18px 8px 7px}.nav div{padding:10px;border-radius:9px;color:#53626f}.nav .active{background:#f5e8eb;color:var(--red);font-weight:800}.main{min-width:0}.top{height:50px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.badge{background:#e9f2f8;color:#36617a;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.content{padding:18px 24px 40px;max-width:1650px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.pagehead h1{font-size:27px;margin:0 0 4px}.pagehead p{margin:0;color:var(--muted);font-size:14px}.notice{margin:14px 0;background:#eaf3fb;border:1px solid #cadfeb;border-radius:10px;padding:10px 13px;color:#36596f}.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font:inherit;font-weight:750;cursor:pointer}.tab.active{background:var(--red);color:#fff;border-color:var(--red)}.btn{border:1px solid #cbd5dd;background:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-weight:750;cursor:pointer}.btn:hover{background:#f8fafb}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.warn{background:#fff4db;border-color:#e5c76e}.btn.danger{color:#a11f32;border-color:#e2b5bd}.btn.success{background:#e7f5ec;border-color:#bcdcc8;color:#1f6439}.btn:disabled{opacity:.4;cursor:not-allowed}.workspace{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 15px rgba(25,38,48,.045);overflow:hidden}.left{position:sticky;top:66px}.cardhead{padding:14px;border-bottom:1px solid var(--line)}.cardhead h2{font-size:17px;margin:2px 0 10px}.eyebrow{color:#738490;font-size:12px}.search{width:100%;border:1px solid #cbd5dd;border-radius:7px;padding:9px 10px;font:inherit;font-size:15px}.list{max-height:67vh;overflow:auto}.row{padding:12px 14px;border-bottom:1px solid #e5eaee;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.row:hover{background:#fafcfd}.row.active{background:#f7e9ec;border-left:3px solid var(--red);padding-left:11px}.row b{font-size:15px}.sub{font-size:13px;color:#6b7d89;margin-top:3px}.status{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;white-space:nowrap}.s-pending_outbound{background:#eef1f3}.s-outbound{background:#fff0ce;color:#7a5707}.s-received{background:#e8f3ff;color:#245b8e}.s-priced{background:#f0eafd;color:#6042a0}.s-paid{background:#e6f5ec;color:#22663b}.s-voided{background:#f4e7e9;color:#862738}.detailhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.detailhead h2{font-size:23px;margin:0 0 5px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.body{padding:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.section h3{font-size:16px;margin:0 0 12px}.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}.kv span{display:block;font-size:13px;color:#6b7d89;margin-bottom:3px}.kv strong{font-size:15px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #e4e9ed;padding:9px 8px;white-space:nowrap}.table th{font-size:13px;color:#687986;background:#fafbfc}.table td{font-size:14px}.money{text-align:right!important}.editor{padding:14px}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:750;color:#526472;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5dd;border-radius:7px;padding:9px 10px;font:inherit;font-size:15px;background:#fff}.field.w2{grid-column:span 2}.field.w4{grid-column:1/-1}.editactions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}.line{display:grid;grid-template-columns:160px minmax(180px,1fr) 110px 100px 55px;gap:7px;align-items:center;padding:8px;border-bottom:1px solid #e5eaee}.line.head{background:#f8fafb;font-size:13px;font-weight:800}.timeline{display:grid;gap:7px}.event{border-left:3px solid #c8d6df;padding:5px 10px}.event b{font-size:14px}.event small{display:block;color:#73838f;margin-top:3px}.stockgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stockcard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}.stockcard strong{font-size:18px}.stockcard span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.empty{padding:30px;text-align:center;color:#798894}.modalback{position:fixed;inset:0;background:rgba(20,31,39,.36);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal{background:#fff;border-radius:14px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal h3{font-size:20px;margin:0 0 8px}.modal p{color:var(--muted);font-size:14px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:22px;bottom:22px;background:#21323e;color:#fff;border-radius:9px;padding:11px 14px;opacity:0;transform:translateY(8px);transition:.2s;z-index:200}.toast.show{opacity:1;transform:none}.hidden{display:none!important}.dangertext{color:#a11f32}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{display:none}.workspace{grid-template-columns:1fr}.left{position:static}.grid2,.stockgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.content{padding:12px}.top{padding:0 12px}.pagehead h1{font-size:23px}.detailhead{display:block}.actions{justify-content:flex-start;margin-top:10px}.kv,.formgrid{grid-template-columns:1fr}.field.w2,.field.w4{grid-column:auto}.line{min-width:720px}.stockgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">CY</div><div><b>CY Web</b><small>Chihyuan Enterprise<br>Management System</small></div></div><div class="nav"><h4>業務</h4><div>客戶</div><div>商品</div><div>銷售工單</div><div class="active">委外</div><div>工作日誌</div><h4>管理</h4><div>設定</div><div>稽核紀錄</div></div></aside>
<main class="main"><div class="top"><b>委外／代工</b><span class="badge">Full Preview 0.1.32</span></div><div class="content">
<div class="pagehead"><div><h1>委外／代工管理</h1><p>功能整合預覽：代工對象、BOM、出庫、入庫、計價、付款與庫存流水。</p></div><button class="btn primary" id="pagePrimary" onclick="pagePrimary()">新增代工單</button></div>
<div class="notice"><b>預覽環境：</b>全部為瀏覽器記憶體假資料；重新整理即還原。不連 D1、不繞過 Identity。這版以功能流程正確為優先，UI 細修後續集中處理。</div>
<div class="tabs"><button class="tab active" data-tab="orders" onclick="switchTab('orders')">代工工單</button><button class="tab" data-tab="contractors" onclick="switchTab('contractors')">代工對象／單價</button><button class="tab" data-tab="boms" onclick="switchTab('boms')">BOM 配方</button><button class="tab" data-tab="stock" onclick="switchTab('stock')">代工庫存</button></div>
<div id="view"></div>
</div></main></div>
<div class="modalback" id="modal"><div class="modal" id="modalBody"></div></div><div class="toast" id="toast"></div>
<script>
const statusText={pending_outbound:'待出庫',outbound:'已出庫',received:'已入庫',priced:'已計價',paid:'已付款',voided:'已作廢'};
const items=[
{id:1,no:'FIN-A',name:'拔罐杯成品',spec:'標準型',base:'個',units:['個','箱'],factor:{個:1,箱:20}},
{id:2,no:'PART-A',name:'拔罐杯身',spec:'透明',base:'個',units:['個','包'],factor:{個:1,包:10}},
{id:3,no:'PART-B',name:'矽膠閥',spec:'紅色',base:'個',units:['個','包'],factor:{個:1,包:50}},
{id:4,no:'FIN-B',name:'針盒組',spec:'10盒/組',base:'組',units:['組','箱'],factor:{組:1,箱:12}},
{id:5,no:'PART-C',name:'外盒彩盒',spec:'單入',base:'個',units:['個','綑'],factor:{個:1,綑:100}}
];
let contractors=[
{id:1,type:'person',name:'王先生代工',legal:'',phone:'07-555-0201',active:true,pricing:{1:{unit:'個',price:12.5},4:{unit:'組',price:8}},contacts:[{name:'王先生',phone:'09xx-111-222'}]},
{id:2,type:'organization',name:'南方加工社',legal:'南方加工社',phone:'06-222-7788',active:true,pricing:{1:{unit:'箱',price:220}},contacts:[{name:'林小姐',phone:'09xx-333-555'}]}
];
let boms=[
{id:1,ref:'BOM-A1',fin:1,outQty:1,outUnit:'個',active:true,components:[{item:2,qty:1,unit:'個'},{item:3,qty:1,unit:'個'}]},
{id:2,ref:'BOM-A2',fin:1,outQty:1,outUnit:'個',active:true,components:[{item:2,qty:1,unit:'個'},{item:3,qty:2,unit:'個'}]},
{id:3,ref:'BOM-B1',fin:4,outQty:1,outUnit:'組',active:true,components:[{item:5,qty:1,unit:'個'}]}
];
let movements=[];let seqMove=1,seqOrder=4;let orders=[
{id:1,ref:'PREVIEW-OUT-001',status:'pending_outbound',contractor:1,operator:'王OO',orderDate:'2026-09-27',outDate:null,paidAt:null,voidedAt:null,revision:1,parts:[{fin:1,bom:1,item:2,qty:100,unit:'個',note:''},{fin:1,bom:1,item:3,qty:100,unit:'個',note:''}],receipt:null,pricing:null,history:[]},
{id:2,ref:'PREVIEW-OUT-002',status:'outbound',contractor:1,operator:'陳OO',orderDate:'2026-09-26',outDate:'2026-09-26',paidAt:null,voidedAt:null,revision:2,parts:[{fin:1,bom:1,item:2,qty:200,unit:'個',note:''},{fin:1,bom:1,item:3,qty:200,unit:'個',note:''}],receipt:null,pricing:null,history:[{text:'確認出庫',at:'2026-09-26 11:20'}]},
{id:3,ref:'PREVIEW-OUT-003',status:'received',contractor:1,operator:'王OO',orderDate:'2026-09-24',outDate:'2026-09-24',paidAt:null,voidedAt:null,revision:3,parts:[{fin:1,bom:1,item:2,qty:150,unit:'個',note:''},{fin:1,bom:1,item:3,qty:150,unit:'個',note:''}],receipt:{date:'2026-09-25',operator:'王OO',items:[{item:1,bom:1,qty:50,unit:'個',note:''}]},pricing:null,history:[{text:'確認出庫',at:'2026-09-24 09:30'},{text:'完成入庫',at:'2026-09-25 16:00'}]}
];
function seedMovements(){addMove(1,2,200,'outbound_supply',2,null);addMove(1,3,200,'outbound_supply',2,null);addMove(1,2,150,'outbound_supply',3,null);addMove(1,3,150,'outbound_supply',3,null);addMove(1,2,-50,'receipt_consumption',3,null);addMove(1,3,-50,'receipt_consumption',3,null)}seedMovements();
let currentTab='orders',selectedOrder=1,selectedContractor=1,selectedBom=1,editingOrder=false,draftOrder=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1900)}
function now(){return new Date().toLocaleString('zh-TW',{hour12:false}).replaceAll('/','-')}
function item(id){return items.find(x=>x.id===id)}function contractor(id){return contractors.find(x=>x.id===id)}function bom(id){return boms.find(x=>x.id===id)}function order(id){return orders.find(x=>x.id===id)}
function toBase(itemId,qty,unit){const i=item(itemId);if(!i||!i.factor[unit])throw Error('單位換算不存在');return qty*i.factor[unit]}
function convert(itemId,qty,from,to){const i=item(itemId);if(!i||!i.factor[from]||!i.factor[to])throw Error('單位換算不存在');return qty*i.factor[from]/i.factor[to]}
function addMove(contractorId,itemId,qty,type,orderId,reversalOf,fin=null){movements.push({id:seqMove++,contractor:contractorId,item:itemId,qty,type,order:orderId,reversalOf,fin,at:now()})}
function activeMoves(orderId,type){return movements.filter(m=>m.order===orderId&&m.type===type&&!movements.some(r=>r.reversalOf===m.id))}
function reverseMoves(rows,reason){rows.forEach(m=>addMove(m.contractor,m.item,-m.qty,'reversal',m.order,m.id,m.fin));if(reason)toast(reason)}
function balance(contractorId,itemId){return movements.filter(m=>m.contractor===contractorId&&m.item===itemId).reduce((s,m)=>s+m.qty,0)}
function statusTag(s){return `<span class="status s-${s}">${statusText[s]}</span>`}
function switchTab(t){if(editingOrder&&!confirm('目前工單有尚未儲存修改，確定放棄？'))return;editingOrder=false;draftOrder=null;currentTab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));document.getElementById('pagePrimary').textContent=t==='orders'?'新增代工單':t==='contractors'?'新增代工對象':t==='boms'?'新增 BOM':'重新整理';render()}
function pagePrimary(){if(currentTab==='orders')startNewOrder();else if(currentTab==='contractors')editContractor(null);else if(currentTab==='boms')editBom(null);else render()}
function render(){if(currentTab==='orders')renderOrders();else if(currentTab==='contractors')renderContractors();else if(currentTab==='boms')renderBoms();else renderStock()}
function renderOrders(){document.getElementById('view').innerHTML=`<div class="workspace"><section class="card left"><div class="cardhead"><div class="eyebrow">代工工單</div><h2>搜尋與選擇工單</h2><input class="search" id="orderSearch" placeholder="工單編號、代工對象、料件…" oninput="renderOrderList()"><div style="margin-top:8px"><select class="search" id="orderStatus" onchange="renderOrderList()"><option value="">全部狀態</option>${Object.entries(statusText).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><div class="list" id="orderList"></div></section><section class="card" id="orderDetail"></section></div>`;renderOrderList();renderOrderDetail()}
function renderOrderList(){const q=(document.getElementById('orderSearch')?.value||'').trim().toLowerCase(),sf=document.getElementById('orderStatus')?.value||'';const rows=orders.filter(o=>(!sf||o.status===sf)&&(!q||[o.ref,contractor(o.contractor)?.name,...o.parts.flatMap(p=>[item(p.item)?.no,item(p.item)?.name])].some(v=>(v||'').toLowerCase().includes(q))));document.getElementById('orderList').innerHTML=rows.map(o=>`<div class="row ${o.id===selectedOrder?'active':''}" onclick="selectOrder(${o.id})"><div><b>${esc(o.ref)}</b><div class="sub">${esc(contractor(o.contractor)?.name)} · ${o.parts.length} 筆料件</div></div><div>${statusTag(o.status)}<div class="sub">${o.orderDate}</div></div></div>`).join('')||'<div class="empty">無符合工單</div>'}
function selectOrder(id){if(editingOrder&&!confirm('放棄目前修改？'))return;editingOrder=false;draftOrder=null;selectedOrder=id;renderOrderList();renderOrderDetail()}
function renderOrderDetail(){const root=document.getElementById('orderDetail');if(editingOrder){renderOrderEditor(root);return}const o=order(selectedOrder);if(!o){root.innerHTML='<div class="empty">請選擇工單</div>';return}let acts=[];if(o.status==='pending_outbound')acts=[`<button class="btn" onclick="editCurrentOrder()">修改</button>`,`<button class="btn success" onclick="confirmOutbound()">確認出庫</button>`,`<button class="btn danger" onclick="deletePending()">刪除</button>`];if(o.status==='outbound')acts=[`<button class="btn warn" onclick="correctOutbound()">更正出庫</button>`,`<button class="btn success" onclick="openReceipt()">入庫</button>`,`<button class="btn danger" onclick="cancelOutbound()">取消出庫</button>`];if(o.status==='received')acts=[`<button class="btn primary" onclick="priceOrder()">計價</button>`,`<button class="btn danger" onclick="cancelReceipt()">取消入庫</button>`];if(o.status==='priced')acts=[`<button class="btn success" onclick="payOrder()">付款</button>`,`<button class="btn danger" onclick="cancelPricing()">取消計價</button>`];if(o.status==='paid')acts=[`<button class="btn danger" onclick="cancelPayment()">取消付款</button>`];root.innerHTML=`<div class="detailhead"><div><h2>${esc(o.ref)} ${statusTag(o.status)}</h2><div class="sub">${esc(contractor(o.contractor)?.name)} · rev.${o.revision}</div></div><div class="actions">${acts.join('')}</div></div><div class="body"><div class="grid2"><div class="section"><h3>工單資料</h3><div class="kv"><div><span>建檔日期</span><strong>${o.orderDate}</strong></div><div><span>操作人</span><strong>${o.operator}</strong></div><div><span>出庫日期</span><strong>${o.outDate||'—'}</strong></div><div><span>狀態</span><strong>${statusText[o.status]}</strong></div></div></div><div class="section"><h3>庫存原則</h3><div class="sub">待出庫只代表計畫量；確認出庫後才產生 contractor stock movement。庫存顯示皆由 movement 加總。</div></div></div><div class="section"><h3>出庫料件</h3><div class="tablewrap"><table class="table"><thead><tr><th>成品脈絡</th><th>料件</th><th>數量</th><th>單位</th><th>目前代工庫存</th></tr></thead><tbody>${o.parts.map(p=>`<tr><td>${p.fin?esc(item(p.fin)?.name):'—'}</td><td><b>${esc(item(p.item)?.no)}</b> ${esc(item(p.item)?.name)}</td><td>${p.qty}</td><td>${p.unit}</td><td>${balance(o.contractor,p.item)} ${item(p.item)?.base}</td></tr>`).join('')}</tbody></table></div></div>${renderReceiptSection(o)}${renderPricingSection(o)}<div class="section"><h3>流程／重要操作</h3><div class="timeline">${o.history.length?o.history.slice().reverse().map(h=>`<div class="event"><b>${esc(h.text)}</b><small>${esc(h.at)}</small></div>`).join(''):'<div class="sub">尚無重要操作紀錄。</div>'}</div></div></div>`}
function renderReceiptSection(o){if(!o.receipt)return'';return`<div class="section"><h3>入庫資料</h3><div class="sub" style="margin-bottom:8px">${o.receipt.date} · ${o.receipt.operator}</div><div class="tablewrap"><table class="table"><thead><tr><th>成品</th><th>BOM</th><th>數量</th><th>單位</th></tr></thead><tbody>${o.receipt.items.map(r=>`<tr><td>${esc(item(r.item)?.no)} ${esc(item(r.item)?.name)}</td><td>${r.bom?esc(bom(r.bom)?.ref):'未套 BOM'}</td><td>${r.qty}</td><td>${r.unit}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderPricingSection(o){if(!o.pricing)return'';return`<div class="section"><h3>計價資料</h3><div class="sub" style="margin-bottom:8px">${o.pricing.date} · 總額 NT$ ${o.pricing.total.toFixed(2)}</div><div class="tablewrap"><table class="table"><thead><tr><th>成品</th><th>計價數量</th><th>計價單位</th><th class="money">單價</th><th class="money">小計</th></tr></thead><tbody>${o.pricing.items.map(p=>`<tr><td>${esc(item(p.item)?.name)}</td><td>${p.qty}</td><td>${p.unit}</td><td class="money">${p.price}</td><td class="money">${p.subtotal.toFixed(2)}</td></tr>`).join('')}</tbody></table></div></div>`}
function startNewOrder(){editingOrder=true;selectedOrder=null;draftOrder={id:null,contractor:1,operator:'王OO',orderDate:'2026-09-27',parts:[{fin:1,bom:1,item:2,qty:1,unit:'個',note:''}]};renderOrders()}
function editCurrentOrder(){const o=order(selectedOrder);if(!o||o.status!=='pending_outbound')return;editingOrder=true;draftOrder=JSON.parse(JSON.stringify(o));renderOrderDetail()}
function renderOrderEditor(root){const d=draftOrder;root.innerHTML=`<div class="detailhead"><div><h2>${d.id?'修改待出庫工單':'新增代工工單'}</h2><div class="sub">待出庫階段不影響實際庫存</div></div><div class="actions"><button class="btn" onclick="cancelOrderEdit()">取消</button><button class="btn primary" onclick="saveOrder()">儲存</button></div></div><div class="editor"><div class="formgrid"><div class="field w2"><label>代工對象</label><select id="fCont">${contractors.filter(c=>c.active||c.id===d.contractor).map(c=>`<option value="${c.id}" ${c.id===d.contractor?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>建檔日期</label><input id="fDate" type="date" value="${d.orderDate}"></div><div class="field"><label>操作人</label><select id="fOp"><option ${d.operator==='王OO'?'selected':''}>王OO</option><option ${d.operator==='陳OO'?'selected':''}>陳OO</option></select></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><h3>出庫料件</h3><button class="btn" onclick="addPart()">＋ 增加料件</button></div><div style="overflow:auto;border:1px solid var(--line);border-radius:10px"><div class="line head"><div>成品脈絡</div><div>料件</div><div>數量</div><div>單位</div><div></div></div><div id="partRows"></div></div><div class="editactions"><button class="btn" onclick="cancelOrderEdit()">取消</button><button class="btn primary" onclick="saveOrder()">儲存</button></div></div>`;renderPartRows()}
function renderPartRows(){document.getElementById('partRows').innerHTML=draftOrder.parts.map((p,idx)=>{const it=item(p.item);return`<div class="line"><select onchange="draftOrder.parts[${idx}].fin=Number(this.value)||null"><option value="">無</option>${items.filter(x=>x.no.startsWith('FIN')).map(x=>`<option value="${x.id}" ${x.id===p.fin?'selected':''}>${x.no}</option>`).join('')}</select><select onchange="changePartItem(${idx},this.value)">${items.filter(x=>x.no.startsWith('PART')).map(x=>`<option value="${x.id}" ${x.id===p.item?'selected':''}>${x.no} · ${x.name}</option>`).join('')}</select><input class="search" value="${p.qty}" inputmode="decimal" oninput="draftOrder.parts[${idx}].qty=Number(this.value)"><select onchange="draftOrder.parts[${idx}].unit=this.value">${it.units.map(u=>`<option ${u===p.unit?'selected':''}>${u}</option>`).join('')}</select><button class="btn danger" onclick="removePart(${idx})">×</button></div>`}).join('')}
function changePartItem(idx,val){const i=item(Number(val));draftOrder.parts[idx].item=i.id;draftOrder.parts[idx].unit=i.base;renderPartRows()}function addPart(){draftOrder.parts.push({fin:null,bom:null,item:2,qty:1,unit:'個',note:''});renderPartRows()}function removePart(i){if(draftOrder.parts.length===1)return toast('至少需要 1 筆料件');draftOrder.parts.splice(i,1);renderPartRows()}
function cancelOrderEdit(){editingOrder=false;draftOrder=null;if(selectedOrder==null)selectedOrder=orders[0]?.id??null;renderOrders()}
function saveOrder(){draftOrder.contractor=Number(document.getElementById('fCont').value);draftOrder.orderDate=document.getElementById('fDate').value;draftOrder.operator=document.getElementById('fOp').value;if(!draftOrder.orderDate)return toast('建檔日期必填');if(draftOrder.parts.some(p=>!p.qty||p.qty<=0))return toast('料件數量必須大於 0');if(draftOrder.id){const o=order(draftOrder.id);Object.assign(o,{contractor:draftOrder.contractor,operator:draftOrder.operator,orderDate:draftOrder.orderDate,parts:JSON.parse(JSON.stringify(draftOrder.parts)),revision:o.revision+1})}else{const id=Math.max(0,...orders.map(o=>o.id))+1;orders.unshift({id,ref:`PREVIEW-OUT-${String(seqOrder++).padStart(3,'0')}`,status:'pending_outbound',contractor:draftOrder.contractor,operator:draftOrder.operator,orderDate:draftOrder.orderDate,outDate:null,paidAt:null,voidedAt:null,revision:1,parts:JSON.parse(JSON.stringify(draftOrder.parts)),receipt:null,pricing:null,history:[]});selectedOrder=id}editingOrder=false;draftOrder=null;toast('工單已儲存（預覽記憶體）');renderOrders()}
function confirmOutbound(){const o=order(selectedOrder);if(!o||o.status!=='pending_outbound')return;const date=prompt('實際出庫日期',new Date().toISOString().slice(0,10));if(!date)return;o.parts.forEach(p=>addMove(o.contractor,p.item,toBase(p.item,p.qty,p.unit),'outbound_supply',o.id,null,p.fin));o.status='outbound';o.outDate=date;o.revision++;o.history.push({text:'確認出庫：建立實際庫存 movement',at:now()});toast('已確認出庫');renderOrders()}
function correctOutbound(){const o=order(selectedOrder);if(!o||o.status!=='outbound')return;const reason=prompt('更正原因（選填）','數量輸入修正')||'';const factor=Number(prompt('示範：將目前各料件數量乘上倍率', '1'));if(!Number.isFinite(factor)||factor<=0)return toast('倍率格式錯誤');reverseMoves(activeMoves(o.id,'outbound_supply'));o.parts.forEach(p=>p.qty=Number((p.qty*factor).toFixed(4)));o.parts.forEach(p=>addMove(o.contractor,p.item,toBase(p.item,p.qty,p.unit),'outbound_supply',o.id,null,p.fin));o.revision++;o.history.push({text:`更正出庫${reason?'：'+reason:''}`,at:now()});toast('已用 reversal + replacement movement 完成更正');renderOrders()}
function cancelOutbound(){const o=order(selectedOrder);if(!o||o.status!=='outbound')return;if(!confirm('取消出庫後工單將作廢，確定？'))return;reverseMoves(activeMoves(o.id,'outbound_supply'));o.status='voided';o.voidedAt=now();o.revision++;o.history.push({text:'取消出庫／作廢工單',at:now()});renderOrders()}
function deletePending(){const o=order(selectedOrder);if(!o||o.status!=='pending_outbound'||!confirm('確定刪除此待出庫工單？'))return;orders=orders.filter(x=>x.id!==o.id);selectedOrder=orders[0]?.id??null;toast('待出庫工單已刪除');renderOrders()}
function openReceipt(){const o=order(selectedOrder);if(!o||o.status!=='outbound')return;document.getElementById('modalBody').innerHTML=`<h3>完成入庫</h3><p>成品有多套 BOM 時必須明確選擇。本示範可測 BOM-A1 / BOM-A2 對耗料的差異。</p><div class="formgrid"><div class="field w2"><label>入庫成品</label><select id="rItem" onchange="refreshBomOptions()">${items.filter(x=>x.no.startsWith('FIN')).map(x=>`<option value="${x.id}">${x.no} · ${x.name}</option>`).join('')}</select></div><div class="field"><label>數量</label><input id="rQty" value="10" inputmode="decimal"></div><div class="field"><label>單位</label><select id="rUnit"></select></div><div class="field w2"><label>實際 BOM</label><select id="rBom"></select></div><div class="field"><label>入庫日期</label><input id="rDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="modalactions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="applyReceipt()">確認入庫</button></div>`;refreshBomOptions();openModal()}
function refreshBomOptions(){const iid=Number(document.getElementById('rItem').value),it=item(iid),bs=boms.filter(b=>b.fin===iid&&b.active);document.getElementById('rUnit').innerHTML=it.units.map(u=>`<option>${u}</option>`).join('');document.getElementById('rBom').innerHTML=bs.length?bs.map(b=>`<option value="${b.id}">${b.ref} · ${b.components.map(c=>item(c.item).no+'×'+c.qty).join(' / ')}</option>`).join(''):'<option value="">無 BOM</option>'}
function applyReceipt(){const o=order(selectedOrder),iid=Number(document.getElementById('rItem').value),qty=Number(document.getElementById('rQty').value),unit=document.getElementById('rUnit').value,bid=Number(document.getElementById('rBom').value)||null,date=document.getElementById('rDate').value;if(!o||qty<=0||!date)return toast('請完成入庫資料');const b=bid?bom(bid):null;if(b){const outQty=convert(iid,qty,unit,b.outUnit);b.components.forEach(c=>{const consumed=outQty*c.qty/b.outQty;addMove(o.contractor,c.item,-toBase(c.item,consumed,c.unit),'receipt_consumption',o.id,null,iid)})}o.receipt={date,operator:'王OO',items:[{item:iid,bom:bid,qty,unit,note:''}]};o.status='received';o.revision++;o.history.push({text:`完成入庫：${item(iid).name} ${qty}${unit}${b?' / '+b.ref:''}`,at:now()});closeModal();toast('入庫完成');renderOrders()}
function cancelReceipt(){const o=order(selectedOrder);if(!o||o.status!=='received'||!confirm('取消入庫並退回已出庫？'))return;reverseMoves(activeMoves(o.id,'receipt_consumption'));o.receipt=null;o.status='outbound';o.revision++;o.history.push({text:'取消入庫：耗料 movement 已沖回',at:now()});renderOrders()}
function priceOrder(){const o=order(selectedOrder);if(!o||o.status!=='received'||!o.receipt)return;const c=contractor(o.contractor);let rows=[],total=0;for(const r of o.receipt.items){const p=c.pricing[r.item];if(!p)return toast(`${item(r.item).name} 尚未設定代工單價`);const q=convert(r.item,r.qty,r.unit,p.unit),sub=q*p.price;rows.push({item:r.item,qty:q,unit:p.unit,price:p.price,subtotal:sub});total+=sub}o.pricing={date:new Date().toISOString().slice(0,10),items:rows,total};o.status='priced';o.revision++;o.history.push({text:`完成計價：NT$ ${total.toFixed(2)}`,at:now()});toast('計價完成');renderOrders()}
function cancelPricing(){const o=order(selectedOrder);if(!o||o.status!=='priced'||!confirm('取消計價並退回已入庫？'))return;o.pricing=null;o.status='received';o.revision++;o.history.push({text:'取消計價',at:now()});renderOrders()}
function payOrder(){const o=order(selectedOrder);if(!o||o.status!=='priced')return;o.status='paid';o.paidAt=now();o.revision++;o.history.push({text:'確認付款',at:now()});renderOrders()}
function cancelPayment(){const o=order(selectedOrder);if(!o||o.status!=='paid'||!confirm('取消付款並退回已計價？'))return;o.status='priced';o.paidAt=null;o.revision++;o.history.push({text:'取消付款',at:now()});renderOrders()}
function renderContractors(){document.getElementById('view').innerHTML=`<div class="workspace"><section class="card left"><div class="cardhead"><div class="eyebrow">代工對象</div><h2>搜尋與選擇</h2><input id="contSearch" class="search" placeholder="名稱、電話…" oninput="renderContList()"></div><div class="list" id="contList"></div></section><section class="card" id="contDetail"></section></div>`;renderContList();renderContDetail()}
function renderContList(){const q=(document.getElementById('contSearch')?.value||'').toLowerCase();document.getElementById('contList').innerHTML=contractors.filter(c=>!q||[c.name,c.phone,c.legal].some(v=>(v||'').toLowerCase().includes(q))).map(c=>`<div class="row ${c.id===selectedContractor?'active':''}" onclick="selectedContractor=${c.id};renderContractors()"><div><b>${esc(c.name)}</b><div class="sub">${c.type==='person'?'個人':'公司'} · ${esc(c.phone)}</div></div><div>${c.active?'<span class="status s-paid">使用中</span>':'<span class="status s-voided">已停用</span>'}</div></div>`).join('')}
function renderContDetail(){const c=contractor(selectedContractor),root=document.getElementById('contDetail');if(!c){root.innerHTML='<div class="empty">請選擇代工對象</div>';return}root.innerHTML=`<div class="detailhead"><div><h2>${esc(c.name)}</h2><div class="sub">${c.type==='person'?'個人':'公司'} · ${esc(c.phone)}</div></div><div class="actions"><button class="btn" onclick="editContractor(${c.id})">修改</button><button class="btn ${c.active?'danger':'success'}" onclick="toggleContractor(${c.id})">${c.active?'停用':'啟用'}</button></div></div><div class="body"><div class="section"><h3>聯絡人</h3>${c.contacts.map(x=>`<div style="padding:7px 0;border-bottom:1px solid #eee"><b>${esc(x.name)}</b>　${esc(x.phone)}</div>`).join('')||'<div class="sub">尚無聯絡人</div>'}</div><div class="section"><h3>現行代工單價</h3><div class="tablewrap"><table class="table"><thead><tr><th>商品</th><th>計價單位</th><th class="money">單價</th><th></th></tr></thead><tbody>${Object.entries(c.pricing).map(([id,p])=>`<tr><td>${esc(item(Number(id))?.no)} ${esc(item(Number(id))?.name)}</td><td>${p.unit}</td><td class="money">${p.price}</td><td><button class="btn" onclick="setPrice(${c.id},${id})">修改</button></td></tr>`).join('')}</tbody></table></div><button class="btn" style="margin-top:10px" onclick="setPrice(${c.id},null)">＋ 設定商品單價</button></div></div>`}
function editContractor(id){const c=id?contractor(id):null;const name=prompt(c?'修改名稱':'新增代工對象名稱',c?.name||'');if(!name)return;if(c){c.name=name;toast('代工對象已修改')}else{const nid=Math.max(0,...contractors.map(x=>x.id))+1;contractors.push({id:nid,type:'person',name,legal:'',phone:'',active:true,pricing:{},contacts:[]});selectedContractor=nid;toast('代工對象已新增')}renderContractors()}
function toggleContractor(id){const c=contractor(id);c.active=!c.active;toast(c.active?'已啟用':'已停用；既有歷史仍保留');renderContractors()}
function setPrice(cid,iid){const c=contractor(cid);let target=iid?item(Number(iid)):null;if(!target){const no=prompt('輸入商品品號（FIN-A / FIN-B）','FIN-A');target=items.find(i=>i.no===no);if(!target)return toast('找不到商品')}const unit=prompt(`計價單位，可用：${target.units.join(' / ')}`,c.pricing[target.id]?.unit||target.base);if(!target.units.includes(unit))return toast('計價單位無效');const price=Number(prompt('單價',String(c.pricing[target.id]?.price??0)));if(!Number.isFinite(price)||price<0)return toast('單價格式錯誤');c.pricing[target.id]={unit,price};toast('現行單價已更新；正式版會記錄 before/after Audit');renderContractors()}
function renderBoms(){document.getElementById('view').innerHTML=`<div class="workspace"><section class="card left"><div class="cardhead"><div class="eyebrow">BOM</div><h2>配方版本</h2><input id="bomSearch" class="search" placeholder="BOM編號、成品…" oninput="renderBomList()"></div><div class="list" id="bomList"></div></section><section class="card" id="bomDetail"></section></div>`;renderBomList();renderBomDetail()}
function renderBomList(){const q=(document.getElementById('bomSearch')?.value||'').toLowerCase();document.getElementById('bomList').innerHTML=boms.filter(b=>!q||[b.ref,item(b.fin)?.no,item(b.fin)?.name].some(v=>(v||'').toLowerCase().includes(q))).map(b=>`<div class="row ${b.id===selectedBom?'active':''}" onclick="selectedBom=${b.id};renderBoms()"><div><b>${b.ref}</b><div class="sub">${esc(item(b.fin)?.name)}</div></div><div>${b.active?'<span class="status s-paid">啟用</span>':'<span class="status s-voided">停用</span>'}</div></div>`).join('')}
function renderBomDetail(){const b=bom(selectedBom),root=document.getElementById('bomDetail');if(!b){root.innerHTML='<div class="empty">請選擇 BOM</div>';return}root.innerHTML=`<div class="detailhead"><div><h2>${b.ref}</h2><div class="sub">${item(b.fin).no} · ${item(b.fin).name}</div></div><div class="actions"><button class="btn" onclick="editBom(${b.id})">修改</button></div></div><div class="body"><div class="section"><h3>產出</h3><b>${b.outQty} ${b.outUnit}</b></div><div class="section"><h3>料件組成</h3><table class="table"><thead><tr><th>料件</th><th>數量</th><th>單位</th></tr></thead><tbody>${b.components.map(c=>`<tr><td>${item(c.item).no} ${item(c.item).name}</td><td>${c.qty}</td><td>${c.unit}</td></tr>`).join('')}</tbody></table></div><div class="section"><h3>多 BOM 規則</h3><div class="sub">同一成品可以同時存在多套 BOM；入庫時如果超過一套，必須選擇實際使用哪一套。</div></div></div>`}
function editBom(id){const current=id?bom(id):null;const ref=prompt('BOM 顯示編號',current?.ref||`BOM-${Date.now().toString().slice(-4)}`);if(!ref)return;const finNo=prompt('成品品號',current?item(current.fin).no:'FIN-A');const fin=items.find(i=>i.no===finNo);if(!fin)return toast('找不到成品');const partNo=prompt('示範料件品號',current?item(current.components[0].item).no:'PART-A');const part=items.find(i=>i.no===partNo);if(!part)return toast('找不到料件');const qty=Number(prompt('每 1 個/組成品需要料件數量',String(current?.components[0].qty??1)));if(!qty||qty<=0)return toast('數量格式錯誤');if(current){Object.assign(current,{ref,fin:fin.id,components:[{item:part.id,qty,unit:part.base}]})}else{const nid=Math.max(0,...boms.map(x=>x.id))+1;boms.push({id:nid,ref,fin:fin.id,outQty:1,outUnit:fin.base,active:true,components:[{item:part.id,qty,unit:part.base}]});selectedBom=nid}toast('BOM 已儲存');renderBoms()}
function renderStock(){const cards=[];contractors.forEach(c=>items.filter(i=>i.no.startsWith('PART')).forEach(i=>{const q=balance(c.id,i.id);if(q!==0)cards.push(`<div class="stockcard"><b>${esc(c.name)}</b><strong>${q} ${i.base}</strong><span>${i.no} · ${i.name}</span></div>`)}));document.getElementById('view').innerHTML=`<div class="section" style="background:#fff"><h3>目前代工庫存（Movement 加總）</h3><div class="stockgrid">${cards.join('')||'<div class="empty">目前沒有非零庫存</div>'}</div></div><div class="section" style="background:#fff"><h3>庫存流水</h3><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>代工對象</th><th>商品</th><th>類型</th><th>數量變動</th><th>關聯工單</th><th>沖回來源</th></tr></thead><tbody>${movements.slice().reverse().map(m=>`<tr><td>${m.id}</td><td>${esc(contractor(m.contractor)?.name)}</td><td>${esc(item(m.item)?.no)} ${esc(item(m.item)?.name)}</td><td>${m.type}</td><td>${m.qty>0?'+':''}${m.qty} ${item(m.item)?.base}</td><td>${order(m.order)?.ref||'—'}</td><td>${m.reversalOf||'—'}</td></tr>`).join('')}</tbody></table></div></div>`}
function openModal(){document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}
render();
</script>
</body></html>
