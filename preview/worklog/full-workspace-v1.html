<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CY Web - 工作日誌完整功能預覽</title>
<style>
:root{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#17232d;background:#f3f6f8;font-size:15px;--red:#8d2132;--line:#d8e0e6;--muted:#667987;--card:#fff;--green:#e7f5ec;--blue:#eaf3fb;--amber:#fff3d4;--gray:#edf1f3}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:9px;align-items:center;margin-bottom:25px}.logo{width:35px;height:42px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.5}.nav h4{font-size:12px;color:#748391;margin:18px 8px 7px}.nav div{padding:10px;border-radius:9px;color:#53626f}.nav .active{background:#f5e8eb;color:var(--red);font-weight:800}.main{min-width:0}.top{height:50px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.badge{background:#e9f2f8;color:#36617a;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.content{padding:18px 24px 40px;max-width:1600px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.pagehead h1{font-size:27px;margin:0 0 4px}.pagehead p{margin:0;color:var(--muted);font-size:14px}.notice{margin:14px 0;background:#eaf3fb;border:1px solid #cadfeb;border-radius:10px;padding:10px 13px;color:#36596f}.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font:inherit;font-weight:750;cursor:pointer}.tab.active{background:var(--red);color:#fff;border-color:var(--red)}.btn{border:1px solid #cbd5dd;background:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-weight:750;cursor:pointer}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.success{background:#e7f5ec;border-color:#bcdcc8;color:#1f6439}.btn.warn{background:#fff4db;border-color:#e5c76e}.btn.danger{color:#a11f32;border-color:#e2b5bd}.btn:disabled{opacity:.4;cursor:not-allowed}.workspace{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 15px rgba(25,38,48,.045);overflow:hidden}.left{position:sticky;top:66px}.cardhead{padding:14px;border-bottom:1px solid var(--line)}.cardhead h2{font-size:17px;margin:2px 0 10px}.eyebrow{color:#738490;font-size:12px}.search,.field input,.field select,.field textarea,.entryrow input,.entryrow select,.reviewrow input{width:100%;border:1px solid #cbd5dd;border-radius:7px;padding:9px 10px;font:inherit;font-size:15px;background:#fff}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.list{max-height:67vh;overflow:auto}.row{padding:12px 14px;border-bottom:1px solid #e5eaee;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.row.active{background:#f7e9ec;border-left:3px solid var(--red);padding-left:11px}.row b{font-size:15px}.sub{font-size:13px;color:#6b7d89;margin-top:3px}.status{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;white-space:nowrap}.s-created{background:#eef1f3}.s-pending_review{background:#fff0ce;color:#7a5707}.s-reviewed{background:#e6f5ec;color:#22663b}.detailhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.detailhead h2{font-size:23px;margin:0 0 5px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.body,.editor{padding:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.section h3{font-size:16px;margin:0 0 12px}.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}.kv span{display:block;font-size:13px;color:#6b7d89;margin-bottom:3px}.kv strong{font-size:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #e4e9ed;padding:9px 8px}.table th{font-size:13px;color:#687986;background:#fafbfc}.table td{font-size:14px}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:750;color:#526472;margin-bottom:5px}.field.w2{grid-column:span 2}.field.w4{grid-column:1/-1}.entrybox{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}.entryrow{display:grid;grid-template-columns:130px minmax(180px,1fr) 150px 180px 55px;gap:7px;align-items:center;padding:8px;border-bottom:1px solid #e5eaee}.entryrow.head{background:#f8fafb;font-size:13px;font-weight:800}.editactions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}.reviewrow{display:grid;grid-template-columns:minmax(180px,1fr) 130px minmax(180px,1fr);gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid #e5eaee}.scorecard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:11px;padding:14px;background:#fff}.metric strong{display:block;font-size:22px}.metric span{font-size:13px;color:var(--muted)}.configgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.configcard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}.configcard b{display:block;margin-bottom:5px}.empty{padding:30px;text-align:center;color:#798894}.modalback{position:fixed;inset:0;background:rgba(20,31,39,.36);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal{background:#fff;border-radius:14px;width:min(780px,100%);max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal h3{font-size:20px;margin:0 0 8px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:22px;bottom:22px;background:#21323e;color:#fff;border-radius:9px;padding:11px 14px;opacity:0;transform:translateY(8px);transition:.2s;z-index:200}.toast.show{opacity:1;transform:none}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{display:none}.workspace{grid-template-columns:1fr}.left{position:static}.grid2,.scorecard,.configgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.content{padding:12px}.top{padding:0 12px}.pagehead h1{font-size:23px}.detailhead{display:block}.actions{justify-content:flex-start;margin-top:10px}.kv,.formgrid{grid-template-columns:1fr}.field.w2,.field.w4{grid-column:auto}.entryrow{min-width:760px}.reviewrow{grid-template-columns:1fr}}
</style>
</head><body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">CY</div><div><b>CY Web</b><small>Chihyuan Enterprise<br>Management System</small></div></div><div class="nav"><h4>業務</h4><div>客戶</div><div>商品</div><div>銷售工單</div><div>委外</div><div class="active">工作日誌</div><h4>管理</h4><div>設定</div><div>稽核紀錄</div></div></aside>
<main class="main"><div class="top"><b>工作日誌</b><span class="badge">Full Preview 0.1.34</span></div><div class="content"><div class="pagehead"><div><h1>工作日誌</h1><p>功能整合預覽：建檔、送審、撤回、審核計分、取消審核與歷史統計。</p></div><button class="btn primary" id="primary" onclick="startNew()">新增日誌</button></div><div class="notice"><b>預覽環境：</b>所有分類、平台與分數都是中性示範值，不是志遠正式設定。資料只存在瀏覽器記憶體，重新整理即還原；不連 D1、不繞過 Identity。</div><div class="tabs"><button class="tab active" data-tab="logs" onclick="switchTab('logs')">日誌</button><button class="tab" data-tab="review" onclick="switchTab('review')">待審核</button><button class="tab" data-tab="stats" onclick="switchTab('stats')">歷史統計</button><button class="tab" data-tab="config" onclick="switchTab('config')">設定參考</button></div><div id="view"></div></div></main></div>
<div class="modalback" id="modal"><div class="modal" id="modalBody"></div></div><div class="toast" id="toast"></div>
<script>
const users=[{id:1,name:'示範員工 A'},{id:2,name:'示範員工 B'}];
const categories=[{id:1,name:'示範勾選項目',mode:'boolean',unit:null,score:2},{id:2,name:'示範數量項目',mode:'quantity',unit:'件',score:1.5},{id:3,name:'示範其他項目',mode:'boolean',unit:null,score:3}];
const platforms=[{id:1,name:'示範平台 A'},{id:2,name:'示範平台 B'}];
const statusText={created:'已建檔',pending_review:'待審核',reviewed:'已審核'};
let logs=[
{id:1,ref:'PREVIEW-WL-001',logDate:'2026-09-27',dateFrom:'2026-09-27',dateTo:'2026-09-27',workDays:1,type:'generic',employee:1,status:'created',reviewedBy:null,reviewedAt:null,remark:null,final:null,avg:null,revision:1,entries:[{id:1,type:'standard',content:'完成示範商品資料整理',platform:1,cats:[{id:1,qty:1},{id:2,qty:3}],reviewRemark:null,score:null}],history:[]},
{id:2,ref:'PREVIEW-WL-002',logDate:'2026-09-26',dateFrom:'2026-09-25',dateTo:'2026-09-26',workDays:1.5,type:'generic',employee:1,status:'pending_review',reviewedBy:null,reviewedAt:null,remark:null,final:null,avg:null,revision:2,entries:[{id:2,type:'standard',content:'示範待審核工作內容',platform:2,cats:[{id:3,qty:1}],reviewRemark:null,score:null}],history:[{text:'送出審核',at:'2026-09-26 17:20'}]},
{id:3,ref:'PREVIEW-WL-003',logDate:'2026-09-24',dateFrom:'2026-09-24',dateTo:'2026-09-24',workDays:1,type:'generic',employee:1,status:'reviewed',reviewedBy:2,reviewedAt:'2026-09-25 09:10',remark:'示範審核完成',final:8,avg:8,revision:3,entries:[{id:3,type:'standard',content:'已完成示範工作',platform:1,cats:[{id:1,qty:1}],reviewRemark:'內容完整',score:8}],history:[{text:'送出審核',at:'2026-09-24 17:00'},{text:'審核完成',at:'2026-09-25 09:10'}]}
];
let currentTab='logs',selectedId=1,editing=false,draft=null,entrySeq=20,logSeq=4,currentActor=1;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function now(){return new Date().toLocaleString('zh-TW',{hour12:false}).replaceAll('/','-')}function log(id){return logs.find(x=>x.id===id)}function user(id){return users.find(x=>x.id===id)}function statusTag(s){return `<span class="status s-${s}">${statusText[s]}</span>`}
function switchTab(t){if(editing&&!confirm('目前有尚未儲存修改，確定放棄？'))return;editing=false;draft=null;currentTab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));document.getElementById('primary').style.display=t==='logs'?'':'none';render()}
function render(){if(currentTab==='logs')renderLogs();else if(currentTab==='review')renderReviewQueue();else if(currentTab==='stats')renderStats();else renderConfig()}
function renderLogs(){document.getElementById('view').innerHTML=`<div class="workspace"><section class="card left"><div class="cardhead"><div class="eyebrow">工作日誌</div><h2>搜尋與選擇</h2><input id="search" class="search" placeholder="日誌編號、類型、內容…" oninput="renderList()"><div class="filters"><select id="statusFilter" class="search" onchange="renderList()"><option value="">全部狀態</option><option value="created">已建檔</option><option value="pending_review">待審核</option><option value="reviewed">已審核</option></select><select id="ownerFilter" class="search" onchange="renderList()"><option value="1">我的日誌</option><option value="all">全部（示範授權）</option></select></div></div><div class="list" id="list"></div></section><section class="card" id="detail"></section></div>`;renderList();renderDetail()}
function renderList(){const q=(document.getElementById('search')?.value||'').toLowerCase(),sf=document.getElementById('statusFilter')?.value||'',of=document.getElementById('ownerFilter')?.value||'1';const rows=logs.filter(l=>(of==='all'||l.employee===currentActor)&&(!sf||l.status===sf)&&(!q||[l.ref,l.type,...l.entries.map(e=>e.content)].some(v=>(v||'').toLowerCase().includes(q))));document.getElementById('list').innerHTML=rows.map(l=>`<div class="row ${l.id===selectedId?'active':''}" onclick="selectLog(${l.id})"><div><b>${esc(l.ref)}</b><div class="sub">${l.logDate} · ${esc(user(l.employee)?.name)} · ${l.workDays} 日</div></div><div>${statusTag(l.status)}</div></div>`).join('')||'<div class="empty">無符合日誌</div>'}
function selectLog(id){if(editing&&!confirm('放棄目前修改？'))return;editing=false;draft=null;selectedId=id;renderList();renderDetail()}
function renderDetail(){const root=document.getElementById('detail');if(editing){renderEditor(root);return}const l=log(selectedId);if(!l){root.innerHTML='<div class="empty">請選擇日誌</div>';return}const owner=l.employee===currentActor;let acts=[];if(l.status==='created'){if(owner)acts.push(`<button class="btn" onclick="editCurrent()">修改</button>`,`<button class="btn success" onclick="submitReview()">送出審核</button>`);acts.push(`<button class="btn danger" onclick="deleteCreated()">刪除</button>`)}if(l.status==='pending_review'&&owner)acts.push(`<button class="btn warn" onclick="withdrawReview()">撤回審核</button>`);if(l.status==='pending_review')acts.push(`<button class="btn primary" onclick="openReview(${l.id})">審核計分（示範授權）</button>`);if(l.status==='reviewed')acts.push(`<button class="btn danger" onclick="cancelReview()">取消審核（示範授權）</button>`);root.innerHTML=`<div class="detailhead"><div><h2>${esc(l.ref)} ${statusTag(l.status)}</h2><div class="sub">${esc(user(l.employee)?.name)} · rev.${l.revision}</div></div><div class="actions">${acts.join('')}</div></div><div class="body"><div class="grid2"><div class="section"><h3>日誌資料</h3><div class="kv"><div><span>日誌日期</span><strong>${l.logDate}</strong></div><div><span>工作日數</span><strong>${l.workDays} 日</strong></div><div><span>涵蓋區間</span><strong>${l.dateFrom} ～ ${l.dateTo}</strong></div><div><span>類型代碼</span><strong>${esc(l.type)}</strong></div></div></div><div class="section"><h3>審核結果</h3>${l.status==='reviewed'?`<div class="kv"><div><span>總分</span><strong>${l.final}</strong></div><div><span>平均日分</span><strong>${l.avg}</strong></div><div><span>審核人</span><strong>${esc(user(l.reviewedBy)?.name)}</strong></div><div><span>審核時間</span><strong>${esc(l.reviewedAt)}</strong></div></div><div class="sub" style="margin-top:8px">整體意見：${esc(l.remark)||'—'}</div>`:'<div class="sub">尚未形成 finalized review score。</div>'}</div></div><div class="section"><h3>工作內容</h3><table class="table"><thead><tr><th>內容</th><th>平台</th><th>分類／數量</th><th>審核分數</th><th>審核意見</th></tr></thead><tbody>${l.entries.map(e=>`<tr><td>${esc(e.content)||'—'}</td><td>${esc(platforms.find(p=>p.id===e.platform)?.name)||'—'}</td><td>${e.cats.map(c=>`${esc(categories.find(x=>x.id===c.id)?.name)} ${c.qty}`).join('、')||'—'}</td><td>${e.score??'—'}</td><td>${esc(e.reviewRemark)||'—'}</td></tr>`).join('')}</tbody></table></div><div class="section"><h3>重要流程紀錄</h3>${l.history.length?l.history.slice().reverse().map(h=>`<div class="sub" style="padding:5px 0">${esc(h.at)}　${esc(h.text)}</div>`).join(''):'<div class="sub">一般草稿修改不建立逐欄歷史。</div>'}</div></div>`}
function startNew(){editing=true;selectedId=null;draft={id:null,logDate:'2026-09-27',dateFrom:'2026-09-27',dateTo:'2026-09-27',workDays:1,type:'generic',employee:currentActor,entries:[blankEntry()]};renderLogs()}
function editCurrent(){const l=log(selectedId);if(!l||l.status!=='created'||l.employee!==currentActor)return;editing=true;draft=JSON.parse(JSON.stringify(l));renderDetail()}function blankEntry(){return{id:entrySeq++,type:'standard',content:'',platform:1,cats:[],reviewRemark:null,score:null}}
function renderEditor(root){const d=draft;root.innerHTML=`<div class="detailhead"><div><h2>${d.id?'修改工作日誌':'新增工作日誌'}</h2><div class="sub">工作日數獨立輸入，不由日期區間自動推算。</div></div><div class="actions"><button class="btn" onclick="cancelEdit()">取消</button><button class="btn primary" onclick="saveDraft()">儲存</button></div></div><div class="editor"><div class="formgrid"><div class="field"><label>日誌日期</label><input id="fDate" type="date" value="${d.logDate}"></div><div class="field"><label>開始日期</label><input id="fFrom" type="date" value="${d.dateFrom}"></div><div class="field"><label>結束日期</label><input id="fTo" type="date" value="${d.dateTo}"></div><div class="field"><label>工作日數</label><input id="fDays" value="${d.workDays}" inputmode="decimal"></div><div class="field"><label>類型代碼</label><input id="fType" value="${esc(d.type)}"></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><h3>工作內容</h3><button class="btn" onclick="addEntry()">＋ 增加項目</button></div><div class="entrybox"><div class="entryrow head"><div>項目類型</div><div>內容</div><div>平台</div><div>分類</div><div></div></div><div id="entryRows"></div></div><div class="editactions"><button class="btn" onclick="cancelEdit()">取消</button><button class="btn primary" onclick="saveDraft()">儲存</button></div></div>`;renderEntryRows()}
function renderEntryRows(){document.getElementById('entryRows').innerHTML=draft.entries.map((e,i)=>`<div class="entryrow"><input value="${esc(e.type)}" oninput="draft.entries[${i}].type=this.value"><input value="${esc(e.content)}" oninput="draft.entries[${i}].content=this.value"><select onchange="draft.entries[${i}].platform=Number(this.value)">${platforms.map(p=>`<option value="${p.id}" ${p.id===e.platform?'selected':''}>${p.name}</option>`).join('')}</select><select onchange="setCategory(${i},this.value)"><option value="">未指定</option>${categories.map(c=>`<option value="${c.id}" ${e.cats[0]?.id===c.id?'selected':''}>${c.name}</option>`).join('')}</select><button class="btn danger" onclick="removeEntry(${i})">×</button></div>`).join('')}
function setCategory(i,v){const id=Number(v);draft.entries[i].cats=id?[{id,qty:categories.find(c=>c.id===id).mode==='boolean'?1:1}]:[]}function addEntry(){draft.entries.push(blankEntry());renderEntryRows()}function removeEntry(i){if(draft.entries.length===1)return toast('至少需要 1 筆工作內容');draft.entries.splice(i,1);renderEntryRows()}
function cancelEdit(){editing=false;draft=null;if(selectedId==null)selectedId=logs[0]?.id??null;renderLogs()}
function saveDraft(){draft.logDate=document.getElementById('fDate').value;draft.dateFrom=document.getElementById('fFrom').value;draft.dateTo=document.getElementById('fTo').value;draft.workDays=Number(document.getElementById('fDays').value);draft.type=document.getElementById('fType').value.trim();if(!draft.logDate||!draft.dateFrom||!draft.dateTo||draft.dateTo<draft.dateFrom)return toast('日期資料不完整');if(!Number.isFinite(draft.workDays)||draft.workDays<=0)return toast('工作日數必須大於 0');if(!draft.type)return toast('類型代碼必填');if(draft.entries.some(e=>!e.content.trim()&&!e.cats.length))return toast('每筆工作內容至少要有內容或分類');if(draft.id){const l=log(draft.id);Object.assign(l,{logDate:draft.logDate,dateFrom:draft.dateFrom,dateTo:draft.dateTo,workDays:draft.workDays,type:draft.type,entries:JSON.parse(JSON.stringify(draft.entries)),revision:l.revision+1})}else{const id=Math.max(0,...logs.map(l=>l.id))+1;logs.unshift({id,ref:`PREVIEW-WL-${String(logSeq++).padStart(3,'0')}`,logDate:draft.logDate,dateFrom:draft.dateFrom,dateTo:draft.dateTo,workDays:draft.workDays,type:draft.type,employee:currentActor,status:'created',reviewedBy:null,reviewedAt:null,remark:null,final:null,avg:null,revision:1,entries:JSON.parse(JSON.stringify(draft.entries)),history:[]});selectedId=id}editing=false;draft=null;toast('日誌已儲存（預覽記憶體）');renderLogs()}
function submitReview(){const l=log(selectedId);if(!l||l.status!=='created'||l.employee!==currentActor)return;if(!confirm('送出審核後將鎖定一般修改，確定？'))return;l.status='pending_review';l.revision++;l.history.push({text:'送出審核',at:now()});renderLogs()}function withdrawReview(){const l=log(selectedId);if(!l||l.status!=='pending_review'||l.employee!==currentActor)return;l.status='created';l.revision++;l.history.push({text:'撤回審核',at:now()});renderLogs()}function deleteCreated(){const l=log(selectedId);if(!l||l.status!=='created'||!confirm('確定刪除此已建檔日誌？'))return;logs=logs.filter(x=>x.id!==l.id);selectedId=logs[0]?.id??null;toast('日誌已刪除');renderLogs()}
function openReview(id){const l=log(id);if(!l||l.status!=='pending_review')return;document.getElementById('modalBody').innerHTML=`<h3>審核計分：${esc(l.ref)}</h3><div class="field"><label>工作日數（審核時可修正）</label><input id="rDays" value="${l.workDays}" inputmode="decimal"></div><div style="margin-top:14px" id="reviewRows">${l.entries.map((e,i)=>`<div class="reviewrow"><div><b>${esc(e.content)||'未填文字'}</b><div class="sub">${e.cats.map(c=>categories.find(x=>x.id===c.id)?.name).join('、')}</div></div><div class="field"><label>分數</label><input id="rScore${i}" value="${e.score??''}" inputmode="decimal"></div><div class="field"><label>審核意見</label><input id="rRemark${i}" value="${esc(e.reviewRemark||'')}"></div></div>`).join('')}</div><div class="field" style="margin-top:12px"><label>整體審核意見</label><textarea id="rOverall" rows="2">${esc(l.remark||'')}</textarea></div><div class="modalactions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveReview(${l.id})">儲存審核</button></div>`;openModal()}
function saveReview(id){const l=log(id),days=Number(document.getElementById('rDays').value);if(!Number.isFinite(days)||days<=0)return toast('工作日數必須大於 0');let total=0;l.entries.forEach((e,i)=>{const raw=document.getElementById(`rScore${i}`).value.trim(),score=raw===''?null:Number(raw);if(score!=null&&!Number.isFinite(score))return;e.score=score;e.reviewRemark=document.getElementById(`rRemark${i}`).value.trim()||null;if(score!=null)total+=score});const oldDays=l.workDays;l.workDays=days;l.final=Number(total.toFixed(4));l.avg=Number((l.final/days).toFixed(4));l.remark=document.getElementById('rOverall').value.trim()||null;l.reviewedBy=2;l.reviewedAt=now();l.status='reviewed';l.revision++;l.history.push({text:`審核完成${oldDays!==days?`（工作日數 ${oldDays} → ${days}）`:''}`,at:now()});closeModal();toast('審核完成');currentTab==='review'?renderReviewQueue():render()}
function cancelReview(){const l=log(selectedId);if(!l||l.status!=='reviewed'||!confirm('取消審核會清除目前計分並退回待審核，確定？'))return;l.status='pending_review';l.reviewedBy=null;l.reviewedAt=null;l.remark=null;l.final=null;l.avg=null;l.entries.forEach(e=>{e.score=null;e.reviewRemark=null});l.revision++;l.history.push({text:'取消審核（計分已清除）',at:now()});renderLogs()}
function renderReviewQueue(){const rows=logs.filter(l=>l.status==='pending_review');document.getElementById('view').innerHTML=`<div class="card"><div class="cardhead"><div class="eyebrow">Reviewer Queue</div><h2>待審核日誌</h2></div><div class="body">${rows.length?`<table class="table"><thead><tr><th>日誌</th><th>人員</th><th>日期</th><th>工作日數</th><th></th></tr></thead><tbody>${rows.map(l=>`<tr><td><b>${l.ref}</b></td><td>${user(l.employee).name}</td><td>${l.logDate}</td><td>${l.workDays}</td><td><button class="btn primary" onclick="openReview(${l.id})">審核計分</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">目前沒有待審核日誌</div>'}</div></div>`}
function renderStats(){const reviewed=logs.filter(l=>l.status==='reviewed'),days=reviewed.reduce((s,l)=>s+l.workDays,0),score=reviewed.reduce((s,l)=>s+(l.final||0),0),avg=days?score/days:null;document.getElementById('view').innerHTML=`<div class="scorecard"><div class="metric"><strong>${reviewed.length}</strong><span>已審核日誌</span></div><div class="metric"><strong>${days.toFixed(2)}</strong><span>總工作日數</span></div><div class="metric"><strong>${avg==null?'—':avg.toFixed(2)}</strong><span>加權平均日分</span></div></div><div class="section" style="background:#fff;margin-top:12px"><h3>已審核紀錄</h3><table class="table"><thead><tr><th>日期</th><th>日誌</th><th>工作日數</th><th>總分</th><th>平均日分</th></tr></thead><tbody>${reviewed.map(l=>`<tr><td>${l.logDate}</td><td>${l.ref}</td><td>${l.workDays}</td><td>${l.final}</td><td>${l.avg}</td></tr>`).join('')}</tbody></table></div>`}
function renderConfig(){document.getElementById('view').innerHTML=`<div class="notice"><b>Public-source 邊界：</b>這些都是中性示範設定。正式志遠分類、平台、分數與門檻會存放在部署環境 D1，由授權管理者設定，不寫死在 Public source。</div><div class="configgrid">${categories.map(c=>`<div class="configcard"><b>${c.name}</b><div class="sub">input_mode: ${c.mode}${c.unit?' · '+c.unit:''}</div><div class="sub">示範參考分：${c.score}</div></div>`).join('')}${platforms.map(p=>`<div class="configcard"><b>${p.name}</b><div class="sub">平台設定示範</div></div>`).join('')}</div>`}
function openModal(){document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}
render();
</script></body></html>
