*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}aside{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:10px;align-items:center}.mark{width:40px;height:40px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900}.brand b{display:block;font-size:16px}.brand small{display:block;color:var(--sub);font-size:12px;margin-top:2px}.navlabel{font-size:12px;color:var(--sub);font-weight:800;padding:0 8px;margin-bottom:5px}.nav{display:grid;gap:4px}.nav a{padding:9px 10px;border-radius:9px;text-decoration:none;color:#46515c;font-size:15px;font-weight:700}.nav a.active{background:var(--accentsoft);color:var(--accent)}.nav a.disabled{opacity:.38;pointer-events:none}.aside-note{margin-top:auto;border-top:1px solid var(--border);padding:10px 5px 0;color:var(--sub);font-size:12px;line-height:1.55}.workspace{min-width:0}.topbar{height:58px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10}.topbar b{font-size:16px}.chip{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;background:#edf0f2;color:#4c5965;font-size:13px;font-weight:800;white-space:nowrap}.chip.green{background:var(--greensoft);color:var(--green)}.chip.blue{background:var(--bluesoft);color:var(--blue)}.chip.warn{background:var(--warnsoft);color:var(--warn)}.chip.red{background:var(--dangersoft);color:var(--danger)}main{max-width:1540px;padding:18px 28px 40px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:12px}.head h1{margin:0;font-size:29px}.head p{margin:6px 0 0;color:var(--sub);font-size:14px}.btn{min-height:38px;border:1px solid transparent;border-radius:9px;padding:8px 14px;font-size:14px;font-weight:800;background:#fff}.btn.primary{background:var(--accent);color:#fff}.btn.secondary{border-color:var(--border2);color:var(--text)}.btn.quiet{border-color:transparent;color:#4b5864;background:transparent}.btn.danger{border-color:#e5bbbb;color:var(--danger);background:#fff}.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}.notice{margin-bottom:14px;border:1px solid #cedee9;background:var(--bluesoft);border-radius:11px;padding:10px 13px;font-size:14px;color:#405567}.split{display:grid;grid-template-columns:minmax(370px,.78fr) minmax(0,1.72fr);gap:16px;align-items:start}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.listpanel{position:sticky;top:76px}.searchhead{padding:14px;border-bottom:1px solid var(--border);background:linear-gradient(#fff,#fcfdfe)}.searchtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.searchtitle>div{display:grid;gap:1px}.searchtitle small,.resultmeta{color:var(--sub);font-size:13px}.searchtitle b{font-size:16px}.count{min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--muted);display:grid;place-items:center;color:var(--sub);font-size:13px;font-weight:800}.searchbox input{width:100%;min-height:41px;border:1px solid var(--border2);border-radius:9px;background:#fff;padding:8px 10px;font-size:15px;outline:none}.filterrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.filterrow select{width:100%;min-width:0;min-height:39px;border:1px solid var(--border2);border-radius:8px;background:#fff;padding:6px 8px;color:#596673;font-size:14px}.resultmeta{display:flex;justify-content:space-between;gap:10px;margin-top:9px}.clear{border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:800}.rows{max-height:710px;overflow:auto}.row{display:grid;grid-template-columns:minmax(0,1fr) 78px 72px;gap:10px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--border);cursor:pointer}.row:hover{background:#fbfcfd}.row.active{background:var(--accentsoft);box-shadow:inset 3px 0 0 var(--accent)}.row strong{display:block;font-size:15px}.row small{display:block;color:var(--sub);font-size:13px;margin-top:2px}.row .unit{text-align:right;color:#53606c;font-size:14px}.row .state{justify-self:end}.detailhead{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:14px;background:linear-gradient(#fff,#fbfcfd)}.titleline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.titleline h2{margin:0;font-size:26px}.subtitle{color:var(--sub);font-size:14px;margin-top:3px}.meta{display:flex;gap:7px 12px;flex-wrap:wrap;margin-top:10px;color:#4d5965;font-size:14px}.actions{display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:14px;background:#f7f9fa}.card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:15px;min-width:0}.card.wide{grid-column:1/-1}.cardtitle{font-weight:900;font-size:15px;margin-bottom:11px}.vals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}.val span{display:block;color:var(--sub);font-size:13px;font-weight:700;margin-bottom:3px}.val b{font-size:15px;overflow-wrap:anywhere}.note{font-size:14px;white-space:pre-wrap}.convs{display:grid;gap:7px}.conv{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;font-size:14px}.conv strong{text-align:right}.related{border-top:1px solid var(--border)}.tabs{display:flex;gap:4px;padding:10px 12px 0;overflow:auto}.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:8px 10px;color:var(--sub);font-weight:800;font-size:14px;white-space:nowrap}.tabs button.active{border-bottom-color:var(--accent);color:var(--accent)}.tabbody{padding:15px 17px 18px;min-height:150px}.relhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:11px}.relhead strong{font-size:15px}.relhead span{display:block;color:var(--sub);font-size:13px;margin-top:2px}.history{display:grid;gap:7px}.historyrow{display:grid;grid-template-columns:150px 1fr 150px;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}.historyrow:last-child{border-bottom:0}.historyrow small{color:var(--sub);font-size:13px}.defect{border:1px solid var(--border);border-radius:11px;margin-bottom:10px;overflow:hidden}.defect.invalid{opacity:.72}.defecthead{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--muted)}.defecthead b{font-size:14px}.defecthead span{font-size:13px;color:var(--sub)}.defectbody{padding:11px 12px}.defectbody p{margin:4px 0;font-size:14px;line-height:1.55}.defectmeta{display:flex;gap:8px;flex-wrap:wrap;color:var(--sub);font-size:13px}.rowactions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}.empty{padding:26px;color:var(--sub);text-align:center;font-size:14px}.form{padding:14px;background:#f8fafb}.formsection{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px;margin-bottom:11px}.formsection h3{font-size:16px;margin:0 0 11px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:grid;gap:5px}.field.wide{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border2);border-radius:8px;padding:8px 9px;background:#fff;font-size:15px;min-height:41px}.field textarea{min-height:90px;resize:vertical}.field input[readonly]{background:#f1f3f5;color:#65717d}.hint{color:var(--sub);font-size:13px;line-height:1.5}.repeat{display:grid;gap:8px}.repeatrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;border:1px solid var(--border);border-radius:9px;padding:10px}.repeatgrid{display:grid;grid-template-columns:1fr .8fr 1fr;gap:8px}.formactions{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--border);background:#fff}.topedit{display:flex;gap:8px}.drawerback{position:fixed;inset:0;background:rgba(20,28,36,.38);display:none;z-index:30}.drawerback.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(620px,94vw);background:#fff;box-shadow:-18px 0 44px rgba(0,0,0,.18);display:flex;flex-direction:column}.drawerhead{padding:17px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}.drawerhead h2{font-size:20px;margin:0}.drawerhead p{font-size:13px;color:var(--sub);margin:4px 0 0;line-height:1.5}.drawerbody{padding:17px 18px;overflow:auto;flex:1}.drawerfoot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}.drawerclose{border:0;background:transparent;font-size:26px;color:var(--sub)}.warning{background:var(--warnsoft);border:1px solid #ead8b2;border-radius:9px;padding:10px 11px;color:#725321;font-size:13px;line-height:1.5}.toast{position:fixed;right:20px;bottom:20px;background:#fff;border:1px solid var(--border);box-shadow:0 12px 34px rgba(0,0,0,.16);border-radius:11px;padding:11px 14px;font-size:14px;display:none;z-index:50}.toast.show{display:block}
@media(max-width:1100px){.split{grid-template-columns:minmax(330px,.72fr) minmax(0,1.28fr)}.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.historyrow{grid-template-columns:120px 1fr}.historyrow>*:last-child{grid-column:2}.repeatgrid{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:10px 13px}.brand small,.navlabel,.aside-note{display:none}.nav{display:flex;overflow:auto}.nav a{white-space:nowrap;border:1px solid var(--border);padding:7px 9px}.topbar{display:none}main{padding:14px}.split{grid-template-columns:1fr}.listpanel{position:static}.rows{max-height:none}}
@media(max-width:620px){.head,.detailhead,.relhead{flex-direction:column}.head .btn{width:100%}.filterrow{grid-template-columns:1fr}.row{grid-template-columns:1fr 78px}.row .unit{display:none}.actions,.topedit{width:100%}.actions .btn,.topedit .btn{flex:1}.vals,.formgrid,.repeatgrid{grid-template-columns:1fr}.conv{grid-template-columns:1fr}.conv strong{text-align:left}.historyrow{grid-template-columns:1fr}.historyrow>*:last-child{grid-column:auto}.drawer{width:100vw}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="mark">CY</div><div><b>CY Web</b><small>Chihyuan Enterprise Management System</small></div></div>
  <div><div class="navlabel">業務</div><nav class="nav"><a href="#">客戶</a><a class="active" href="#">商品</a><a class="disabled" href="#">銷售工單</a><a class="disabled" href="#">委外</a><a class="disabled" href="#">工作日誌</a></nav></div>
  <div><div class="navlabel">管理</div><nav class="nav"><a class="disabled" href="#">設定</a><a class="disabled" href="#">稽核紀錄</a></nav></div>
  <div class="aside-note">FUNCTION PREVIEW 0.1.28<br>假資料、瀏覽器記憶體，不連 D1。</div>
</aside>
<div class="workspace">
  <div class="topbar"><b>商品管理</b><span class="chip blue">Full Preview 0.1.28</span></div>
  <main>
    <section class="head"><div><h1>商品管理</h1><p>先驗證功能：商品主檔、單位換算、受控品號變更／歷史、瑕疵流程整合在同一個 Workspace。</p></div><button class="btn primary" onclick="startCreate()">新增商品</button></section>
    <div class="notice"><b>預覽環境：</b>所有資料只存在目前瀏覽器記憶體，重新整理即還原；不連 D1、不繞過 Identity。</div>
    <section class="split">
      <div class="panel listpanel">
        <div class="searchhead">
          <div class="searchtitle"><div><small>商品搜尋</small><b>搜尋與選擇商品</b></div><span class="count" id="count">0</span></div>
          <label class="searchbox"><input id="search" type="search" placeholder="品號、舊品號、品名、規格、分類…"></label>
          <div class="filterrow">
            <select id="catFilter"><option value="">全部分類</option><option>針灸用品</option><option>耗材</option><option>拔罐用品</option></select>
            <select id="activeFilter"><option value="">全部狀態</option><option value="active">使用中</option><option value="inactive">已停用</option></select>
          </div>
          <div class="resultmeta"><span id="summary"></span><button class="clear" onclick="clearFilters()">清除條件</button></div>
        </div>
        <div class="rows" id="rows"></div>
      </div>
      <div class="panel" id="detail"></div>
    </section>
  </main>
</div>
</div>
<div class="drawerback" id="drawerBack" onclick="backdropClose(event)"><div class="drawer"><div class="drawerhead"><div><h2 id="drawerTitle"></h2><p id="drawerDesc"></p></div><button class="drawerclose" onclick="closeDrawer()">×</button></div><div class="drawerbody" id="drawerBody"></div><div class="drawerfoot" id="drawerFoot"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let items=[
{id:1,no:'A0101',name:'針灸針 0.25×40mm',spec:'100支/盒',unit:'盒',cat:'針灸用品',cost:'78.5',tax:'inclusive',store:'120',clinic:'95',notes:'示範商品。',active:true,revision:3,updated:'2026-09-26 15:20',convs:[{from:'箱',qty:'20',to:'盒'}],history:[{no:'A0008',from:'2025-01-01',to:'2026-05-20',source:'SMART ERP 編號調整'}]},
{id:2,no:'P0203',name:'酒精棉球',spec:'500g/包',unit:'包',cat:'耗材',cost:'82',tax:'exclusive',store:'130',clinic:'105',notes:'',active:true,revision:1,updated:'2026-09-20 10:05',convs:[{from:'箱',qty:'24',to:'包'}],history:[]},
{id:3,no:'P0310',name:'拔罐杯 3號',spec:'單入',unit:'個',cat:'拔罐用品',cost:'16.25',tax:'none',store:'35',clinic:'28',notes:'舊款，暫停一般選用。',active:false,revision:4,updated:'2026-08-11 09:10',convs:[{from:'袋',qty:'10',to:'個'},{from:'箱',qty:'10',to:'袋'}],history:[{no:'OLD-CUP3',from:'2024-03-01',to:'2026-01-15',source:'品號重整'}]}
];
const customers=[{id:1,no:'C-00128',name:'示範中醫診所'},{id:2,no:null,name:'測試養生館'}];
const employees=[{id:1,name:'王○○'},{id:2,name:'李○○'}];
let defects={
1:[
{id:101,date:'2026-09-15',customerId:1,customerNo:'C-00128',customerName:'示範中醫診所',itemNo:'A0101',itemName:'針灸針 0.25×40mm',spec:'100支/盒',ownerId:1,description:'外盒壓傷，內盒完整。',handling:'已請客戶拍照確認數量。',status:'processing',invalidated:false,revision:2,createdBy:1},
{id:102,date:'2026-08-10',customerId:1,customerNo:'C-00128',customerName:'示範中醫診所',itemNo:'A0101',itemName:'針灸針 0.25×40mm',spec:'100支/盒',ownerId:1,description:'客戶反映包裝標示錯誤。',handling:'確認為舊標籤，已完成更換。',status:'resolved',invalidated:false,revision:3,createdBy:1}
],2:[],3:[{id:103,date:'2026-07-21',customerId:2,customerNo:null,customerName:'測試養生館',itemNo:'P0310',itemName:'拔罐杯 3號',spec:'單入',ownerId:2,description:'測試建立錯誤資料。',handling:'',status:'processing',invalidated:true,revision:2,createdBy:2}]
};
let selectedId=1,edit=null,dirty=false,tab='defects',showInvalid=false,drawerSave=null;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
function item(id){return items.find(x=>x.id===id)}function emp(id){return employees.find(x=>x.id===id)?.name||'未知'}function customer(id){return customers.find(x=>x.id===id)}
function chip(text,tone=''){return `<span class="chip ${tone}">${esc(text)}</span>`}function stateChip(i){return i.active?chip('使用中','green'):chip('已停用')}
function defectChip(d){if(d.invalidated)return chip('已作廢','red');if(d.status==='created')return chip('已建檔','blue');if(d.status==='processing')return chip('處理中','warn');return chip('已處理','green')}
function filteredItems(){const q=$('search').value.trim().toLowerCase(),cat=$('catFilter').value,af=$('activeFilter').value;return items.filter(i=>{const hist=i.history.map(h=>h.no).join(' ');const text=[i.no,i.name,i.spec,i.cat,hist].join(' ').toLowerCase();return(!q||text.includes(q))&&(!cat||i.cat===cat)&&(!af||(af==='active')===i.active)})}
function renderRows(){const arr=filteredItems();$('count').textContent=arr.length;$('summary').textContent=`示範結果 ${arr.length} 筆`;$('rows').innerHTML=arr.length?arr.map(i=>`<div class="row ${i.id===selectedId&&!edit?'active':''}" onclick="selectItem(${i.id})"><div><strong>${esc(i.name)}</strong><small>${esc(i.no)} · ${esc(i.spec)}</small></div><div class="unit">${esc(i.unit)}</div><div class="state">${stateChip(i)}</div></div>`).join(''):'<div class="empty">沒有符合的商品</div>'}
function clearFilters(){$('search').value='';$('catFilter').value='';$('activeFilter').value='';render()}
function selectItem(id){if(edit&&dirty&&!confirm('目前有未儲存變更，確定捨棄？'))return;edit=null;dirty=false;selectedId=id;tab='defects';render()}
function render(){renderRows();renderDetail()}
function renderDetail(){const i=item(selectedId);if(edit){renderForm();return}if(!i){$('detail').innerHTML='<div class="empty">請選擇商品</div>';return}$('detail').innerHTML=`<div class="detailhead"><div><div class="titleline"><h2>${esc(i.name)}</h2>${stateChip(i)}</div><div class="subtitle">${esc(i.spec||'')}</div><div class="meta"><span>${esc(i.no)}</span><span>${esc(i.cat||'未分類')}</span><span>基準單位 ${esc(i.unit)}</span><span>rev. ${i.revision}</span></div></div><div class="actions"><button class="btn secondary" onclick="startEdit()">修改</button><button class="btn secondary" onclick="openRenumber()">更改品號</button></div></div>
<div class="grid"><div class="card"><div class="cardtitle">基本資料</div><div class="vals"><div class="val"><span>品號</span><b>${esc(i.no)}</b></div><div class="val"><span>分類</span><b>${esc(i.cat||'—')}</b></div><div class="val"><span>基準單位</span><b>${esc(i.unit)}</b></div><div class="val"><span>狀態</span><b>${i.active?'使用中':'已停用'}</b></div></div></div><div class="card"><div class="cardtitle">價格 / 成本</div><div class="vals"><div class="val"><span>成本</span><b>${esc(i.cost||'—')}</b></div><div class="val"><span>成本稅別</span><b>${taxLabel(i.tax)}</b></div><div class="val"><span>門市價</span><b>${esc(i.store||'—')}</b></div><div class="val"><span>診所價</span><b>${esc(i.clinic||'—')}</b></div></div></div><div class="card wide"><div class="cardtitle">單位換算</div>${renderConversions(i.convs,i.unit)}</div><div class="card wide"><div class="cardtitle">備註</div><div class="note">${esc(i.notes||'尚無備註')}</div></div></div>
<div class="related"><div class="tabs"><button class="${tab==='defects'?'active':''}" onclick="setTab('defects')">瑕疵紀錄</button><button class="${tab==='history'?'active':''}" onclick="setTab('history')">品號歷史</button></div><div class="tabbody">${tab==='defects'?renderDefects(i):renderHistory(i)}</div></div>`}
function taxLabel(x){return x==='inclusive'?'含稅':x==='exclusive'?'外稅':'無'}
function renderConversions(convs,base){if(!convs.length)return'<div class="empty">沒有其他單位換算</div>';return `<div class="convs">${convs.map(c=>`<div class="conv"><span>1 ${esc(c.from)}</span><strong>= ${esc(c.qty)}</strong><span>${esc(c.to)}</span></div>`).join('')}</div><div class="hint" style="margin-top:8px">所有路徑最後都必須解析到基準單位「${esc(base)}」。</div>`}
function setTab(x){tab=x;renderDetail()}
function renderHistory(i){return `<div class="relhead"><div><strong>品號歷史</strong><span>舊品號預設仍可搜尋；更改品號是受控操作，不屬一般修改。</span></div></div>${i.history.length?`<div class="history">${i.history.slice().reverse().map(h=>`<div class="historyrow"><b>${esc(h.no)}</b><span>${esc(h.source||'')}</span><small>${esc(h.from)} → ${esc(h.to||'目前')}</small></div>`).join('')}</div>`:'<div class="empty">尚無舊品號</div>'}`}
function renderDefects(i){let arr=(defects[i.id]||[]).filter(d=>showInvalid||!d.invalidated);return `<div class="relhead"><div><strong>瑕疵紀錄</strong><span>狀態轉換是明確動作；已處理案件必須重新開啟才可修改。</span><label style="display:block;margin-top:6px;font-size:13px"><input type="checkbox" ${showInvalid?'checked':''} onchange="showInvalid=this.checked;renderDetail()"> 顯示已作廢紀錄</label></div><button class="btn secondary sm" onclick="openDefect(null)">新增瑕疵</button></div>${arr.length?arr.map(d=>`<div class="defect ${d.invalidated?'invalid':''}"><div class="defecthead"><div><b>${esc(d.date)} · ${esc(d.customerName)}</b><span>${d.customerNo?` ${esc(d.customerNo)}`:''}</span></div>${defectChip(d)}</div><div class="defectbody"><div class="defectmeta"><span>負責：${esc(emp(d.ownerId))}</span><span>rev. ${d.revision}</span></div><p><b>瑕疵：</b>${esc(d.description)}</p><p><b>處理：</b>${esc(d.handling||'尚未填寫')}</p>${d.invalidated?'<div class="warning">此紀錄已作廢並保留，不再允許一般修改或狀態轉換。</div>':defectActions(d)}</div></div>`).join(''):'<div class="empty">尚無瑕疵紀錄</div>'}`}
function defectActions(d){let buttons=[];if(d.status!=='resolved')buttons.push(`<button class="btn quiet sm" onclick="openDefect(${d.id})">修改</button>`);if(d.status==='created'){buttons.push(`<button class="btn secondary sm" onclick="transitionDefect(${d.id},'processing')">開始處理</button>`);buttons.push(`<button class="btn danger sm" onclick="deleteDefect(${d.id})">刪除</button>`)}if(d.status==='processing'){buttons.push(`<button class="btn secondary sm" onclick="transitionDefect(${d.id},'resolved')">標記已處理</button>`);buttons.push(`<button class="btn danger sm" onclick="invalidateDefect(${d.id})">作廢紀錄</button>`)}if(d.status==='resolved'){buttons.push(`<button class="btn secondary sm" onclick="transitionDefect(${d.id},'processing')">重新開啟</button>`);buttons.push(`<button class="btn danger sm" onclick="invalidateDefect(${d.id})">作廢紀錄</button>`)}return `<div class="rowactions">${buttons.join('')}</div>`}
function startEdit(){edit=JSON.parse(JSON.stringify(item(selectedId)));dirty=false;renderDetail()}
function startCreate(){if(edit&&dirty&&!confirm('目前有未儲存變更，確定捨棄？'))return;edit={id:null,no:'',name:'',spec:'',unit:'',cat:'針灸用品',cost:'',tax:'none',store:'',clinic:'',notes:'',active:true,revision:0,updated:'',convs:[],history:[]};dirty=false;renderDetail()}
function field(key,label,val,ro=false,type='text'){return `<div class="field"><label>${label}</label><input data-core="${key}" type="${type}" value="${esc(val)}" ${ro?'readonly':''}></div>`}
function selectField(key,label,val,opts){return `<div class="field"><label>${label}</label><select data-core="${key}">${opts.map(o=>`<option ${o[0]===val?'selected':''} value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select></div>`}
function renderForm(){const i=edit;const existing=!!i.id;$('detail').innerHTML=`<div class="detailhead"><div><div class="titleline"><h2>${existing?'修改商品':'新增商品'}</h2>${chip('未儲存','warn')}</div><div class="subtitle">${existing?'一般修改不直接更動品號；需要更改時回查看模式使用「更改品號」。':'請輸入已存在於 SMART ERP 的正式品號；CY Web 不產生 ERP 品號。'}</div></div><div class="topedit"><button class="btn secondary" onclick="cancelEdit()">取消</button><button class="btn primary" onclick="saveItem()">儲存</button></div></div><div class="form"><div class="formsection"><h3>基本資料</h3><div class="formgrid">${field('no','品號',i.no,existing)}${field('name','品名',i.name)}${field('spec','規格',i.spec)}${field('unit','基準單位',i.unit)}${selectField('cat','商品分類',i.cat,[['針灸用品','針灸用品'],['耗材','耗材'],['拔罐用品','拔罐用品']])}${selectField('active','狀態',i.active?'1':'0',[['1','使用中'],['0','已停用']])}</div></div><div class="formsection"><h3>價格 / 成本</h3><div class="formgrid">${field('cost','成本',i.cost)}${selectField('tax','成本稅別',i.tax,[['none','無'],['inclusive','含稅'],['exclusive','外稅']])}${field('store','門市價',i.store)}${field('clinic','診所價',i.clinic)}</div><div class="hint" style="margin-top:8px">成本／單價最多 4 位小數；正式金額的文件四捨五入規則另行處理。</div></div><div class="formsection"><h3>單位換算</h3><div class="repeat" id="convList"></div><button class="btn quiet sm" onclick="addConv()">＋ 新增換算</button><div class="hint" style="margin-top:8px">格式：1 來源單位 = 數量 × 目標單位；可以串接，但最後必須回到基準單位。</div></div><div class="formsection"><h3>備註</h3><div class="field"><textarea data-core="notes">${esc(i.notes)}</textarea></div></div></div><div class="formactions"><button class="btn secondary" onclick="cancelEdit()">取消</button><button class="btn primary" onclick="saveItem()">儲存</button></div>`;bindForm();renderConvEditor()}
function bindForm(){document.querySelectorAll('[data-core]').forEach(el=>el.addEventListener('input',()=>{const k=el.dataset.core;if(k==='active')edit.active=el.value==='1';else edit[k]=el.value;dirty=true}))}
function renderConvEditor(){$('convList').innerHTML=edit.convs.length?edit.convs.map((c,idx)=>`<div class="repeatrow"><div class="repeatgrid"><div class="field"><label>來源單位</label><input value="${esc(c.from)}" oninput="edit.convs[${idx}].from=this.value;dirty=true"></div><div class="field"><label>數量</label><input value="${esc(c.qty)}" oninput="edit.convs[${idx}].qty=this.value;dirty=true"></div><div class="field"><label>目標單位</label><input value="${esc(c.to)}" oninput="edit.convs[${idx}].to=this.value;dirty=true"></div></div><button class="btn quiet sm" onclick="edit.convs.splice(${idx},1);dirty=true;renderConvEditor()">移除</button></div>`).join(''):'<div class="empty">尚未設定其他單位換算</div>'}
function addConv(){edit.convs.push({from:'',qty:'',to:edit.unit||''});dirty=true;renderConvEditor()}
function validateDecimal(x){return x===''||/^\d+(?:\.\d{1,4})?$/.test(x)}
function validateConversions(i){const base=i.unit.trim(),sources=new Set();for(const c of i.convs){c.from=c.from.trim();c.qty=c.qty.trim();c.to=c.to.trim();if(!c.from||!c.to||!c.qty)return'單位換算欄位不可留空';if(c.from===base)return`來源單位「${c.from}」不可與基準單位相同`;if(c.from===c.to)return`來源單位「${c.from}」不可等於目標單位`;if(sources.has(c.from))return`來源單位「${c.from}」重複`;sources.add(c.from);if(!validateDecimal(c.qty)||Number(c.qty)<=0)return`「${c.from}」換算數量格式錯誤`;}const map=new Map(i.convs.map(c=>[c.from,c.to]));for(const c of i.convs){if(c.to!==base&&!sources.has(c.to))return`目標單位「${c.to}」沒有定義`;let cur=c.from,seen=new Set();while(cur!==base){if(seen.has(cur))return`換算路徑存在循環（${c.from}）`;seen.add(cur);cur=map.get(cur);if(!cur)return`「${c.from}」無法解析到基準單位「${base}」`;}}return null}
function saveItem(){const i=edit;i.name=i.name.trim();i.no=i.no.trim();i.unit=i.unit.trim();if(!i.no||!i.name||!i.unit){alert('品號、品名、基準單位為必填');return}if(!i.id&&items.some(x=>x.no===i.no)){alert('品號已存在');return}for(const k of ['cost','store','clinic'])if(!validateDecimal(i[k])){alert(`${k==='cost'?'成本':k==='store'?'門市價':'診所價'}最多 4 位小數`);return}const err=validateConversions(i);if(err){alert(err);return}i.updated='2026-09-27 17:30';if(i.id){const old=item(i.id);i.revision=old.revision+1;i.history=old.history;items=items.map(x=>x.id===i.id?JSON.parse(JSON.stringify(i)):x)}else{i.id=Math.max(0,...items.map(x=>x.id))+1;i.revision=1;i.history=[];items.push(JSON.parse(JSON.stringify(i)));defects[i.id]=[];selectedId=i.id}edit=null;dirty=false;toast('商品主檔已儲存到預覽記憶體');render()}
function cancelEdit(){if(dirty&&!confirm('捨棄未儲存變更？'))return;edit=null;dirty=false;render()}
function openDrawer(title,desc,body,saveLabel,saveFn){drawerSave=saveFn;$('drawerTitle').textContent=title;$('drawerDesc').textContent=desc;$('drawerBody').innerHTML=body;$('drawerFoot').innerHTML=`<button class="btn secondary" onclick="closeDrawer()">取消</button><button class="btn primary" id="drawerSave">${esc(saveLabel)}</button>`;$('drawerSave').onclick=saveFn;$('drawerBack').classList.add('open')}
function closeDrawer(){$('drawerBack').classList.remove('open');drawerSave=null}function backdropClose(e){if(e.target===$('drawerBack'))closeDrawer()}
function openRenumber(){const i=item(selectedId);openDrawer('更改正式品號','此動作會保留舊品號並留下歷史；一般修改不會直接覆寫品號。',`<div class="warning">正式版此操作會與 Audit 在同一個 D1 transaction 完成。舊品號預設仍可搜尋。</div><div class="field" style="margin-top:14px"><label>目前品號</label><input value="${esc(i.no)}" readonly></div><div class="field" style="margin-top:10px"><label>新 SMART ERP 品號</label><input id="newNo" value=""></div><div class="field" style="margin-top:10px"><label>變更來源 / 備註</label><input id="changeSource" value="SMART ERP 品號調整"></div>`,'確認更改',()=>{const n=$('newNo').value.trim();if(!n){alert('請輸入新品號');return}if(n===i.no){alert('新品號與目前品號相同');return}if(items.some(x=>x.id!==i.id&&x.no===n)){alert('新品號已被其他商品使用');return}i.history.push({no:i.no,from:i.history.length?i.history[i.history.length-1].to||i.updated.slice(0,10):'2026-01-01',to:'2026-09-27',source:$('changeSource').value.trim()});i.no=n;i.revision++;i.updated='2026-09-27 17:30';closeDrawer();toast('品號已受控更改；舊品號保留可搜尋');render()})}
function openDefect(id){const i=item(selectedId),existing=(defects[i.id]||[]).find(x=>x.id===id);if(existing?.status==='resolved'||existing?.invalidated){alert('已處理／已作廢紀錄不可直接修改');return}const d=existing?JSON.parse(JSON.stringify(existing)):{id:null,date:'2026-09-27',customerId:1,ownerId:1,description:'',handling:'',status:'created',invalidated:false,revision:0,createdBy:1};const body=`<div class="field"><label>回報日期</label><input id="dDate" type="date" value="${esc(d.date)}"></div><div class="field" style="margin-top:10px"><label>客戶</label><select id="dCustomer">${customers.map(c=>`<option value="${c.id}" ${c.id===d.customerId?'selected':''}>${esc(c.name)}${c.no?' · '+esc(c.no):''}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>負責人</label><select id="dOwner">${employees.map(e=>`<option value="${e.id}" ${e.id===d.ownerId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>瑕疵情形</label><textarea id="dDesc">${esc(d.description)}</textarea></div><div class="field" style="margin-top:10px"><label>處理方式</label><textarea id="dHandling">${esc(d.handling)}</textarea></div>`;openDrawer(existing?'修改瑕疵紀錄':'新增瑕疵紀錄',`商品：${i.no} ${i.name}` ,body,'儲存',()=>{const desc=$('dDesc').value.trim();if(!desc){alert('瑕疵情形必填');return}const c=customer(Number($('dCustomer').value));d.date=$('dDate').value;d.customerId=c.id;d.customerNo=c.no;d.customerName=c.name;d.itemNo=i.no;d.itemName=i.name;d.spec=i.spec;d.ownerId=Number($('dOwner').value);d.description=desc;d.handling=$('dHandling').value.trim();if(existing){d.revision=existing.revision+1;defects[i.id]=defects[i.id].map(x=>x.id===d.id?d:x)}else{d.id=Math.max(100,...Object.values(defects).flat().map(x=>x.id))+1;d.revision=1;defects[i.id].unshift(d)}closeDrawer();toast('瑕疵紀錄已儲存到預覽記憶體');renderDetail()})}
function findDefect(id){for(const arr of Object.values(defects)){const d=arr.find(x=>x.id===id);if(d)return d}return null}
function transitionDefect(id,to){const d=findDefect(id);if(!d||d.invalidated)return;const expected=d.status==='created'&&to==='processing'||d.status==='processing'&&to==='resolved'||d.status==='resolved'&&to==='processing';if(!expected){alert('目前狀態不能執行此轉換');return}const label=to==='resolved'?'標記為已處理':d.status==='resolved'?'重新開啟':'開始處理';if(!confirm(`確定要「${label}」？`))return;d.status=to;d.revision++;toast(`${label}完成（預覽）`);renderDetail()}
function deleteDefect(id){const d=findDefect(id);if(!d||d.status!=='created'||d.invalidated){alert('只有尚未開始處理的紀錄可硬刪除');return}if(!confirm('確定刪除此尚未處理的瑕疵紀錄？正式版會留下 Audit。'))return;defects[selectedId]=defects[selectedId].filter(x=>x.id!==id);toast('瑕疵紀錄已刪除（預覽）');renderDetail()}
function invalidateDefect(id){const d=findDefect(id);if(!d||d.status==='created'||d.invalidated)return;const reason=prompt('請輸入作廢原因（此為預覽）','誤建立');if(reason===null)return;d.invalidated=true;d.revision++;toast('瑕疵紀錄已作廢並保留');renderDetail()}
$('search').addEventListener('input',renderRows);$('catFilter').addEventListener('change',renderRows);$('activeFilter').addEventListener('change',renderRows);window.addEventListener('beforeunload',e=>{if(edit&&dirty){e.preventDefault();e.returnValue=''}});render();
</script>
</body>
</html>
