<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CY Web - 銷售工單完整功能預覽</title>
<style>
:root{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#15202b;background:#f3f6f8;font-size:15px;--red:#8d2132;--red2:#a52a3d;--line:#d9e1e7;--muted:#667788;--card:#fff;--blue:#eaf3fb;--green:#e7f5ec;--amber:#fff4dc;--gray:#eef1f3}
*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;margin-bottom:28px}.logo{width:34px;height:42px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.5}.nav h4{font-size:12px;color:#71808e;margin:20px 8px 8px}.nav div{padding:10px 10px;border-radius:9px;color:#52606d}.nav .active{background:#f6e8eb;color:var(--red);font-weight:700}.main{min-width:0}.topbar{height:50px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.badge{background:#e9f2f8;color:#34617b;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}.content{padding:18px 24px 40px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}.pagehead h1{margin:0 0 4px;font-size:27px}.pagehead p{margin:0;color:var(--muted);font-size:14px}.btn{border:1px solid #cbd5dd;background:#fff;border-radius:8px;padding:9px 13px;font:inherit;font-weight:700;cursor:pointer}.btn:hover{background:#f7f9fa}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.danger{color:#a11f32;border-color:#e1b6bd}.btn.soft{background:#f6f8fa}.btn.warn{background:#fff5dd;border-color:#eacb7c}.btn:disabled{opacity:.42;cursor:not-allowed}.notice{background:#eaf3fb;border:1px solid #cbdfee;padding:10px 13px;border-radius:10px;color:#36596f;margin-bottom:14px}.workspace{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 15px rgba(19,35,47,.045);overflow:hidden}.searchpane{position:sticky;top:66px}.cardhead{padding:14px 15px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;color:#7b8995}.cardhead h2{font-size:17px;margin:2px 0 10px}.searchrow{display:flex;gap:7px}.searchrow input,.searchrow select,.field input,.field select,.field textarea,.linegrid input,.linegrid select{width:100%;border:1px solid #cbd6de;border-radius:7px;padding:9px 10px;font:inherit;font-size:15px;background:#fff;color:#17232c}.searchrow input{margin-bottom:8px}.resultmeta{display:flex;justify-content:space-between;align-items:center;color:#667788;font-size:13px;margin-top:8px}.list{max-height:66vh;overflow:auto}.listitem{padding:13px 14px;border-bottom:1px solid #e4e9ed;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.listitem:hover{background:#fafbfc}.listitem.active{background:#f8e9ec;border-left:3px solid var(--red);padding-left:11px}.listitem b{font-size:15px}.sub{color:#6d7d8a;font-size:13px;margin-top:4px}.rightmeta{text-align:right;min-width:96px}.status{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;white-space:nowrap}.s-created{background:#eef1f3}.s-issued{background:#eaf3fb;color:#245d7b}.s-waiting_stock{background:#fff0ce;color:#7d5a08}.s-picked{background:#e9f3ff;color:#245b93}.s-shipped{background:#e6f5ec;color:#22663b}.s-voided{background:#f3e7e9;color:#842638}.detailhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.detailhead h2{font-size:24px;margin:0 0 5px}.detailmeta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;color:#647482;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.body{padding:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.section h3{font-size:16px;margin:0 0 12px}.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}.kv div span{display:block;color:#6b7a88;font-size:13px;margin-bottom:4px}.kv div strong{font-size:15px}.flags{display:flex;gap:16px;flex-wrap:wrap}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #e4e9ed;padding:10px 8px;white-space:nowrap}.table th{font-size:13px;color:#687986;background:#fafbfc}.table td{font-size:14px}.money{text-align:right!important}.timeline{display:grid;gap:8px}.event{border-left:3px solid #cbd7df;padding:6px 10px}.event b{font-size:14px}.event small{display:block;color:#71808d;margin-top:3px}.empty{padding:28px;text-align:center;color:#7d8993}.editor{padding:14px}.editbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.editbar .savepair{display:flex;gap:8px}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field{min-width:0}.field.w2{grid-column:span 2}.field.w4{grid-column:1/-1}.field label{display:block;color:#526473;font-size:13px;font-weight:700;margin-bottom:5px}.lineeditor{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}.linegrid{display:grid;grid-template-columns:170px minmax(180px,1fr) 100px 100px 115px 54px;gap:7px;align-items:center;padding:8px;border-bottom:1px solid #e3e8ec}.linegrid.head{background:#f7f9fa;font-size:13px;font-weight:700;color:#61717e}.linegrid .itemname{font-size:14px}.linegrid button{padding:7px}.editorbottom{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.modalback{position:fixed;inset:0;background:rgba(20,30,38,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal{background:#fff;width:min(540px,100%);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:18px}.modal h3{margin:0 0 8px;font-size:20px}.modal p{color:#667788;font-size:14px}.modal .field{margin:12px 0}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:22px;bottom:22px;background:#1f303c;color:#fff;border-radius:9px;padding:11px 14px;opacity:0;transform:translateY(8px);transition:.2s;z-index:200}.toast.show{opacity:1;transform:none}.dangertext{color:#a72b3d}.muted{color:#70808c}.hidden{display:none!important}
@media(max-width:980px){.app{grid-template-columns:1fr}.side{display:none}.workspace{grid-template-columns:1fr}.searchpane{position:static}.grid2{grid-template-columns:1fr}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.field.w4{grid-column:1/-1}.linegrid{grid-template-columns:150px minmax(170px,1fr) 90px 90px 105px 50px}}
@media(max-width:640px){.content{padding:12px}.topbar{padding:0 12px}.pagehead{align-items:center}.pagehead h1{font-size:23px}.workspace{gap:10px}.formgrid{grid-template-columns:1fr}.field.w2,.field.w4{grid-column:auto}.detailhead{display:block}.actions{justify-content:flex-start;margin-top:12px}.kv{grid-template-columns:1fr}.linegrid{min-width:760px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">CY</div><div><b>CY Web</b><small>Chihyuan Enterprise<br>Management System</small></div></div>
    <div class="nav"><h4>業務</h4><div>客戶</div><div>商品</div><div class="active">銷售工單</div><div>委外</div><div>工作日誌</div><h4>管理</h4><div>設定</div><div>稽核紀錄</div></div>
  </aside>
  <main class="main">
    <div class="topbar"><b>銷售工單</b><span class="badge">Full Preview 0.1.30</span></div>
    <div class="content">
      <div class="pagehead"><div><h1>銷售工單</h1><p>完整瀏覽器內功能預覽：現場建單 → ERP 回填 → 撿貨／出貨／退回／作廢。</p></div><button class="btn primary" onclick="startNew()">新增工單</button></div>
      <div class="notice"><b>預覽環境：</b>所有資料只存在目前瀏覽器記憶體，重新整理即還原；不連 D1、不繞過 Identity。預覽工單編號格式僅供測試，不代表正式格式。</div>
      <div class="workspace">
        <section class="card searchpane">
          <div class="cardhead">
            <div class="eyebrow">工單搜尋</div><h2>搜尋與選擇工單</h2>
            <input id="search" placeholder="工單編號、ERP單號、客戶…" oninput="renderList()" style="width:100%;border:1px solid #cbd6de;border-radius:7px;padding:10px;font:inherit;font-size:15px">
            <div class="searchrow" style="margin-top:8px"><select id="statusFilter" onchange="renderList()"><option value="">全部狀態</option><option value="created">已建檔</option><option value="issued">已出單</option><option value="waiting_stock">等到貨</option><option value="picked">已撿貨</option><option value="shipped">已出貨</option><option value="voided">已作廢</option></select></div>
            <div class="resultmeta"><span id="count"></span><button class="btn" style="padding:5px 8px;font-size:12px" onclick="clearSearch()">清除條件</button></div>
          </div>
          <div class="list" id="list"></div>
        </section>
        <section class="card" id="detail"></section>
      </div>
    </div>
  </main>
</div>
<div class="modalback" id="erpModal"><div class="modal"><h3 id="erpTitle">回填 ERP 資料</h3><p>ERP 客戶編號必須精確對應既有客戶；不做模糊猜測。</p><div class="field"><label>ERP 客戶編號</label><input id="erpCustomerNo" placeholder="例如 C-00128"></div><div class="field"><label>ERP 銷貨單號</label><input id="erpNo" placeholder="例如 SA26090088"></div><div class="field"><label>更正／操作備註（選填）</label><input id="erpReason" placeholder="例如：原單號輸入錯誤"></div><div class="modalactions"><button class="btn" onclick="closeErp()">取消</button><button class="btn primary" onclick="applyErp()">確認</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const customers=[
{id:1,no:'C-00128',name:'示範中醫診所'},
{id:2,no:'C-00316',name:'和平中醫診所'},
{id:3,no:null,name:'新客戶接洽中'}
];
const items=[
{id:1,no:'A1001',name:'針灸針 0.25×30mm',spec:'100支/盒',base:'盒',units:['盒','箱'],prices:{盒:120,箱:2400}},
{id:2,no:'A2050',name:'酒精棉球',spec:'500g',base:'罐',units:['罐','箱'],prices:{罐:95,箱:1140}},
{id:3,no:'P3102',name:'拔罐杯替換杯',spec:'中型',base:'個',units:['個','包'],prices:{個:35,包:350}}
];
const statusText={created:'已建檔',issued:'已出單',waiting_stock:'等到貨',picked:'已撿貨',shipped:'已出貨',voided:'已作廢'};
let seq=4;
let orders=[
{id:1,ref:'PREVIEW-WO-001',customerId:1,customerNo:'C-00128',customerName:'示範中醫診所',orderDate:'2026-09-27',operator:'王OO',note:'下午送達',status:'created',erpNo:null,hidePrice:false,invoice:'three_copy',receipt:'with_receipt',revision:1,voidedAt:null,lines:[{itemId:1,no:'A1001',name:'針灸針 0.25×30mm',spec:'100支/盒',qty:'10',unit:'盒',price:'120',note:''},{itemId:2,no:'A2050',name:'酒精棉球',spec:'500g',qty:'3',unit:'罐',price:'95',note:''}],history:[]},
{id:2,ref:'PREVIEW-WO-002',customerId:2,customerNo:'C-00316',customerName:'和平中醫診所',orderDate:'2026-09-26',operator:'陳OO',note:'缺貨可分批通知',status:'issued',erpNo:'SA26090088',hidePrice:true,invoice:'two_copy',receipt:null,revision:3,voidedAt:null,lines:[{itemId:3,no:'P3102',name:'拔罐杯替換杯',spec:'中型',qty:'20',unit:'個',price:'35',note:''}],history:[{text:'回填 ERP 資料：C-00316 / SA26090088',at:'2026-09-26 15:20'}]},
{id:3,ref:'PREVIEW-WO-003',customerId:1,customerNo:'C-00128',customerName:'示範中醫診所',orderDate:'2026-09-25',operator:'王OO',note:'',status:'shipped',erpNo:'SA26090077',hidePrice:false,invoice:'three_copy',receipt:'without_receipt',revision:6,voidedAt:null,lines:[{itemId:1,no:'A1001',name:'針灸針 0.25×30mm',spec:'100支/盒',qty:'2',unit:'箱',price:'2400',note:''}],history:[{text:'已撿貨',at:'2026-09-25 14:10'},{text:'已出貨',at:'2026-09-25 16:40'}]}
];
let selectedId=1, editing=false, draft=null;
function nowText(){const d=new Date();return d.toLocaleString('zh-TW',{hour12:false}).replaceAll('/','-')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function statusTag(s){return `<span class="status s-${s}">${statusText[s]}</span>`}
function current(){return orders.find(o=>o.id===selectedId)||null}
function clearSearch(){document.getElementById('search').value='';document.getElementById('statusFilter').value='';renderList()}
function renderList(){const q=document.getElementById('search').value.trim().toLowerCase(),sf=document.getElementById('statusFilter').value;const rows=orders.filter(o=>(!sf||o.status===sf)&&(!q||[o.ref,o.erpNo,o.customerNo,o.customerName].some(v=>(v||'').toLowerCase().includes(q))));document.getElementById('count').textContent=`示範結果 ${rows.length} 筆`;document.getElementById('list').innerHTML=rows.map(o=>`<div class="listitem ${o.id===selectedId?'active':''}" onclick="selectOrder(${o.id})"><div><b>${esc(o.ref)}</b><div class="sub">${esc(o.customerName)}${o.erpNo?` · ERP ${esc(o.erpNo)}`:''}</div></div><div class="rightmeta"><div>${statusTag(o.status)}</div><div class="sub">${esc(o.orderDate)}</div></div></div>`).join('')||'<div class="empty">無符合工單</div>'}
function selectOrder(id){if(editing&&!confirm('目前有尚未儲存的修改，確定放棄並切換工單？'))return;editing=false;draft=null;selectedId=id;renderAll()}
function renderAll(){renderList();renderDetail()}
function renderDetail(){const root=document.getElementById('detail');const o=current();if(editing){renderEditor(root);return}if(!o){root.innerHTML='<div class="empty">請從左側選擇工單</div>';return}const actionButtons=[];if(o.status==='created'&&!o.erpNo){actionButtons.push(`<button class="btn" onclick="editCurrent()">修改</button>`,`<button class="btn primary" onclick="openErp()">回填 ERP 資料</button>`,`<button class="btn danger" onclick="deleteDraft()">刪除</button>`)}else if(o.status!=='voided'){actionButtons.push(`<button class="btn" onclick="openErp()">更正 ERP 資料</button>`);if(o.status==='issued')actionButtons.push(`<button class="btn warn" onclick="transition('waiting_stock')">等到貨</button>`,`<button class="btn primary" onclick="transition('picked')">確認撿貨</button>`);if(o.status==='waiting_stock')actionButtons.push(`<button class="btn primary" onclick="transition('picked')">確認撿貨</button>`);if(o.status==='picked')actionButtons.push(`<button class="btn primary" onclick="transition('shipped')">確認出貨</button>`);if(o.status==='shipped')actionButtons.push(`<button class="btn warn" onclick="reverseShipment()">取消出貨／退回已撿貨</button>`);actionButtons.push(`<button class="btn danger" onclick="voidOrder()">作廢工單</button>`)}
root.innerHTML=`<div class="detailhead"><div><h2>${esc(o.ref)} ${statusTag(o.status)}</h2><div class="detailmeta"><span>${esc(o.customerName)}</span><span>${o.customerNo?esc(o.customerNo):'未綁定 ERP 客戶'}</span><span>ERP：${o.erpNo?esc(o.erpNo):'尚未回填'}</span><span>rev.${o.revision}</span></div></div><div class="actions">${actionButtons.join('')}</div></div><div class="body"><div class="grid2"><div class="section"><h3>工單資料</h3><div class="kv"><div><span>日期</span><strong>${esc(o.orderDate)}</strong></div><div><span>業務／操作人</span><strong>${esc(o.operator)}</strong></div><div><span>客戶模式</span><strong>${o.customerId?'已連結客戶':'現場僅輸入名稱'}</strong></div><div><span>最後狀態</span><strong>${statusText[o.status]}</strong></div></div></div><div class="section"><h3>文件設定</h3><div class="flags"><span>${o.hidePrice?'✓ 銷貨單不印價格':'顯示價格'}</span><span>${o.invoice==='two_copy'?'二聯單':o.invoice==='three_copy'?'三聯單':'未指定聯式'}</span><span>${o.receipt==='with_receipt'?'附收據':o.receipt==='without_receipt'?'不附收據':'未指定收據'}</span></div><div class="sub" style="margin-top:10px">備註：${esc(o.note)||'—'}</div></div></div><div class="section"><h3>商品明細</h3><div class="tablewrap"><table class="table"><thead><tr><th>品號</th><th>品名／規格</th><th>數量</th><th>單位</th><th class="money">單價</th><th>備註</th></tr></thead><tbody>${o.lines.map(l=>`<tr><td>${esc(l.no)}</td><td><b>${esc(l.name)}</b><div class="sub">${esc(l.spec)}</div></td><td>${esc(l.qty)}</td><td>${esc(l.unit)}</td><td class="money">${esc(l.price)}</td><td>${esc(l.note)||'—'}</td></tr>`).join('')}</tbody></table></div></div><div class="section"><h3>流程／重要操作紀錄</h3><div class="timeline">${o.history.length?o.history.slice().reverse().map(h=>`<div class="event"><b>${esc(h.text)}</b><small>${esc(h.at)}</small></div>`).join(''):'<div class="muted">尚無重要流程紀錄；一般草稿修改不建立逐欄歷史。</div>'}</div></div></div>`}
function startNew(){if(editing&&!confirm('放棄目前修改並新增工單？'))return;editing=true;selectedId=null;draft={id:null,ref:null,customerMode:'linked',customerId:1,customerName:'',orderDate:'2026-09-27',operator:'王OO',note:'',hidePrice:false,invoice:null,receipt:null,lines:[blankLine(1)]};renderAll()}
function editCurrent(){const o=current();if(!o||o.status!=='created'||o.erpNo)return;editing=true;draft={...JSON.parse(JSON.stringify(o)),customerMode:o.customerId?'linked':'name'};renderDetail()}
function blankLine(itemId=1){const i=items.find(x=>x.id===itemId)||items[0];return{itemId:i.id,no:i.no,name:i.name,spec:i.spec,qty:'1',unit:i.base,price:String(i.prices[i.base]??0),note:''}}
function renderEditor(root){const d=draft;root.innerHTML=`<div class="detailhead"><div><h2>${d.id?'修改草稿工單':'新增銷售工單'}</h2><div class="detailmeta"><span>僅 `+'`created`'+` 狀態可一般修改</span></div></div><div class="actions"><button class="btn" onclick="cancelEdit()">取消</button><button class="btn primary" onclick="saveDraft()">儲存</button></div></div><div class="editor"><div class="formgrid"><div class="field"><label>客戶輸入模式</label><select id="fMode" onchange="modeChanged()"><option value="linked" ${d.customerMode==='linked'?'selected':''}>選擇既有客戶</option><option value="name" ${d.customerMode==='name'?'selected':''}>現場僅輸入名稱</option></select></div><div class="field w2" id="linkedField"><label>既有客戶</label><select id="fCustomer">${customers.map(c=>`<option value="${c.id}" ${d.customerId===c.id?'selected':''}>${esc(c.no||'尚無ERP編號')} · ${esc(c.name)}</option>`).join('')}</select></div><div class="field w2" id="nameField"><label>現場客戶名稱</label><input id="fCustomerName" value="${esc(d.customerName||'')}" placeholder="僅保留文字，不自動猜客戶"></div><div class="field"><label>工單日期</label><input id="fDate" type="date" value="${esc(d.orderDate)}"></div><div class="field"><label>業務／操作人</label><select id="fOperator"><option ${d.operator==='王OO'?'selected':''}>王OO</option><option ${d.operator==='陳OO'?'selected':''}>陳OO</option></select></div><div class="field w4"><label>備註</label><textarea id="fNote" rows="2">${esc(d.note||'')}</textarea></div><div class="field"><label><input id="fHide" type="checkbox" ${d.hidePrice?'checked':''}> 銷貨單不印價格</label></div><div class="field"><label>發票聯式</label><select id="fInvoice"><option value="">未指定</option><option value="two_copy" ${d.invoice==='two_copy'?'selected':''}>二聯單</option><option value="three_copy" ${d.invoice==='three_copy'?'selected':''}>三聯單</option></select></div><div class="field"><label>收據</label><select id="fReceipt"><option value="">未指定</option><option value="with_receipt" ${d.receipt==='with_receipt'?'selected':''}>附收據</option><option value="without_receipt" ${d.receipt==='without_receipt'?'selected':''}>不附收據</option></select></div></div><div class="editbar" style="margin-top:18px"><h3 style="margin:0">商品明細</h3><button class="btn" onclick="addLine()">＋ 增加商品</button></div><div class="lineeditor"><div class="linegrid head"><div>商品</div><div>品名／規格</div><div>數量</div><div>單位</div><div>單價</div><div></div></div><div id="lineRows"></div></div><div class="editorbottom"><button class="btn" onclick="cancelEdit()">取消</button><button class="btn primary" onclick="saveDraft()">儲存</button></div></div>`;modeChanged(false);renderLineRows()}
function modeChanged(sync=true){const mode=document.getElementById('fMode')?.value||draft.customerMode;if(sync)draft.customerMode=mode;document.getElementById('linkedField')?.classList.toggle('hidden',mode!=='linked');document.getElementById('nameField')?.classList.toggle('hidden',mode!=='name')}
function renderLineRows(){const e=document.getElementById('lineRows');if(!e)return;e.innerHTML=draft.lines.map((l,idx)=>{const it=items.find(x=>x.id===l.itemId)||items[0];return`<div class="linegrid"><select onchange="changeLineItem(${idx},this.value)">${items.map(i=>`<option value="${i.id}" ${i.id===l.itemId?'selected':''}>${esc(i.no)}</option>`).join('')}</select><div class="itemname"><b>${esc(it.name)}</b><div class="sub">${esc(it.spec)}</div></div><input value="${esc(l.qty)}" oninput="draft.lines[${idx}].qty=this.value" inputmode="decimal"><select onchange="draft.lines[${idx}].unit=this.value">${it.units.map(u=>`<option ${u===l.unit?'selected':''}>${esc(u)}</option>`).join('')}</select><input value="${esc(l.price)}" oninput="draft.lines[${idx}].price=this.value" inputmode="decimal"><button class="btn danger" onclick="removeLine(${idx})">×</button></div>`}).join('')}
function changeLineItem(idx,val){const it=items.find(i=>i.id===Number(val));draft.lines[idx]=blankLine(it.id);renderLineRows()}
function addLine(){draft.lines.push(blankLine(1));renderLineRows()}
function removeLine(idx){if(draft.lines.length===1){toast('至少需要 1 筆商品');return}draft.lines.splice(idx,1);renderLineRows()}
function decimalOk(v,positive=false){return /^\d+(?:\.\d{1,4})?$/.test(v)&&Number(v)>=(positive?Number.EPSILON:0)}
function collectEditor(){const mode=document.getElementById('fMode').value;draft.customerMode=mode;draft.customerId=mode==='linked'?Number(document.getElementById('fCustomer').value):null;draft.customerName=mode==='name'?document.getElementById('fCustomerName').value.trim():'';draft.orderDate=document.getElementById('fDate').value;draft.operator=document.getElementById('fOperator').value;draft.note=document.getElementById('fNote').value.trim();draft.hidePrice=document.getElementById('fHide').checked;draft.invoice=document.getElementById('fInvoice').value||null;draft.receipt=document.getElementById('fReceipt').value||null}
function saveDraft(){collectEditor();if(!draft.orderDate){toast('工單日期必填');return}if(draft.customerMode==='name'&&!draft.customerName){toast('現場客戶名稱必填');return}for(const l of draft.lines){if(!decimalOk(l.qty,true)){toast('數量需大於 0，最多 4 位小數');return}if(!decimalOk(l.price,false)){toast('單價不可小於 0，最多 4 位小數');return}}
let customer=null;if(draft.customerMode==='linked'){customer=customers.find(c=>c.id===draft.customerId);if(!customer){toast('客戶不存在');return}}
const lines=draft.lines.map(l=>{const i=items.find(x=>x.id===l.itemId);return{...l,no:i.no,name:i.name,spec:i.spec}});if(draft.id){const o=orders.find(x=>x.id===draft.id);Object.assign(o,{customerId:customer?.id||null,customerNo:customer?.no||null,customerName:customer?.name||draft.customerName,orderDate:draft.orderDate,operator:draft.operator,note:draft.note,hidePrice:draft.hidePrice,invoice:draft.invoice,receipt:draft.receipt,lines,revision:o.revision+1});selectedId=o.id}else{const id=seq++;const o={id,ref:`PREVIEW-WO-${String(id).padStart(3,'0')}`,customerId:customer?.id||null,customerNo:customer?.no||null,customerName:customer?.name||draft.customerName,orderDate:draft.orderDate,operator:draft.operator,note:draft.note,status:'created',erpNo:null,hidePrice:draft.hidePrice,invoice:draft.invoice,receipt:draft.receipt,revision:1,voidedAt:null,lines,history:[]};orders.unshift(o);selectedId=id}editing=false;draft=null;toast('已儲存預覽資料');renderAll()}
function cancelEdit(){if(!confirm('取消並放棄尚未儲存的修改？'))return;editing=false;draft=null;if(selectedId==null&&orders.length)selectedId=orders[0].id;renderAll()}
function openErp(){const o=current();if(!o||o.status==='voided')return;document.getElementById('erpTitle').textContent=o.erpNo?'更正 ERP 資料':'回填 ERP 資料';document.getElementById('erpCustomerNo').value=o.customerNo||'';document.getElementById('erpNo').value=o.erpNo||'';document.getElementById('erpReason').value='';document.getElementById('erpModal').style.display='flex'}
function closeErp(){document.getElementById('erpModal').style.display='none'}
function applyErp(){const o=current(),cn=document.getElementById('erpCustomerNo').value.trim(),en=document.getElementById('erpNo').value.trim(),reason=document.getElementById('erpReason').value.trim();const c=customers.find(x=>x.no===cn);if(!c){toast('ERP 客戶編號必須精確對應既有客戶');return}if(!en){toast('ERP 銷貨單號必填');return}const first=!o.erpNo;const before=`${o.customerNo||'未綁定'} / ${o.erpNo||'未回填'}`;o.customerId=c.id;o.customerNo=c.no;o.customerName=c.name;o.erpNo=en;if(o.status==='created')o.status='issued';o.revision++;o.history.push({text:`${first?'回填':'更正'} ERP 資料：${before} → ${c.no} / ${en}${reason?`（${reason}）`:''}`,at:nowText()});closeErp();toast(first?'ERP 資料已回填，工單進入已出單':'ERP 資料已更正');renderAll()}
function transition(to){const o=current();const allowed=(o.status==='issued'&&['waiting_stock','picked'].includes(to))||(o.status==='waiting_stock'&&to==='picked')||(o.status==='picked'&&to==='shipped');if(!allowed||!o.erpNo){toast('目前狀態不可執行此操作');return}const from=o.status;o.status=to;o.revision++;o.history.push({text:`${statusText[from]} → ${statusText[to]}`,at:nowText()});toast(`已更新為${statusText[to]}`);renderAll()}
function reverseShipment(){const o=current();if(!o||o.status!=='shipped'){toast('只有已出貨工單可取消出貨');return}if(!confirm('確定取消出貨，將工單退回「已撿貨」？'))return;o.status='picked';o.revision++;o.history.push({text:'取消出貨：已出貨 → 已撿貨',at:nowText()});toast('已退回已撿貨');renderAll()}
function voidOrder(){const o=current();if(!o||!['issued','waiting_stock','picked','shipped'].includes(o.status)){toast('目前狀態不可作廢');return}const reason=prompt('作廢原因（預覽可留空）','')??null;if(reason===null)return;if(!confirm('確定作廢此工單？作廢後不再繼續履約流程。'))return;const from=o.status;o.status='voided';o.voidedAt=nowText();o.revision++;o.history.push({text:`作廢工單：${statusText[from]} → 已作廢${reason?`（${reason}）`:''}`,at:o.voidedAt});toast('工單已作廢');renderAll()}
function deleteDraft(){const o=current();if(!o||o.status!=='created'||o.erpNo){toast('只有尚未 ERP 回填的已建檔工單可刪除');return}if(!confirm(`確定刪除 ${o.ref}？`))return;orders=orders.filter(x=>x.id!==o.id);selectedId=orders[0]?.id??null;toast('預覽工單已刪除');renderAll()}
renderAll();
</script>
</body>
</html>
